  async function saveDadRound(round) {
    // Ensure stars meets DB check constraint (must be >= 1)
    const safeRound = { ...round, stars: Math.max(1, round.stars || 1) };
    if (safeRound.reflection) safeRound.reflection = { ...safeRound.reflection, stars: Math.max(1, safeRound.reflection.stars || 1) };
    const { error } = await _sb.from('dad_rounds').insert([safeRound]);
    if (error) throw error;
  }

  // Upload any base64 hole photos to Supabase Storage and replace with public URLs
  async function uploadRoundPhotos(roundId) {
    for (const h of _famHoles) {
      if (!h.photo || h.photo.startsWith('http')) continue; // skip nulls and already-uploaded URLs
      try {
        const res  = await fetch(h.photo);
        const blob = await res.blob();
        const path = `${roundId}/hole-${h.hole}.jpg`;
        const { error } = await _sb.storage.from('round-photos').upload(path, blob, {
          contentType: 'image/jpeg',
          upsert: true,
        });
        if (!error) {
          const { data } = _sb.storage.from('round-photos').getPublicUrl(path);
          h.photo = data.publicUrl; // replace base64 with persistent URL
        }
      } catch(e) {
        console.warn('Photo upload failed for hole', h.hole, e);
        // Non-fatal — photo won't persist but round saves fine
      }
    }
  }

  async function loadCustomCourses() {

      _customCourses = data.map(c => ({
        name:      c.name,
        par:       c.par,
        holes:     c.holes,
        holePars:  Array.isArray(c.hole_pars)  ? c.hole_pars  : (c.hole_pars  ? JSON.parse(c.hole_pars)  : null),
        yardages:  Array.isArray(c.yardages)   ? c.yardages   : (c.yardages   ? JSON.parse(c.yardages)   : null),
        teeColor:  c.tee_color || null,
        _supabaseId: c.id,
        _custom:   true,
      }));
    } catch(e) {
      console.warn('Could not load custom courses:', e);
    }
  }

  function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = `
      position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
      background:${type==='success'?'var(--green)':'var(--red)'};
      color:var(--cream);padding:10px 20px;border-radius:20px;
      font-size:0.85rem;font-weight:600;z-index:9999;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:opacity 0.4s;
    `;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},2500);
  }

  let currentProfile = 'dad';
  function applyProfile(who) {
    currentProfile = who;
    const isDad     = who === 'dad';
    const isSon     = who === 'son';
    const isGirl    = who === 'girl';
    const isGrandma = who === 'grandma';
    const isMom     = who === 'mom';

    document.body.classList.toggle('girl-mode',    isGirl);
    document.body.classList.toggle('grandma-mode', isGrandma);
    document.body.classList.toggle('mom-mode',     isMom);
    document.querySelectorAll('.dad-sect')    .forEach(el => el.style.display = isDad     ? 'block' : 'none');
    document.querySelectorAll('.son-sect')    .forEach(el => el.style.display = isSon     ? (el.classList.contains('nav-btn') ? 'flex' : 'block') : 'none');
    document.querySelectorAll('.girl-sect')   .forEach(el => el.style.display = isGirl    ? (el.classList.contains('nav-btn') ? 'flex' : 'block') : 'none');
    document.querySelectorAll('.grandma-sect').forEach(el => el.style.display = isGrandma ? (el.classList.contains('nav-btn') ? 'flex' : 'block') : 'none');
    document.querySelectorAll('.mom-sect')    .forEach(el => el.style.display = isMom     ? (el.classList.contains('nav-btn') ? 'flex' : 'block') : 'none');
    const subs = { dad: '⛳ Lefty · Sub-90 Journey', son: '⛳ Righty · Junior · Have Fun!', girl: '⛳ Lefty · Age 5 · Pure Fun!', grandma: '⛳ Righty · Welcome Back · Lynx Lady', mom: '⛳ Righty · Beginner · Welcome to the Range' };
    document.getElementById('topbarSub').textContent = subs[who];
    document.getElementById('btnDad')    .classList.toggle('active', isDad);
    document.getElementById('btnSon')    .classList.toggle('active', isSon);
    document.getElementById('btnGirl')   .classList.toggle('active', isGirl);
    document.getElementById('btnGrandma').classList.toggle('active', isGrandma);
    document.getElementById('btnMom')    .classList.toggle('active', isMom);
    localStorage.setItem('sv-profile', who);
    // Short Game shows for all profiles — content adapts per profile
    // (no hiding needed)
    // Strip pre-render classes — JS owns display state from here
    document.documentElement.classList.remove('pre-son', 'pre-girl', 'pre-grandma', 'pre-mom');
    // Progress page removed — no session/notes rendering needed
  }

  function showApp() {
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }

  function enterProfile(who) {
    // Called from landing page cards — fade landing out, show app
    sessionStorage.setItem('sv-session', '1'); // mark session active
    applyProfile(who);
    document.getElementById('app').style.display = 'flex';
    const landing = document.getElementById('landing');
    landing.classList.add('hidden');
    setTimeout(() => { landing.style.display = 'none'; }, 380);
    showPage('home');
  }

  function switchProfile(who) {
    // Called from topbar pills — stay in app, no landing
    applyProfile(who);
    document.querySelectorAll('.exp-trigger.open').forEach(t => t.classList.remove('open'));
    document.querySelectorAll('.exp-body.open').forEach(b => b.classList.remove('open'));
    showPage('home');
  }

  function goToLanding() {
    // Strip !important pre-render classes FIRST — otherwise they block
    // landing.style.display = 'flex' (CSS !important beats inline styles)
    document.documentElement.classList.remove('has-profile', 'pre-son', 'pre-girl', 'pre-grandma', 'pre-mom');
    document.body.classList.remove('son-mode', 'girl-mode', 'grandma-mode', 'mom-mode');
    // Now safe to show landing
    const landing = document.getElementById('landing');
    landing.style.display = 'flex';
    landing.classList.remove('hidden');
    document.getElementById('app').style.display = 'none';
    document.querySelectorAll('.exp-trigger.open').forEach(t => t.classList.remove('open'));
    document.querySelectorAll('.exp-body.open').forEach(b => b.classList.remove('open'));
  }

  function initProfile() {
    const saved = localStorage.getItem('sv-profile');
    const inSession = sessionStorage.getItem('sv-session');
    if (saved && inSession) {
      // Same session + known profile — skip landing (e.g. page reload mid-session)
      showApp();
      applyProfile(saved);
      showPage('home');
    }
    // else: fresh tab or first visit — landing stays visible
  }


  // ── GIRL SESSION LOG ──────────────────────────────────────────
  function logGirlSession() {
    const date    = document.getElementById('girl-sessionDate').value;
    const thought = document.getElementById('girl-sessionThought').value.trim();
    const notes   = document.getElementById('girl-sessionNotes').value.trim();
    if (!date) { alert('Please pick a date.'); return; }
    const sessions = store.get('girl_sessions') || [];
    sessions.unshift({ date, thought, notes, id: Date.now() });
    store.set('girl_sessions', sessions);
    document.getElementById('girl-sessionDate').value = '';
    document.getElementById('girl-sessionThought').value = '';
    document.getElementById('girl-sessionNotes').value = '';
    renderGirlSessions();
  }

  function renderGirlSessions() {
    const sessions = store.get('girl_sessions') || [];
    const el = document.getElementById('girl-sessionHistory');
    if (!el) return;
    if (!sessions.length) {
      el.innerHTML = '<div style="font-size:0.82rem;color:var(--muted);text-align:center;padding:20px 0;">No sessions yet.<br>Go have some fun! 🌈</div>';
      return;
    }
    el.innerHTML = sessions.map(s => {
      const d = new Date(s.date + 'T12:00:00');
      const mon = d.toLocaleString('default', { month: 'short' }).toUpperCase();
      const day = d.getDate();
      return `<div class="session-log-item">
        <div class="session-date">${mon}<br>${day}</div>
        <div class="session-note"><strong>${s.thought || 'Session'}</strong>${s.notes || '<span style="font-style:italic;opacity:0.6;">No notes</span>'}</div>
        <button class="delete-btn" onclick="deleteGirlSession(${s.id})">✕</button>
      </div>`;
    }).join('');

  // Returns a score chip span using golf-standard color coding
  function scoreChip(score, par) {
    const d = score - par;
    let cls;
    if (d <= -2)     cls = 'sc-chip sc-eagle';
    else if (d === -1) cls = 'sc-chip sc-birdie';
    else if (d === 0)  cls = 'sc-chip sc-par';
    else if (d === 1)  cls = 'sc-chip sc-bogey';
    else if (d === 2)  cls = 'sc-chip sc-double';
    else               cls = 'sc-chip sc-triple';
    return `<span class="${cls}">${score}</span>`;
  }

  function getClubDist(name) {
    // Settings/Supabase distances are the source of truth for suggestions
    const active = getActiveClubs().find(c => c.name === name);
    if (active) return active.dist;
    // Legacy fallback: per-shot rolling average (sv-clubs) if club not in active list
    const saved = JSON.parse(localStorage.getItem('sv-clubs') || '{}');
    return saved[name] !== undefined ? saved[name] : 100;
  }

  function recordClubHit(clubName, yards) {
    if (!yards || yards < 10 || yards > 370) return;
    const saved = JSON.parse(localStorage.getItem('sv-clubs') || '{}');
    const n   = (saved[clubName + '_n'] || 0) + 1;
    const old = saved[clubName] !== undefined
      ? saved[clubName]
      : (CLUBS.find(c => c.name === clubName)?.dist || 100);
    saved[clubName]        = Math.round((old * (n - 1) + yards) / n);
    saved[clubName + '_n'] = n;
    localStorage.setItem('sv-clubs', JSON.stringify(saved));
  }

  function suggestClub(yards) {
    if (!yards || yards < 1) return null;
    // Driver excluded from approach suggestions — 7-Wood IS available for long layups (170+ yds)
    const approachClubs = getActiveClubs().filter(c => c.name !== 'Driver');
    const ranked = approachClubs.map(c => ({ ...c, avg: getClubDist(c.name) }))
                                .sort((a, b) => a.avg - b.avg);
    // Best fit: can reach AND not more than 40 yds overkill
    // Sorted ascending so goodFit[0] is always the shortest sufficient club
    const goodFit = ranked.filter(c => c.avg >= yards && c.avg <= yards + 40);
    if (goodFit.length) return goodFit[0];
    // Can reach (might be significant overkill) — still pick shortest available
    const canReach = ranked.filter(c => c.avg >= yards);
    if (canReach.length) return canReach[0];
    // Nothing can reach — return the longest club available
    return ranked[ranked.length - 1];
  }

  function clubNote(club, yards) {
    if (!club) return '';
    const avg  = getClubDist(club.name);
    const n    = JSON.parse(localStorage.getItem('sv-clubs') || '{}')[club.name + '_n'] || 0;
    const diff = avg - yards;

    // Swing tips by club type
    const tips = {
      'Driver':   'tee low, ball forward off lead instep, sweep up — 60–70% tempo',
      '7-Wood':   'ball just inside lead instep, sweep through, 80% tempo — let it release',
      '4-Hybrid': 'ball lead-of-center, sweep with hip fire — 70% swing, let it run',
      '4-iron':   'ball slightly lead-of-center, compress down and through',
      '5-iron':   'ball lead-of-center, weight forward, compress',
      '6-iron':   'ball center-to-lead, divot after the ball, full finish',
      '7-iron':   'ball center, weight shifts to lead side — divot right of ball',
      '8-iron':   'ball center, hands forward, ball-first contact',
      '9-iron':   'ball center, trust the loft — hit down, let it fly',
      'PW':       'ball center, hands ahead, 80% swing — distance control over power',
      'GW':       '70–90 yds zone — find your reliable carry, don\'t max it',
      'SW':       'ball center-to-forward, light grip, accelerate through',
      'LW':       'ball forward, open face slightly, hinge and hold — soft landing',
    };
    const swingTip = tips[club.name] || '';

    if (avg < yards) return `max club — ${yards - avg} yds short · aim at front, let it run`;
    if (n === 0)   return `default estimate · ${swingTip}`;
    if (diff <= 5) return `tight fit — one more club? · ${swingTip}`;
    return `avg ${avg} yds · ${diff > 0 ? diff + ' yds buffer' : 'right on'} · ${swingTip}`;
  }

  // ── GPS ───────────────────────────────────────────────────────
  let _gpsWatchId = null, _currentPos = null, _markedPos = null;
  let _manualYards = null, _selectedApproachClub = null;

  function startGPS() {
    if (!('geolocation' in navigator)) return;
    _currentPos = null; _markedPos = null; _manualYards = null; _selectedApproachClub = null;
    _gpsWatchId = navigator.geolocation.watchPosition(
      p => {
        _currentPos = { lat: p.coords.latitude, lng: p.coords.longitude,
                        acc: Math.round(p.coords.accuracy * 1.094) };
        refreshGPSDisplay();
      },
      () => {},
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 3000 }
    );
  }

  // ── WAKE LOCK (keeps screen on during round, does NOT affect audio/Spotify) ──
  let _wakeLock = null;
  async function _acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    } catch(e) { /* silently ignore — not critical */ }
  }
  function _releaseWakeLock() {
    if (_wakeLock) { _wakeLock.release(); _wakeLock = null; }
  }

  function stopGPS() {
    if (_gpsWatchId !== null) {
      navigator.geolocation.clearWatch(_gpsWatchId); _gpsWatchId = null;
    }
    _currentPos = null; _markedPos = null; _manualYards = null; _selectedApproachClub = null;
  }

  function markBall() {
    if (!_currentPos) {
      // No GPS — apply manually typed yardage if present
      const inp = document.getElementById('live-yardage-input');
      if (inp && inp.value) {
        setManualYards(inp.value);
        const btn = document.querySelector('.mark-ball-btn');
        if (btn) btn.classList.add('marked');
        showToast('Yardage set ✓');
      } else {
        showToast('No GPS — type yardage in the field above', 'error');
      }
      return;
    }
    _markedPos = { ..._currentPos };
    const btn = document.querySelector('.mark-ball-btn');
    if (btn) btn.classList.add('marked');
    showToast('Ball marked ✓');
    refreshGPSDisplay();
  }

  function refreshGPSDisplay() {
    const yEl = document.getElementById('live-yards');
    const aEl = document.getElementById('live-gps-acc');
    if (!yEl) return;
    if (_manualYards !== null) {
      yEl.textContent = _manualYards;
      if (aEl) aEl.innerHTML = '<span class="gps-dot marked"></span>manual entry';
      refreshClubSuggestion(_manualYards); return;
    }
    if (!_currentPos) {
      yEl.textContent = '—';
      if (aEl) aEl.innerHTML = '<span class="gps-dot"></span>finding GPS…'; return;
    }
    if (!_markedPos) {
      yEl.textContent = '—';
      if (aEl) aEl.innerHTML = `<span class="gps-dot ready"></span>GPS ready (±${_currentPos.acc} yds) · tap Mark Ball at your ball`; return;
    }
    yEl.textContent = '—';
    if (aEl) aEl.innerHTML = `<span class="gps-dot marked"></span>ball marked (±${_markedPos.acc} yds) · now enter yardage from a marker`;
  }

  function setManualYards(val) {
    const n = parseInt(val);
    if (!val || isNaN(n) || n < 1) {
      _manualYards = null;
      const yEl = document.getElementById('live-yards');
      if (yEl) yEl.textContent = '—';
      const s = document.getElementById('live-club-suggest');
      if (s) s.style.display = 'none'; return;
    }
    _manualYards = n;
    const yEl = document.getElementById('live-yards');
    if (yEl) yEl.textContent = n;

    const sldr = document.getElementById('live-yardage-slider');

    const el = document.getElementById('live-club-suggest');

    // All clubs except Driver — reversed so SHORT clubs are LEFT, LONG clubs RIGHT

    const approachClubs = [...getActiveClubs().filter(c => c.name !== 'Driver')].reverse();

  // ── IN-PROGRESS ROUND PERSISTENCE ────────────────────────────
  const _ROUND_DRAFT_KEY = 'spinvibes-round-scores';
  function _saveDraftRound() {
    try {
      localStorage.setItem(_ROUND_DRAFT_KEY, JSON.stringify({
        round: _dadRound,
        holes: _dadHoles,
        holeIdx: _dadHoleIdx,
        ts: Date.now()
      }));
    } catch(e) {}
  }
  function _clearDraftRound() {
    try { localStorage.removeItem(_ROUND_DRAFT_KEY); } catch(e) {}

    try { return JSON.parse(localStorage.getItem(_ROUND_DRAFT_KEY)); } catch(e) { return null; }
  }

    dadHoleSave();
    if (_selectedApproachClub && _manualYards) recordClubHit(_selectedApproachClub, _manualYards);

    _dadHoles[_dadHoleIdx].approach_yds  = _manualYards || null;

      || (_manualYards ? (suggestClub(_manualYards)?.name || null) : null);

  function dadMidRoundScorecard() {
    dadHoleSave();
    const total    = _dadHoles.reduce((a, h) => a + h.score, 0);
    const totalPar = _dadHoles.reduce((a, h) => a + h.par, 0);
    const diff     = total - totalPar;
    const diffStr  = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : String(diff));
    const thru     = _dadHoleIdx + 1;
    const diffColor = diff < 0 ? '#1E7A3A' : diff === 0 ? 'var(--muted)' : '#c0392b';

    // Split into front/back nines
    const front = _dadHoles.slice(0, 9);
    const back  = _dadHoles.slice(9);

    function buildGrid(holes, label) {
      if (!holes.length) return '';
      const holeNums  = holes.map(h => `<td style="text-align:center;font-size:0.62rem;font-weight:700;color:var(--muted);padding:5px 4px;letter-spacing:0.5px;">${h.hole}</td>`).join('');
      const pars      = holes.map(h => `<td style="text-align:center;font-size:0.72rem;color:var(--muted);padding:4px;">${h.par}</td>`).join('');
      const yds       = holes.map(h => `<td style="text-align:center;font-size:0.6rem;color:var(--muted);padding:3px;opacity:0.7;">${h.yds || '—'}</td>`).join('');
      let running = 0;
      holes.forEach(h => { running += h.score - h.par; });
      const scores = holes.map((h, idx) => {
        const isThru = _dadHoles.indexOf(h) < thru;
        const isCur  = _dadHoles.indexOf(h) === _dadHoleIdx;
        const chip   = isThru ? scoreChip(h.score, h.par) : `<span style="font-size:0.72rem;color:var(--border);font-weight:600;">·</span>`;
        const cur    = isCur ? `style="background:rgba(138,96,16,0.08);border-radius:4px;"` : '';
        return `<td ${cur} style="text-align:center;padding:4px 2px;">${chip}</td>`;
      }).join('');

      // Subtotal column
      const nineScore = holes.filter((_,i) => _dadHoles.indexOf(holes[i]) < thru).reduce((a,h) => a + h.score, 0);
      const ninePar   = holes.filter((_,i) => _dadHoles.indexOf(holes[i]) < thru).reduce((a,h) => a + h.par, 0);
      const nineDiff  = nineScore - ninePar;
      const nineDiffStr = nineScore === 0 ? '' : (nineDiff === 0 ? 'E' : (nineDiff > 0 ? '+'+nineDiff : String(nineDiff)));
      const nineColor = nineDiff < 0 ? '#1E7A3A' : nineDiff === 0 ? 'var(--muted)' : '#c0392b';

      return `
        <div style="margin-bottom:10px;">
          <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
            <colgroup><col style="width:38px;"><col span="${holes.length}" style="width:auto;"><col style="width:38px;"></colgroup>
            <thead>
              <tr style="background:var(--green);">

  }

  // ── DAD ROUND RENDER ─────────────────────────────────────────
  async function loadDadRoundsAndRender() {
    const listEl = document.getElementById('dad-history-list');
    listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.85rem;"><i class="ti ti-loader-2" style="font-size:1.1rem;vertical-align:-2px;"></i> Loading your rounds…</div>';
    if (!_sb) {
      listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:0.85rem;">Supabase SDK not loaded — reload the page</div>';
      return;
    }
    try {
      const rounds = await loadDadRounds();
      _dadLoadedRounds = rounds; // cache for editing
      renderDadHistory(rounds);
      refreshDadBestRound(rounds); // update home hero from live data
    } catch(e) {
      console.error('[SpinVibes] loadDadRounds error:', e);
      listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--red);font-size:0.85rem;">Error: ${e?.message || 'unknown'}</div>`;
    }
  }

  // Helper: is this a regulation 18-hole round?
  // Checks explicit round_type first (new rounds), falls back to course_par inference (legacy)
  function isRegulationRound(r) {
    if ((r.course_par || 0) < 65) return false; // safety net — par-3/exec always excluded
    if (r.round_type) return r.round_type === 'regulation_18';
    return true; // legacy rounds with course_par >= 65 assumed regulation
  }
  // Visual tag for non-regulation rounds
  function roundTypeTag(r) {
    if (r.round_type) {
      if (r.round_type === 'regulation_18') return '';
      if (r.round_type === 'nine_hole')     return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">9 HOLES</span>';
      if (r.round_type === 'par3_exec')     return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">PAR-3</span>';
      return '';
    }
    // Legacy fallback: infer from course_par
    if (!r.course_par || r.course_par >= 60) return '';
    if (r.course_par <= 36) return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">9 HOLES</span>';
    return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">PAR-3</span>';
  }

  function renderDadHistory(rounds) {
    const listEl = document.getElementById('dad-history-list');
    const statsBar = document.getElementById('dad-stats-bar');
    if (!rounds || rounds.length === 0) { rounds = []; }
    statsBar.style.display = 'none';
    // Stats — scored rounds only (all non-practice for history display)
    const scoredRounds = rounds.filter(r => !r.is_practice);
    // Best/avg only count regulation 18-hole rounds (par 60+)
    const regulationRounds = scoredRounds.filter(r => isRegulationRound(r));
    if (scoredRounds.length >= 1) {
      statsBar.style.display = '';
      const regSorted  = [...regulationRounds].sort((a,b) => new Date(a.date_played) - new Date(b.date_played));
      const allSorted  = [...scoredRounds].sort((a,b) => new Date(a.date_played) - new Date(b.date_played));
      const last       = allSorted[allSorted.length - 1];
      const prevReg    = regSorted.length >= 2 ? regSorted[regSorted.length - 2] : null;
      const lastReg    = regSorted[regSorted.length - 1] || last;
      const scoreDelta = prevReg ? lastReg.total_score - prevReg.total_score : null;
      // Best and avg only from regulation rounds (fallback to all if no regulation rounds yet)
      const statsPool  = regulationRounds.length >= 1 ? regulationRounds : scoredRounds;
      const best       = statsPool.reduce((a,r) => r.total_score < a.total_score ? r : a);
      const avg        = Math.round(statsPool.reduce((a,r) => a + r.total_score, 0) / statsPool.length);
      // Update home screen best score dynamically
      const homeBestEl = document.getElementById('dad-home-best');
      if (homeBestEl) {
        const bd = new Date(best.date_played + 'T12:00:00');
        const bLabel = bd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        homeBestEl.textContent = `Best: ${best.total_score} — ${bLabel}`;
      }

      // Per-round hole stats
      const allHolesData = scoredRounds.map(r => Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]'));
      const firhits = allHolesData.map(hs => {
        const par4plus = hs.filter(h => h.par >= 4);
        if (!par4plus.length) return null;
        return par4plus.filter(h => h.fairway === 'yes').length / par4plus.length;
      }).filter(v => v !== null);
      const girHits = allHolesData.map(hs => {
        if (!hs.length) return null;
        return hs.filter(h => h.gir).length / hs.length;
      }).filter(v => v !== null);
      const puttTotals = allHolesData.map(hs => hs.length ? hs.reduce((a,h)=>a+(h.putts||0),0) : null).filter(v=>v!==null);

      const firPct  = firhits.length ? Math.round(firhits.reduce((a,b)=>a+b,0)/firhits.length*100) : null;
      const girPct  = girHits.length ? Math.round(girHits.reduce((a,b)=>a+b,0)/girHits.length*100) : null;
      const avgPutts = puttTotals.length ? (puttTotals.reduce((a,b)=>a+b,0)/puttTotals.length).toFixed(1) : null;

      // Sparkline bars (last 8 regulation rounds)
      const sparkRounds = (regSorted.length >= 2 ? regSorted : allSorted).slice(-8);
      const sparkMin = Math.min(...sparkRounds.map(r=>r.total_score));
      const sparkMax = Math.max(...sparkRounds.map(r=>r.total_score));
      const sparkRange = sparkMax - sparkMin || 1;
      const sparkBars = sparkRounds.map((r,i) => {
        const pct = 100 - Math.round(((r.total_score - sparkMin) / sparkRange) * 70);
        const isLast = i === sparkRounds.length - 1;
        return `<div style="flex:1;height:${pct}%;min-height:15%;background:${isLast ? '#8a6010' : 'var(--border)'};border-radius:2px 2px 0 0;"></div>`;
      }).join('');

      const deltaColor = scoreDelta === null ? 'var(--muted)' : scoreDelta < 0 ? '#1E7A3A' : scoreDelta > 0 ? '#c0392b' : 'var(--muted)';
      const deltaStr   = scoreDelta === null ? '' : scoreDelta < 0 ? `↓ ${Math.abs(scoreDelta)} from last` : scoreDelta > 0 ? `↑ ${scoreDelta} from last` : '= Same as last';

      document.getElementById('dad-stats-row').innerHTML = `
        <!-- Hero stat + sparkline -->
        <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;">
            <div>
              <div style="font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:4px;">LAST ROUND</div>
              <div style="display:flex;align-items:baseline;gap:8px;">
                <div style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--cream);line-height:1;">${last.total_score}</div>
                ${scoreDelta !== null ? `<div style="font-size:0.75rem;font-weight:700;color:${deltaColor};">${deltaStr}</div>` : ''}
              </div>
              <div style="font-size:0.68rem;color:var(--muted);margin-top:3px;">${last.course_name || '—'}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:0.58rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px;">BEST</div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);line-height:1;">${best.total_score}</div>
              <div style="font-size:0.6rem;color:var(--muted);">${statsPool.length} reg rounds · avg ${avg}</div>
            </div>
          </div>
          <!-- Sparkline -->
          <div style="display:flex;align-items:flex-end;gap:3px;height:32px;margin-top:10px;">
            ${sparkBars}
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:3px;">
            <div style="font-size:0.55rem;color:var(--muted);">${sparkRounds[0]?.date_played?.slice(5) || ''}</div>
            <div style="font-size:0.55rem;color:var(--gold);font-weight:600;">← recent</div>
          </div>
        </div>
        <!-- Secondary stats row -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          ${firPct !== null ? `
            <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);line-height:1;">${firPct}%</div>
              <div style="font-size:0.58rem;font-weight:700;letter-spacing:1px;color:var(--muted);margin-top:2px;">FIR</div>
            </div>` : ''}
          ${girPct !== null ? `
            <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);line-height:1;">${girPct}%</div>
              <div style="font-size:0.58rem;font-weight:700;letter-spacing:1px;color:var(--muted);margin-top:2px;">GIR</div>
            </div>` : ''}
          ${avgPutts !== null ? `
            <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);line-height:1;">${avgPutts}</div>
              <div style="font-size:0.58rem;font-weight:700;letter-spacing:1px;color:var(--muted);margin-top:2px;">PUTTS</div>
            </div>` : ''}
        </div>
      `;
    } else {
      statsBar.style.display = 'none';
    }
    renderApproachStats(scoredRounds);

    // Achievements badges
    const dadBadgesHtml = scoredRounds.length >= 1 ? `
      <div class="section" style="padding-top:4px;padding-bottom:4px;">
        <div style="font-size:0.6rem;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:8px;">ACHIEVEMENTS</div>
        ${renderBadges(scoredRounds, '#8a6010')}
      </div>` : '';

    // Legacy hardcoded cards removed — all rounds now loaded from Supabase
    const legacyCards = '';

    listEl.innerHTML = dadBadgesHtml + rounds.map((r, idx) => {
      const d = new Date(r.date_played + 'T12:00:00');
      const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const diff = r.score_vs_par >= 0 ? '+' + r.score_vs_par : r.score_vs_par;
      const badgeClass = r.total_score < 90 ? 'green' : r.total_score <= 99 ? 'gold' : 'red';
      const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
      const holeGrid = holes.map(h => {
        const apprTip = h.approach_club ? ` title="${h.approach_club}${h.approach_yds ? ' · ' + h.approach_yds + 'y' : ''}"` : '';
        const apprDot = h.approach_club ? `<div style="font-size:0.55rem;color:var(--gold);line-height:1;margin-top:1px;">${h.approach_club.replace(' ','')}</div>` : '';
        return `<div class="hole-cell"${apprTip}><div class="h-num">${h.hole}</div><div class="h-score">${h.score}</div><div class="h-par">p${h.par}</div>${apprDot}</div>`;
      }).join('');
      const ref = r.reflection ? (typeof r.reflection === 'string' ? JSON.parse(r.reflection) : r.reflection) : {};
      const fairways = holes.filter(h => h.fairway === 'yes').length;
      const gir = holes.filter(h => h.gir).length;
      const totalPutts = holes.reduce((a,h) => a + (h.putts||0), 0);
      const approachHoles = holes.filter(h => h.approach_club);
      const approachLine = approachHoles.length
        ? `<div style="margin-bottom:8px;"><i class="ti ti-arrows-up-right" style="color:var(--gold);vertical-align:-1px;"></i> <strong>Approaches:</strong> ${approachHoles.map(h => `H${h.hole} ${h.approach_club}${h.approach_yds ? ' · ' + h.approach_yds + 'y' : ''}`).join(' &nbsp; ')}</div>`
        : '';
      const stars = '★'.repeat(r.stars || 0);
      const practiceBadge = r.is_practice
        ? `<span style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border:1px solid var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;">Practice</span>`
        : '';
      return `
        <div class="round-card" id="dad-round-${idx}">
          <div class="round-card-header" onclick="toggleRoundExpand('dad-round-${idx}')">
            <div class="round-card-left">
              <div class="round-card-date">${dateStr}${practiceBadge}${roundTypeTag(r)}</div>
              <div class="round-card-course">${r.course_name}</div>
            </div>
            <div class="round-card-right">
              <div class="round-badge ${badgeClass}">${r.total_score} <span style="font-size:0.75rem;opacity:0.7;">(${diff})</span></div>
            </div>
          </div>
          <div class="round-card-expand" id="dad-round-${idx}-expand">
            <div class="hole-grid">${holeGrid}</div>
            <div style="margin-bottom:8px;"><i class="ti ti-tournament" style="color:var(--muted);vertical-align:-1px;"></i> <strong>Putts:</strong> ${totalPutts} &nbsp; <i class="ti ti-flag-2" style="color:var(--muted);vertical-align:-1px;"></i> <strong>Fairways:</strong> ${fairways} &nbsp; <i class="ti ti-target" style="color:var(--muted);vertical-align:-1px;"></i> <strong>GIR:</strong> ${gir}</div>
            ${approachLine}
            ${r.stars ? '<div style="margin-bottom:8px;color:var(--gold);">' + stars + '</div>' : ''}
            ${ref.milestone ? '<div style="margin-bottom:8px;color:var(--green);font-weight:700;"><i class="ti ti-rosette" style="vertical-align:-1px;"></i> ' + ref.milestone + '</div>' : ''}
            ${ref.swing_thought ? '<div style="margin-bottom:6px;font-style:italic;color:var(--muted);">"' + ref.swing_thought + '"</div>' : ''}
            ${ref.wins ? '<div style="margin-bottom:6px;"><i class="ti ti-check" style="color:var(--green);vertical-align:-1px;"></i> <em>' + ref.wins + '</em></div>' : ''}
            ${ref.learnings ? '<div style="margin-bottom:6px;"><i class="ti ti-tool" style="color:var(--muted);vertical-align:-1px;"></i> <em>' + ref.learnings + '</em></div>' : ''}
            ${ref.worked ? '<div style="margin-bottom:6px;"><i class="ti ti-check" style="color:var(--green);vertical-align:-1px;"></i> <em>' + ref.worked + '</em></div>' : ''}
            ${ref.fix ? '<div style="margin-bottom:6px;"><i class="ti ti-tool" style="color:var(--muted);vertical-align:-1px;"></i> <em>' + ref.fix + '</em></div>' : ''}
            ${ref.best ? '<div style="margin-bottom:6px;"><i class="ti ti-trophy" style="color:var(--gold);vertical-align:-1px;"></i> <em>' + ref.best + '</em></div>' : ''}
            ${ref.worst ? '<div style="margin-bottom:6px;"><i class="ti ti-x" style="color:var(--red,#c0392b);vertical-align:-1px;"></i> <em>' + ref.worst + '</em></div>' : ''}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="round-edit-btn" onclick="openRoundEditModal('${r.id}')">✎ Edit</button>
              <button class="round-delete-btn" style="margin-top:0;" onclick="confirmDeleteDadRound('${r.id}')">Delete Round</button>
            </div>
          </div>
        </div>`;
    }).join('') + legacyCards;
  }

  function renderApproachStats(rounds) {
    const el = document.getElementById('dad-approach-stats');
    if (!el) return;

    // Aggregate approach data across all rounds
    const clubData = {};
    let totalApproachHoles = 0;
    let totalApproachVsPar = 0;

    rounds.forEach(r => {
      const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
      holes.forEach(h => {
        if (!h.approach_club) return;
        const club = h.approach_club;
        if (!clubData[club]) clubData[club] = { count: 0, totalYds: 0, ydsCount: 0, totalVsPar: 0 };
        clubData[club].count++;
        totalApproachHoles++;
        const vp = (h.score || 0) - (h.par || 0);
        clubData[club].totalVsPar += vp;
        totalApproachVsPar += vp;
        if (h.approach_yds && h.approach_yds > 0) {
          clubData[club].totalYds += h.approach_yds;
          clubData[club].ydsCount++;
        }
      });
    });

    const clubs = Object.keys(clubData);
    if (clubs.length === 0) { el.style.display = 'none'; return; }

    // Sort by frequency
    clubs.sort((a,b) => clubData[b].count - clubData[a].count);

    const overallAvg = totalApproachVsPar / totalApproachHoles;
    const overallStr = overallAvg >= 0 ? '+' + overallAvg.toFixed(1) : overallAvg.toFixed(1);
    const overallColor = overallAvg <= 0.5 ? 'var(--green)' : overallAvg <= 1.2 ? 'var(--gold)' : 'var(--red)';

    // Per-round trend data (newest first, max 6 rounds with approach data)
    const roundTrend = rounds
      .map(r => {
        const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
        const aHoles = holes.filter(h => h.approach_club);
        if (!aHoles.length) return null;
        const avg = aHoles.reduce((a, h) => a + ((h.score || 0) - (h.par || 0)), 0) / aHoles.length;
        return { date: r.date_played, course: r.course_name || r.course || '', count: aHoles.length, avg };
      })
      .filter(Boolean)
      .slice(0, 6);

    const roundsWithData = roundTrend.length;

    // Best club (min 2 uses, best avg vs par)
    const eligibleClubs = clubs.filter(c => clubData[c].count >= 2);
    const bestClub = eligibleClubs.length
      ? eligibleClubs.slice().sort((a,b) => (clubData[a].totalVsPar/clubData[a].count) - (clubData[b].totalVsPar/clubData[b].count))[0]
      : null;

    // Per-club table rows
    const rows = clubs.map(club => {
      const d = clubData[club];
      const avgYds = d.ydsCount ? Math.round(d.totalYds / d.ydsCount) + 'y' : '—';
      const avg = d.totalVsPar / d.count;
      const avgStr = avg >= 0 ? '+' + avg.toFixed(1) : avg.toFixed(1);
      const color = avg <= 0.5 ? 'var(--green)' : avg <= 1.2 ? 'var(--gold)' : 'var(--red)';
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
        <td style="padding:7px 8px 7px 0;font-weight:600;font-size:0.82rem;color:var(--cream);">${club}</td>
        <td style="padding:7px 4px;text-align:center;font-size:0.8rem;color:var(--muted);">${d.count}</td>
        <td style="padding:7px 4px;text-align:center;font-size:0.8rem;color:var(--cream);">${avgYds}</td>
        <td style="padding:7px 0 7px 4px;text-align:right;font-size:0.82rem;font-weight:700;color:${color};">${avgStr}</td>
      </tr>`;
    }).join('');

    // Best club callout
    const bestClubHtml = bestClub ? (() => {
      const bc = clubData[bestClub];
      const avg = bc.totalVsPar / bc.count;
      const avgStr = avg >= 0 ? '+' + avg.toFixed(1) : avg.toFixed(1);
      return `<div style="margin-bottom:12px;padding:8px 12px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);border-radius:8px;font-size:0.8rem;line-height:1.4;">
        <i class="ti ti-trophy" style="color:var(--green);font-size:0.9rem;vertical-align:-1px;"></i> <strong style="color:var(--green);">Best club:</strong> ${bestClub} — avg <strong style="color:var(--green);">${avgStr}</strong> vs par over ${bc.count} approach${bc.count !== 1 ? 'es' : ''}
      </div>`;
    })() : '';

    // Round-by-round trend section
    let trendHtml = '';
    if (roundTrend.length >= 2) {
      const trendRows = roundTrend.map(r => {
        const avgStr = r.avg >= 0 ? '+' + r.avg.toFixed(1) : r.avg.toFixed(1);
        const color = r.avg <= 0.5 ? 'var(--green)' : r.avg <= 1.2 ? 'var(--gold)' : 'var(--red)';
        const d = new Date(r.date + 'T12:00:00');
        const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const course = r.course ? r.course.replace(/\s*\(.*\)/, '').substring(0, 22) : '—';
        return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">
          <td style="padding:5px 6px 5px 0;font-size:0.74rem;color:var(--muted);white-space:nowrap;">${dateStr}</td>
          <td style="padding:5px 4px;font-size:0.74rem;color:var(--cream);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${course}</td>
          <td style="padding:5px 4px;text-align:center;font-size:0.74rem;color:var(--muted);">${r.count}</td>
          <td style="padding:5px 0 5px 4px;text-align:right;font-size:0.77rem;font-weight:700;color:${color};">${avgStr}</td>
        </tr>`;
      }).join('');
      // Trend direction: compare most recent vs previous round
      const delta = roundTrend[0].avg - roundTrend[1].avg;
      const trendLabel = delta < -0.15 ? '↑ Improving' : delta > 0.15 ? '↓ Trending worse' : '→ Steady';
      trendHtml = `
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.07);">
          <div style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:8px;">Round by Round</div>
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="border-bottom:1px solid rgba(138,96,16,0.2);">
                <th style="text-align:left;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Date</th>
                <th style="text-align:left;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Course</th>
                <th style="text-align:center;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Shots</th>
                <th style="text-align:right;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Avg ±Par</th>
              </tr>
            </thead>
            <tbody>${trendRows}</tbody>
          </table>

  async function saveRoundEdit(holeCount) {
    const r = _dadLoadedRounds.find(r => r.id === _editingRoundId);
    if (!r) return;
    const holes = (Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]')).map((h, i) => {
      const club = document.getElementById(`rem-club-${i}`)?.value || '';
      const ydsRaw = document.getElementById(`rem-yds-${i}`)?.value;
      return { ...h, approach_club: club || null, approach_yds: ydsRaw ? parseInt(ydsRaw, 10) : null };
    });
    try {
      // Anon key has no UPDATE permission — delete + reinsert with updated holes
      const { error: delErr } = await _sb.from('dad_rounds').delete().eq('id', _editingRoundId);
      if (delErr) throw delErr;
      const newRound = { ...r, holes };
      delete newRound.id;
      delete newRound.created_at;
      const safeRound = { ...newRound, stars: Math.max(1, newRound.stars || 1) };
      const { error: insErr } = await _sb.from('dad_rounds').insert([safeRound]);
      if (insErr) throw insErr;
      showToast('Round updated ✓');
      closeRoundEditModal();
      loadDadRoundsAndRender();
    } catch(e) {
      showToast('Save failed — ' + (e?.message || 'check signal'), 'error');
    }
  }

  // Lock/unlock background scroll when modal is open (prevents iOS scroll bleed-through)
  function _lockBodyScroll()   { document.body.style.overflow = 'hidden'; document.body.style.position = 'fixed'; document.body.style.width = '100%'; }

  function _openDadModalInner() {
    _lockBodyScroll();
    // Check for an unfinished in-progress round saved to localStorage
    const draft = _loadDraftRound();
    if (draft && draft.holes && draft.holes.length > 0) {
      const ageMin = Math.round((Date.now() - (draft.ts || 0)) / 60000);
      const ageStr = ageMin < 60 ? `${ageMin} min ago` : `${Math.round(ageMin/60)}h ago`;
      const holesPlayed = draft.holeIdx + 1;
      const runningTotal = draft.holes.slice(0, holesPlayed).reduce((a, h) => a + h.score, 0);
      if (confirm(`Resume your round in progress?\n\n${draft.round.course_name || 'Saved round'} · ${holesPlayed} holes · Score so far: ${runningTotal}\nSaved ${ageStr}\n\nTap OK to resume, Cancel to start fresh.`)) {
        _dadRound = draft.round;
        _dadHoles = draft.holes;
        _dadHoleIdx = draft.holeIdx;
        _dadStep = 'holes';
        document.getElementById('dad-modal').style.display = 'flex';
        document.getElementById('dad-running-total').style.display = '';
        renderDadLiveHole();
        return;
      } else {
        _clearDraftRound();
      }
    }
    _dadRound = {};
    _dadHoles = [];
    _dadHoleIdx = 0;
    _dadStep = 'setup';
    document.getElementById('dad-modal').style.display = 'flex';
    document.getElementById('dad-running-total').style.display = 'none';
    renderDadModalSetup();

  function dadCourseChange(val) {
    const custom = document.getElementById('dm-custom-wrap');
    const idx = parseInt(val);

    const course = getAllCourses()[idx];

    // Auto-select Format pill based on course par
    if (course && course.par) {
      let fmt = 'regulation_18';
      if (course.par <= 36)  fmt = 'nine_hole';
      else if (course.par <= 58) fmt = 'par3_exec';
      const fmtPill = document.querySelector(`#dm-format-pills .pill[data-val="${fmt}"]`);
      if (fmtPill) {
        document.querySelectorAll('#dm-format-pills .pill').forEach(p => p.classList.remove('active'));
        fmtPill.classList.add('active');
      }
    }

    // Auto-select tee color matching the course's stored tee
    if (course && course.teeColor) {
      const pill = document.querySelector(`#dm-tee-pills .pill[data-val="${course.teeColor}"]`);
      if (pill) {
        document.querySelectorAll('#dm-tee-pills .pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        return;
      }
    }
    // Default to White if no match
    const whitePill = document.querySelector('#dm-tee-pills .pill[data-val="White"]');
    if (whitePill && !document.querySelector('#dm-tee-pills .pill.active')) {
      whitePill.classList.add('active');
    }
  }

    const courseIdx = parseInt(document.getElementById('dm-course').value);
    let course = getAllCourses()[courseIdx];
    let courseName = course.name;
    let coursePar = course.par;
    let numHoles = course.holes;
    if (courseIdx === getAllCourses().length - 1) {
      courseName = document.getElementById('dm-custom-name').value.trim() || 'Custom Course';
      coursePar = parseInt(document.getElementById('dm-custom-par').value) || 72;
      numHoles = parseInt(document.getElementById('dm-custom-holes').value) || 18;
    }
    const tee = document.querySelector('#dm-tee-pills .pill.active')?.dataset.val || 'White';
    const isPractice = document.querySelector('#dm-type-pills .pill.active')?.dataset.val === 'practice';
    const roundType = document.querySelector('#dm-format-pills .pill.active')?.dataset.val || 'regulation_18';
    _dadRound = {
      date_played: document.getElementById('dm-date').value,
      course_name: courseName,
      course_par: coursePar,
      tee_color: tee,
      total_score: 0,
      score_vs_par: 0,
      is_practice: isPractice,
      round_type: roundType,
    };
    _dadHoles = [];
    _dadHoleIdx = 0;
    _dadLiveCaddieHistory = [];
    _dadLiveCaddieOpen    = false;
    const defaultPar = course.blankPars ? 3 : Math.round(coursePar / numHoles);
    for (let i = 1; i <= numHoles; i++) {
      const holePar = (course.holePars && course.holePars[i-1]) ? course.holePars[i-1] : defaultPar;
      const yds = course.yardages ? course.yardages[i - 1] : null;
      _dadHoles.push({ hole: i, par: holePar, score: 1, fairway: 'no', gir: false, putts: 2, yds });
    }
    document.getElementById('dad-running-total').style.display = '';
    _acquireWakeLock();
    renderDadLiveHole();
  }

  function _updateDadRT() {
    const total  = _dadHoles.reduce((a, x) => a + x.score, 0);
    const vs     = _dadHoles.reduce((a, x) => a + x.score - x.par, 0);
    const rtScEl = document.getElementById('dad-rt-score');
    const rtDfEl = document.getElementById('dad-rt-diff');
    if (rtScEl) rtScEl.textContent = total;
    if (rtDfEl) {
      rtDfEl.textContent = vs === 0 ? 'E' : (vs > 0 ? '+' + vs : String(vs));
      rtDfEl.style.color = vs < 0 ? '#1E7A3A' : vs === 0 ? 'var(--muted)' : '#c0392b';
    }
    document.getElementById('dad-running-total').style.display = '';
  }

  function renderDadHole() {
    const h = _dadHoles[_dadHoleIdx];
    _updateDadRT();
    document.getElementById('dad-modal-step-label').textContent = `Hole ${_dadHoleIdx + 1} of ${_dadHoles.length}`;
    const isLast = _dadHoleIdx === _dadHoles.length - 1;
    document.getElementById('dad-modal-body').innerHTML = `
      <div class="hole-score-block">
        <div class="hole-number-big">HOLE ${h.hole}</div>
        ${h.yds ? `<div style="font-size:0.85rem;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:4px;">${h.yds} yds</div>` : ''}
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;">
          Par:
          <button class="stepper-btn" onclick="dadHolePar(-1)">−</button>
          <span style="font-size:1.1rem;color:var(--cream);margin:0 8px;" id="dh-par">${h.par}</span>
          <button class="stepper-btn" onclick="dadHolePar(1)">+</button>
        </div>
        <label class="modal-label" style="align-self:flex-start;">Score</label>
        <div class="score-stepper">
          <button class="stepper-btn" onclick="dadHoleScore(-1)">−</button>
          <div class="score-val" id="dh-score">${h.score}</div>
          <button class="stepper-btn" onclick="dadHoleScore(1)">+</button>
        </div>
      </div>
      <label class="modal-label">Fairway Hit?</label>
      <div class="pill-row" id="dh-fairway-pills">
        <div class="pill ${h.fairway==='yes'?'active':''}" onclick="selectPill(this,'dh-fairway-pills')" data-val="yes">Yes</div>
        <div class="pill ${h.fairway==='no'?'active':''}" onclick="selectPill(this,'dh-fairway-pills')" data-val="no">No</div>
        <div class="pill ${h.par===3?'active':''}" onclick="selectPill(this,'dh-fairway-pills')" data-val="par3">N/A</div>
      </div>
      <label class="modal-label">Green in Regulation?</label>
      <div class="pill-row" id="dh-gir-pills">
        <div class="pill ${h.gir?'active':''}" onclick="selectPill(this,'dh-gir-pills')" data-val="yes">Yes</div>
        <div class="pill ${!h.gir?'active':''}" onclick="selectPill(this,'dh-gir-pills')" data-val="no">No</div>
      </div>
      <label class="modal-label">Putts: <span id="dh-putts-val">${h.putts}</span></label>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <button class="stepper-btn" onclick="dadHolePutts(-1)">−</button>
        <div style="font-size:1.3rem;font-weight:700;color:var(--cream);" id="dh-putts-big">${h.putts}</div>
        <button class="stepper-btn" onclick="dadHolePutts(1)">+</button>
      </div>
      <div class="modal-nav-row">
        <button class="btn-ghost" onclick="dadHoleBack()" ${_dadHoleIdx===0?'disabled style="opacity:0.3;"':''}>← Back</button>
        <button class="btn-gold" onclick="dadHoleNext()">${isLast ? 'Finish Round →' : 'Next Hole →'}</button>
      </div>
    `;
  }

  function dadHoleScore(delta) {
    const h = _dadHoles[_dadHoleIdx];
    h.score = Math.max(1, h.score + delta);
    document.getElementById('dh-score').textContent = h.score;
    _updateDadRT();
  }
  function dadHolePar(delta) {
    const h = _dadHoles[_dadHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    document.getElementById('dh-par').textContent = h.par;
  }
  function dadHolePutts(delta) {
    const h = _dadHoles[_dadHoleIdx];
    h.putts = Math.max(0, Math.min(6, h.putts + delta));
    document.getElementById('dh-putts-val').textContent = h.putts;
    document.getElementById('dh-putts-big').textContent = h.putts;
  }
  function dadHoleSave() {
    const h = _dadHoles[_dadHoleIdx];
    h.fairway = document.querySelector('#dh-fairway-pills .pill.active')?.dataset.val || 'no';
    h.gir = document.querySelector('#dh-gir-pills .pill.active')?.dataset.val === 'yes';
  }
  function dadHoleNext() {
    dadHoleSave();
    if (_dadHoleIdx === _dadHoles.length - 1) {
      renderDadReflection();
    } else {
      _dadHoleIdx++;
      renderDadHole();
    }
  }
  function dadHoleBack() {
    dadHoleSave();
    if (_dadHoleIdx > 0) { _dadHoleIdx--; renderDadHole(); }
  }

  let _dadStars = 0;
  function renderDadReflection() {
    document.getElementById('dad-running-total').style.display = 'none';
    const total = _dadHoles.reduce((a, h) => a + h.score, 0);
    const par = _dadRound.course_par;
    const diff = total - par;
    const diffStr = diff >= 0 ? '+' + diff : '' + diff;
    let motivational = '';
    if (total < 90) motivational = 'SUB-90! The goal is done. 🏆';
    else if (total <= 95) motivational = "You're right there. Sub-90 is one clean round away. 🔥";
    else if (total <= 100) motivational = 'Solid round. Keep eliminating the doubles. 💪';
    else if (total <= 110) motivational = 'Good data. Every round teaches you something. 🎯';
    else motivational = 'Every round on the course beats one off it. Keep going. ⛳';
    _dadStars = 0;
    document.getElementById('dad-modal-step-label').textContent = 'Post-Round';
    document.getElementById('dad-modal-body').innerHTML = `
      <div class="score-summary-card">
        <div class="score-summary-score">${total}</div>
        <div class="score-summary-line">You shot ${total} — ${diffStr} on ${_dadRound.course_name}</div>
        <div class="score-motivational">${motivational}</div>
      </div>
      <label class="modal-label">Star Rating</label>
      <div class="star-row">
        <span class="star-btn" onclick="dadSetStar(1)" id="dstar-1">⭐</span>
        <span class="star-btn" onclick="dadSetStar(2)" id="dstar-2">⭐</span>
        <span class="star-btn" onclick="dadSetStar(3)" id="dstar-3">⭐</span>
        <span class="star-btn" onclick="dadSetStar(4)" id="dstar-4">⭐</span>
        <span class="star-btn" onclick="dadSetStar(5)" id="dstar-5">⭐</span>
      </div>
      <label class="modal-label">🏆 Best moment this round</label>
      <textarea id="dr-best" class="modal-input" rows="2" placeholder="Your best moment..."></textarea>
      <label class="modal-label">❌ Biggest mistake / worst hole</label>
      <textarea id="dr-worst" class="modal-input" rows="2" placeholder="What went wrong..."></textarea>
      <label class="modal-label">✅ One thing that worked</label>
      <textarea id="dr-worked" class="modal-input" rows="2" placeholder="What clicked..."></textarea>
      <label class="modal-label">🔧 One thing to fix next time</label>
      <textarea id="dr-fix" class="modal-input" rows="2" placeholder="Focus for next round..."></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 12px;background:rgba(255,255,255,0.04);border-radius:10px;">
        <span style="font-size:0.87rem;color:var(--muted);">Save this round</span>
        <label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer;">
          <input type="checkbox" id="dr-do-save" checked style="opacity:0;width:0;height:0;">
          <span style="position:absolute;inset:0;background:var(--green);border-radius:24px;transition:background 0.2s;" id="dr-save-track"></span>
          <span style="position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform 0.2s;" id="dr-save-thumb"></span>
        </label>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="saveDadRoundFull()">Save Round</button>
    `;
    // wire toggle visuals
    const cb = document.getElementById('dr-do-save');
    const track = document.getElementById('dr-save-track');
    const thumb = document.getElementById('dr-save-thumb');
    if (cb) cb.addEventListener('change', () => {
      track.style.background = cb.checked ? 'var(--green)' : 'rgba(255,255,255,0.15)';
      thumb.style.transform = cb.checked ? 'translateX(20px)' : 'translateX(0)';
    });
    // init thumb position
    if (thumb) thumb.style.transform = 'translateX(20px)';
  }
  function dadSetStar(n) {
    _dadStars = n;
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById('dstar-' + i);
      if (el) el.classList.toggle('lit', i <= n);
    }
  }
  async function saveDadRoundFull() {
    const doSave = document.getElementById('dr-do-save')?.checked !== false;
    const total = _dadHoles.reduce((a, h) => a + h.score, 0);

    // Skip Save mode — just close, no DB write
    if (!doSave) {
      showToast('Test round — not saved');
      _clearDraftRound();
      closeDadModal();
      return;
    }

    const roundObj = {
      date_played: _dadRound.date_played,
      course_name: _dadRound.course_name,
      course_par: _dadRound.course_par,
      tee_color: _dadRound.tee_color,
      total_score: total,
      score_vs_par: total - _dadRound.course_par,
      holes: _dadHoles,
      is_practice: _dadRound.is_practice || false,
      round_type: _dadRound.round_type || 'regulation_18',
      reflection: {
        best: document.getElementById('dr-best').value.trim(),
        worst: document.getElementById('dr-worst').value.trim(),
        worked: document.getElementById('dr-worked').value.trim(),
        fix: document.getElementById('dr-fix').value.trim(),
        stars: _dadStars
      },
      stars: _dadStars
    };
    const saveBtn = document.querySelector('#dad-modal-body .btn-primary');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }
    try {
      await saveDadRound(roundObj);
      _clearDraftRound();
      showToast(_dadRound.is_practice ? 'Practice round saved! 🏌️' : 'Round saved! ✓');
      closeDadModal();
      loadDadRoundsAndRender();
    } catch(e) {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = '↺ Retry Save';
        saveBtn.style.background = 'var(--red)';
      }
      showToast('Save failed — tap Retry Save when you have signal', 'error');
    }
  }

  // ══════════════════════════════════════════════════════════
  //  KIDS LEVELING SYSTEM
  // ══════════════════════════════════════════════════════════

  // KID_LEVELS moved to top of file — see line ~20

  function getKidLevel(who) {
    const defaults = { son: 2, girl: 1 };
    return parseInt(localStorage.getItem('sv-' + who + '-level') || defaults[who] || 1);
  }
  function setKidLevel(who, level) {
    localStorage.setItem('sv-' + who + '-level', String(Math.min(4, Math.max(1, level))));
  }

  function renderKidLevelCard(who, rounds) {
    const el = document.getElementById(who + '-level-card');
    if (!el) return;
    const level = getKidLevel(who);
    const def   = KID_LEVELS[level];
    const next  = KID_LEVELS[level + 1];
    const color = def.color;
    const roundCount = (rounds || []).length;

    // Progress bar toward next level
    let progressHtml = '';
    if (next) {
      const target = def.roundsNeeded;
      const pct    = Math.min(100, Math.round((roundCount / target) * 100));
      progressHtml = `
        <div style="margin-top:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:0.7rem;color:var(--muted);">Next: ${def.nextTrigger}</span>
            <span style="font-size:0.7rem;color:${color};font-weight:700;">${roundCount}/${target} rounds</span>
          </div>
          <div class="level-progress-bar">
            <div class="level-progress-fill" style="width:${pct}%;background:${color};"></div>
          </div>
        </div>`;
    }

    el.innerHTML = `
      <div class="section level-card" style="padding-bottom:4px;">
        <div class="card" style="border-color:${color}50;background:${color}12;padding:14px 16px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:1.6rem;line-height:1;">${def.emoji}</span>
              <div>
                <div style="font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${color};margin-bottom:1px;">Level ${level}</div>
                <div style="font-size:1rem;font-weight:700;color:var(--cream);line-height:1.1;">${def.name}</div>
              </div>
            </div>
            ${level < 4 ? `<button onclick="adminLevelUp('${who}')" style="background:none;border:1px solid ${color}70;border-radius:8px;padding:5px 10px;color:${color};font-size:0.68rem;font-weight:700;cursor:pointer;letter-spacing:0.5px;white-space:nowrap;">PROMOTE ▲</button>` : '<span style="font-size:0.75rem;color:var(--gold);font-weight:700;">MAX LEVEL 🏆</span>'}
          </div>
          <div style="font-size:0.8rem;color:var(--muted);margin-top:6px;">${def.desc}</div>
          ${progressHtml}
        </div>
      </div>`;
  }

  // Dad manually promotes a kid — requires confirmation
  function adminLevelUp(who) {
    const current = getKidLevel(who);
    if (current >= 4) { showToast('Already at max level! 🏆'); return; }
    const next = KID_LEVELS[current + 1];
    const name = who === 'son' ? 'Son' : 'Daughter';
    if (!confirm(`Promote ${name} to Level ${current + 1}: "${next.name}"?\n\nThis should be a real milestone moment — make sure they've earned it!`)) return;
    setKidLevel(who, current + 1);
    // Clear auto-flag for this level so it doesn't ping again
    localStorage.removeItem('sv-' + who + '-autolvl-' + (current + 1));
    triggerLevelUpCeremony(who, current + 1);
  }

  // Check if auto-flag should fire (does NOT auto-promote — just notifies Dad)
  function checkAutoLevelUp(who, rounds) {
    const current = getKidLevel(who);
    if (current >= 4) return;
    const def = KID_LEVELS[current];
    if (!def.roundsNeeded) return;
    const roundCount = (rounds || []).length;
    const flagKey = 'sv-' + who + '-autolvl-' + (current + 1);
    if (roundCount >= def.roundsNeeded && !localStorage.getItem(flagKey)) {
      localStorage.setItem(flagKey, '1');
      const name = who === 'son' ? 'Son' : 'Daughter';
      setTimeout(() => showToast(`🌟 ${name} has enough rounds for Level ${current + 1}! Check their progress page.`, 'gold'), 800);
    }
  }

  // Full-screen level up ceremony
  function triggerLevelUpCeremony(who, newLevel) {
    const def   = KID_LEVELS[newLevel];
    const name  = who === 'son' ? 'Son' : 'Daughter';
    const color = def.color;

    // Remove any existing overlay
    document.getElementById('levelup-overlay')?.remove();

    const overlay = document.createElement('div');
    overlay.id = 'levelup-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;overflow:hidden;';

    overlay.innerHTML = `
      <div id="levelup-confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>
      <div style="font-size:5rem;margin-bottom:14px;animation:lvlBounce 0.55s ease infinite alternate;">${def.emoji}</div>
      <div style="font-size:0.75rem;font-weight:700;letter-spacing:3px;color:var(--muted);margin-bottom:4px;">LEVEL UP!</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:${color};letter-spacing:2px;line-height:1;margin-bottom:6px;">Level ${newLevel}</div>
      <div style="font-size:1.25rem;font-weight:700;color:var(--cream);margin-bottom:10px;">${def.name}</div>
      <div style="font-size:0.88rem;color:var(--muted);max-width:280px;line-height:1.6;margin-bottom:24px;">${def.desc}</div>
      <div style="background:${color}18;border:1px solid ${color}50;border-radius:14px;padding:14px 20px;max-width:300px;margin-bottom:28px;">
        <div style="font-size:0.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${color};margin-bottom:5px;">${name} unlocked</div>
        <div style="font-size:0.85rem;color:var(--cream);">${next ? 'Next milestone: ' + (KID_LEVELS[newLevel].nextTrigger || 'Stay consistent!') : 'You\'ve reached the top — welcome to the big leagues!'}</div>
      </div>
      <button onclick="document.getElementById('levelup-overlay').remove();if(typeof loadSonRoundsAndRender==='function'&&'${who}'==='son')loadSonRoundsAndRender();if(typeof loadGirlRoundsAndRender==='function'&&'${who}'==='girl')loadGirlRoundsAndRender();"
        style="background:${color};color:#fff;border:none;border-radius:14px;padding:14px 44px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:0.5px;-webkit-tap-highlight-color:transparent;">
        Let's Go! 🎉
      </button>
    `;

    document.body.appendChild(overlay);

    // Confetti burst
    const confettiEl = document.getElementById('levelup-confetti');
    const cfColors = [color, '#c8922a', '#22c55e', '#f472b6', '#3b82f6', '#fcd34d', '#fff'];
    for (let i = 0; i < 70; i++) {
      const piece = document.createElement('div');
      const size  = 5 + Math.random() * 9;
      piece.style.cssText = `
        position:absolute;
        width:${size}px;height:${size}px;
        background:${cfColors[Math.floor(Math.random() * cfColors.length)]};
        border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
        left:${Math.random() * 100}%;
        top:-20px;
        animation:confettiFall ${1.4 + Math.random() * 2}s ease-in ${Math.random() * 0.8}s forwards;
        opacity:0.9;
      `;
      confettiEl.appendChild(piece);
    }

    // Re-render level card after closing
    renderKidLevelCard(who, null);
    updateRangeLevelBadge(who);
  }

  // Show level badge in range section header
  function updateRangeLevelBadge(who) {
    const el = document.getElementById(who + '-range-level-badge');
    if (!el) return;
    const level = getKidLevel(who);
    const def   = KID_LEVELS[level];
    el.innerHTML = `
      <div style="display:inline-flex;align-items:center;gap:6px;background:${def.color}18;border:1px solid ${def.color}50;border-radius:20px;padding:3px 10px 3px 8px;margin-bottom:4px;">
        <span style="font-size:0.85rem;">${def.emoji}</span>
        <span style="font-size:0.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:${def.color};">Level ${level} · ${def.name}</span>
      </div>`;
  }

  // ── SON ROUND MODAL ─────────────────────────────────────────
  let _sonRound = {};
  let _sonHoles = [];
  let _sonHoleIdx = 0;

  function openSonModal() {
    _sonRound = {};

    document.getElementById('son-modal').style.display = 'none';
  }

  function renderSonModalSetup() {
    document.getElementById('son-modal-step-label').textContent = 'Round Setup';
    const today = new Date().toISOString().split('T')[0];
    const courseOpts = getAllCourses().map((c,i) => `<option value="${i}">${c.name} (par ${c.par})</option>`).join('');
    document.getElementById('son-modal-body').innerHTML = `

      </div>
      <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="sonStartRound()">Start Round →</button>

  function sonCourseChange(val) {
    const custom = document.getElementById('sm-custom-wrap');
    custom.style.display = parseInt(val) === getAllCourses().length - 1 ? 'block' : 'none';
  }

  function sonStartRound() {
    const courseIdx = parseInt(document.getElementById('sm-course').value);
    let course = getAllCourses()[courseIdx];
    let courseName = course.name;
    let coursePar = course.par;
    let numHoles = course.holes;
    if (courseIdx === getAllCourses().length - 1) {
      courseName = document.getElementById('sm-custom-name').value.trim() || 'Custom Course';
      coursePar = parseInt(document.getElementById('sm-custom-par').value) || 72;
      numHoles = parseInt(document.getElementById('sm-custom-holes').value) || 18;
    }
    _sonRound = {
      date_played: document.getElementById('sm-date').value,
      course_name: courseName,
      course_par: coursePar,
    };
    _sonHoles = [];
    _sonHoleIdx = 0;
    const holePar = Math.round(coursePar / numHoles);
    for (let i = 1; i <= numHoles; i++) {
      _sonHoles.push({ hole: i, par: holePar, score: holePar });
    }
    document.getElementById('son-running-total').style.display = '';
    renderSonHole();
  }

  function renderSonHole() {
    const h = _sonHoles[_sonHoleIdx];
    const total = _sonHoles.slice(0, _sonHoleIdx).reduce((a, x) => a + x.score, 0) + h.score;
    document.getElementById('son-running-total').textContent = total;
    document.getElementById('son-modal-step-label').textContent = `Hole ${_sonHoleIdx + 1} of ${_sonHoles.length}`;
    const isLast = _sonHoleIdx === _sonHoles.length - 1;
    document.getElementById('son-modal-body').innerHTML = `
      <div class="hole-score-block">
        <div class="hole-number-big">HOLE ${h.hole}</div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;">
          Par:
          <button class="stepper-btn" onclick="sonHolePar(-1)">−</button>

          <button class="stepper-btn" onclick="sonHolePar(1)">+</button>
        </div>
        <label class="modal-label" style="align-self:flex-start;">Score</label>
        <div class="score-stepper">
          <button class="stepper-btn" onclick="sonHoleScore(-1)">−</button>
          <div class="score-val" id="sh-score">${h.score}</div>
          <button class="stepper-btn" onclick="sonHoleScore(1)">+</button>
        </div>
      </div>
      <div class="modal-nav-row">
        <button class="btn-ghost" onclick="sonHoleBack()" ${_sonHoleIdx===0?'disabled style="opacity:0.3;"':''}>← Back</button>
        <button class="btn-gold" onclick="sonHoleNext()">${isLast ? 'Finish Round →' : 'Next Hole →'}</button>
      </div>
    `;
  }

  function sonHoleScore(delta) {
    const h = _sonHoles[_sonHoleIdx];
    h.score = Math.max(1, h.score + delta);
    document.getElementById('sh-score').textContent = h.score;
    const total = _sonHoles.slice(0, _sonHoleIdx).reduce((a, x) => a + x.score, 0) + h.score;
    document.getElementById('son-running-total').textContent = total;
  }
  function sonHolePar(delta) {
    const h = _sonHoles[_sonHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    document.getElementById('sh-par').textContent = h.par;
  }
  function sonHoleNext() {
    if (_sonHoleIdx === _sonHoles.length - 1) {
      renderSonReflection();
    } else {
      _sonHoleIdx++;
      renderSonHole();
    }
  }
  function sonHoleBack() {
    if (_sonHoleIdx > 0) { _sonHoleIdx--; renderSonHole(); }
  }

  function renderSonReflection() {
    document.getElementById('son-running-total').style.display = 'none';
    const total = _sonHoles.reduce((a, h) => a + h.score, 0);
    const par = _sonRound.course_par;
    const diff = total - par;
    const diffStr = diff >= 0 ? '+' + diff : '' + diff;
    document.getElementById('son-modal-step-label').textContent = 'Post-Round';
    document.getElementById('son-modal-body').innerHTML = `
      <div class="score-summary-card">
        <div class="score-summary-score">${total}</div>
        <div class="score-summary-line">You shot ${total} — ${diffStr} over par</div>
      </div>

      <textarea id="sr-best" class="modal-input" rows="2" placeholder="Your best hole..."></textarea>
      <label class="modal-label">📝 Anything to remember?</label>

    `;

Name the club. Show distance math in one line. One sentence of strategy. 2 sentences total. If no distance given, ask for it first.`;

  function _caddieSystemWithCtx() { return _CADDIE_SYSTEM; }

  // Family-round caddie — player-aware yardage cards
  const _FAM_YARDAGES = {
    dad:     `Dad (Jeremy, left-handed): Driver 190-200 | 7W 165-175 | 4H 170-180 | 4i ~165 | 5i ~155 | 6i 145-155 | 7i 130-137 | 8i 120-130 | 9i 110-120 | PW 90-110 | GW 85-105 | SW 80-90 | LW 60-75`,
    son:     `Son (right-handed, junior set, age 8): Driver ~60-80 | FW Wood ~50-65 | 5i ~40-55 | 7i ~30-45 | 9i ~25-35 | SW ~15-25`,
    girl:    `Daughter (lefty, age 5, junior set): distances vary — ask how far she hits before recommending`,
    mom:     `Mom (right-handed, beginner): distances unknown — ask how far she hits before recommending`,
    grandma: `Grandma (right-handed): distances unknown — ask how far she hits before recommending`,
  };

  function _famCaddieSystem() {
    const activePlayers = (_famRound.players || [])
      .map(pk => _FAM_YARDAGES[pk] || pk)
      .join('\n');
    return `FAMILY ROUND CADDIE — multiple players on the course.
PLAYER YARDAGE CARDS:
${activePlayers}

RULES: Always state which player you are advising. Use ONLY that player's yardage card — never mix up players' distances. Show distance math inline (e.g. "7-iron. 130-140 fits the 135 yd gap."). Name the club. One sentence strategy. 3 sentences max. If the user doesn't say who they're asking for, ask. If a player's distances are unknown, ask before recommending.`;
  }

  function caddieInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCaddieMessage(); }
  }

  async function sendCaddieMessage() {
    const inp = document.getElementById('caddie-input');
    const msg = inp.value.trim();
    if (!msg) return;

    inp.value = '';
    _caddieHistory.push({ role: 'user', content: msg });
    renderCaddieMessages(true);

    const btn = document.getElementById('caddie-send-btn');
    btn.disabled = true;
    btn.textContent = '…';

    try {
      const resp = await fetch(CADDIE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({
          messages: _caddieHistory.slice(-6),
          systemPrompt: _caddieSystemWithCtx()
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast(err?.error || `Error ${resp.status}`, 'error');
        _caddieHistory.pop();
        renderCaddieMessages(false);
        return;
      }

      const data = await resp.json();
      const reply = data?.reply || '—';
      _caddieHistory.push({ role: 'assistant', content: reply });
      renderCaddieMessages(false);
    } catch(e) {
      showToast('No signal — check your connection', 'error');
      _caddieHistory.pop();
      renderCaddieMessages(false);
    } finally {
      btn.disabled = false;
      btn.textContent = '➤';
    }
  }

  function renderCaddieMessages(showTyping) {
    const el = document.getElementById('caddie-messages');
    if (!el) return;
    const welcome = `<div style="background:rgba(138,96,16,0.08);border:1px solid rgba(138,96,16,0.2);border-radius:12px;padding:14px 16px;font-size:0.85rem;color:var(--cream);line-height:1.6;"><i class="ti ti-microphone" style="color:var(--gold);vertical-align:-1px;"></i> <strong>On the bag.</strong> Just say your distance and situation — I'll pick the club. Try: <em>"About 140 out, slight headwind"</em> or <em>"Tee shot, tight fairway."</em></div>`;
    const msgs = _caddieHistory.map(m => {
      const isUser = m.role === 'user';
      return `<div style="
        align-self:${isUser ? 'flex-end' : 'flex-start'};
        max-width:88%;
        background:${isUser ? 'rgba(138,96,16,0.15)' : 'var(--surface2)'};

      ">${m.content}</div>`;

      ? `<div style="align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 16px;font-size:1rem;color:var(--muted);letter-spacing:3px;">···</div>`

  // ── VOICE INPUT ──────────────────────────────────────────────
  let _caddieRecognition = null;
  let _caddieListening   = false;

  function toggleCaddieMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showToast('Voice not supported on this browser', 'error');
      return;
    }
    if (_caddieListening) {
      _caddieRecognition && _caddieRecognition.stop();
      return;
    }
    _caddieRecognition = new SpeechRecognition();
    _caddieRecognition.lang = 'en-US';
    _caddieRecognition.interimResults = false;
    _caddieRecognition.maxAlternatives = 1;

    const micBtn = document.getElementById('caddie-mic-btn');

    _caddieRecognition.onstart = () => {
      _caddieListening = true;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone" style="color:#ef4444;"></i>'; micBtn.style.color = '#ef4444'; micBtn.style.borderColor = '#ef4444'; }
    };
    _caddieRecognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      const inp = document.getElementById('caddie-input');
      if (inp) {
        inp.value = (inp.value ? inp.value + ' ' : '') + transcript;
      }
    };
    _caddieRecognition.onend = () => {
      _caddieListening = false;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone"></i>'; micBtn.style.color = ''; micBtn.style.borderColor = ''; }
      // Auto-send if there's content
      const inp = document.getElementById('caddie-input');
      if (inp && inp.value.trim()) sendCaddieMessage();
    };
    _caddieRecognition.onerror = (e) => {
      _caddieListening = false;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone"></i>'; micBtn.style.color = ''; micBtn.style.borderColor = ''; }
      if (e.error !== 'no-speech') showToast('Mic error: ' + e.error, 'error');
    };

    _caddieRecognition.start();
  }

  function startFamRound() {
    const players = Array.from(document.querySelectorAll('#fam-modal-body .fam-checkbox-card.selected'))
                         .map(c => c.dataset.player);
    if (!players.length) { showToast('Pick at least one player', 'error'); return; }

    const courseIdx = parseInt(document.getElementById('fm-course').value);
    if (courseIdx < 0 || isNaN(courseIdx)) { showToast('Please select a course', 'error'); return; }
    localStorage.setItem('sv-last-fam-course', String(courseIdx));
    let course = getAllCourses()[courseIdx];
    let courseName = course.name, coursePar = course.par, numHoles = course.holes;
    if (courseIdx === getAllCourses().length - 1) {
      courseName = document.getElementById('fm-custom-name').value.trim() || 'Custom Course';
      coursePar  = parseInt(document.getElementById('fm-custom-par').value) || 54;
      numHoles   = parseInt(document.getElementById('fm-custom-holes').value) || 18;
    }

    const famIsPractice = document.querySelector('#fm-type-pills .pill.active')?.dataset.val === 'practice';
    _famRound = { date_played: document.getElementById('fm-date').value, course_name: courseName, course_par: coursePar, players, is_practice: famIsPractice };
    _famHoleIdx       = 0;
    _famCaddieHistory = [];
    _famCaddieOpen    = false;
    const defaultPar = course.blankPars ? 3 : Math.round(coursePar / numHoles);
    _famHoles = Array.from({length: numHoles}, (_, i) => {
      const holePar = (course.holePars && course.holePars[i]) ? course.holePars[i] : defaultPar;
      const scores = {};
      players.forEach(p => { scores[p] = holePar; });
      const yds = course.yardages ? course.yardages[i] : null;
      return { hole: i+1, par: holePar, scores, photo: null, yds };
    });

    document.getElementById('fam-running-bar').style.display = 'flex';
    renderFamHole();
  }

    if (diff === 2)  return 'var(--red)';
    return '#ff4444';

  function famScoreClass(diff) {
    if (diff <= -2) return 'fam-eagle';
    if (diff === -1) return 'fam-birdie';
    if (diff === 0)  return 'fam-par';
    if (diff === 1)  return 'fam-bogey';
    if (diff === 2)  return 'fam-double';
    return 'fam-triple';
  }

      const p    = FAM_PLAYERS[pk];
