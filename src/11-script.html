  // Upload any base64 hole photos to Supabase Storage and replace with public URLs
  async function _uploadHolePhotos(holesArr, roundId) {
    for (const h of holesArr) {
      const rawPhotos = h.photos?.length ? h.photos : (h.photo ? [h.photo] : []);
      const uploaded = [];
      for (let i = 0; i < rawPhotos.length; i++) {
        const p = rawPhotos[i];
        if (!p || p.startsWith('http')) { uploaded.push(p); continue; }
        try {
          const res  = await fetch(p);
          const blob = await res.blob();
          const path = `${roundId}/hole-${h.hole}-${i}.jpg`;
          const { error } = await _sb.storage.from('round-photos').upload(path, blob, {
            contentType: 'image/jpeg', upsert: true,
          });
          if (!error) {
            const { data } = _sb.storage.from('round-photos').getPublicUrl(path);
            uploaded.push(data.publicUrl);
          } else {
            uploaded.push(p); // keep base64 if upload fails
          }
        } catch(e) {
          console.warn('Photo upload failed for hole', h.hole, 'photo', i, e);
          uploaded.push(p);
        }
      }
      h.photos = uploaded;
      h.photo  = uploaded[0] || null; // backward compat
    }
  }

  function _rangeFocusData() {

  }
  function loadRangeFocus() {
    const data = _rangeFocusData();
    const display = document.getElementById('range-focus-display');
    if (!display) return;
    if (!data.items || !data.items.length) {
      display.innerHTML = `<div style="color:var(--muted);font-size:0.82rem;font-style:italic;">No focus set, tap Edit to pick what to work on today.</div>`;
      return;
    }
    display.innerHTML = data.items.map((item, i) => `

        <div style="flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#1a1108;margin-top:1px;">${i+1}</div>

  function editRangeFocus() {
    const edit = document.getElementById('range-focus-edit');
    const chipsEl = document.getElementById('range-focus-chips');
    const display = document.getElementById('range-focus-display');
    const isOpen = edit.style.display !== 'none';
    if (isOpen) { edit.style.display = 'none'; display.style.display = ''; return; }
    display.style.display = 'none';
    edit.style.display = '';
    const data = _rangeFocusData();
    const selected = data.items || [];
    chipsEl.innerHTML = _FOCUS_SUGGESTIONS.map(s => {
      const isOn = selected.includes(s);
      return `<button onclick="toggleFocusChip(this,'${s.replace(/'/g,"\\'")}')" style="padding:5px 10px;border-radius:20px;border:1px solid ${isOn ? 'var(--gold)' : 'rgba(212,168,67,0.3)'};background:${isOn ? 'rgba(212,168,67,0.2)' : 'transparent'};color:${isOn ? 'var(--gold)' : 'var(--muted)'};font-size:0.75rem;cursor:pointer;-webkit-tap-highlight-color:transparent;" data-focus="${s.replace(/"/g,'&quot;')}" data-on="${isOn ? '1' : '0'}">${s}</button>`;
    }).join('');
    document.getElementById('range-focus-custom').value = '';
  }
  function toggleFocusChip(btn, text) {
    const isOn = btn.dataset.on === '1';
    btn.dataset.on = isOn ? '0' : '1';
    btn.style.borderColor = !isOn ? 'var(--gold)' : 'rgba(212,168,67,0.3)';
    btn.style.background  = !isOn ? 'rgba(212,168,67,0.2)' : 'transparent';
    btn.style.color       = !isOn ? 'var(--gold)' : 'var(--muted)';
  }
  function saveRangeFocus() {
    const chips = [...document.querySelectorAll('#range-focus-chips button[data-on="1"]')].map(b => b.dataset.focus);
    const custom = document.getElementById('range-focus-custom')?.value.trim();
    const items = custom ? [...chips, custom] : chips;
    if (items.length > 2) { showToast('Pick 1–2 focus areas', 'error'); return; }
    localStorage.setItem(_FOCUS_KEY, JSON.stringify({ items, date: new Date().toISOString().slice(0,10) }));
    document.getElementById('range-focus-edit').style.display = 'none';
    document.getElementById('range-focus-display').style.display = '';
    loadRangeFocus();
    showToast('Focus saved');
  }

  // ── BUILD VERSION / CACHE BUSTER ─────────────────────────────
  // Bump BUILD_ID with every deploy. App checks on load, if version
  // changed, SW caches are cleared and page reloads. localStorage
  // (logs, notes, profile) is never touched.
  const BUILD_ID = '2026-05-26-v39';
  (function checkBuild() {
    const prev = localStorage.getItem('sv-build');
    if (prev && prev !== BUILD_ID) {
      // New version detected, nuke SW caches silently then reload
      localStorage.setItem('sv-build', BUILD_ID);
      if ('caches' in window) {
        caches.keys()
          .then(keys => Promise.all(keys.map(k => caches.delete(k))))
          .then(() => {
            // Tell any waiting SW to take over, then reload fresh
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('skipWaiting');
            }
            location.reload(true);
          });
      } else {
        location.reload(true);
      }
      return; // stop, reload is coming
    }
    localStorage.setItem('sv-build', BUILD_ID);
  })();

  // ── LEVEL SHIELD + KID BADGE SHELF ──────────────────────────────────────
  function renderKidBadges(who, rounds, accentColor) {
    const level = getKidLevel(who);
    const def   = KID_LEVELS[level];
    const color = accentColor || def.color;
    const sc = {
      1:{ fill:'#F5EDD8', stroke:'#B0A070', text:'#6a5c30', bg:'#E8E0D0' },
      2:{ fill:'#D0EAB8', stroke:'#5A9A30', text:'#1a5008', bg:'#B8D8A0' },
      3:{ fill:'#C0D8F8', stroke:'#3070C0', text:'#083080', bg:'#A8C8F0' },
      4:{ fill:'#FAD860', stroke:'#A07800', text:'#503000', bg:'#F0C030' },
    }[level];
    const shieldSvg = `<svg viewBox="0 0 56 62" width="44" height="49" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 3 L53 12 L53 34 Q53 50 28 59 Q3 50 3 34 L3 12 Z" fill="${sc.bg}" stroke="${sc.stroke}" stroke-width="2.5"/>
      <path d="M28 8 L48 16 L48 34 Q48 47 28 54 Q8 47 8 34 L8 16 Z" fill="${sc.fill}" stroke="none"/>
      <text x="28" y="27" text-anchor="middle" font-family="Archivo,Impact,sans-serif" font-weight="800" font-size="8" fill="${sc.text}" opacity="0.7">LEVEL</text>
      <text x="28" y="44" text-anchor="middle" font-family="Archivo,Impact,sans-serif" font-weight="800" font-size="20" fill="${sc.text}">${level}</text>
    </svg>`;
    const shieldHtml = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px 14px;background:${def.color}18;border-radius:12px;border:1px solid ${def.color}35;">
        ${shieldSvg}
        <div>
          <div style="font-size:0.58rem;font-weight:700;letter-spacing:2px;color:${def.color};margin-bottom:2px;">LEVEL ${level}</div>
          <div style="font-size:0.88rem;font-weight:700;color:var(--cream);">${def.name}</div>
          <div style="font-size:0.72rem;color:var(--muted);line-height:1.4;">${def.desc}</div>
        </div>
      </div>`;
    const autoBadges   = KID_BADGES.filter(b => !b.manual);
    const manualBadges = KID_BADGES.filter(b =>  b.manual);
    const isAdmin = !!sessionStorage.getItem('sv-dad-unlocked');

    const autoBadgeHtml = autoBadges.map(b => {
      const earned = b.check(who, rounds);
      const c = earned ? b.color : '#888';
      const svgHtml = b.svg.replace(/\{\{c\}\}/g, c);
      return `<div class="badge-item ${earned ? 'earned' : 'locked'}" title="${b.desc}">
        <div class="badge-svg-wrap ${earned ? '' : 'locked'}">${svgHtml}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
      </div>`;
    }).join('');

    const manualBadgeHtml = manualBadges.map(b => {
      const earned = b.check(who);
      const c = earned ? b.color : '#888';
      const svgHtml = b.svg.replace(/\{\{c\}\}/g, c);
      const awardBtn = isAdmin
        ? `<div onclick="toggleManualBadge('${who}','${b.id}',this)"
            style="font-size:0.55rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
              color:${earned ? '#ef4444' : b.color};cursor:pointer;margin-top:2px;opacity:0.8;">
            ${earned ? '✕ Revoke' : '+ Award'}
          </div>`
        : '';
      return `<div class="badge-item ${earned ? 'earned' : 'locked'}" title="${b.desc}" id="mb-${who}-${b.id}">
        <div class="badge-svg-wrap ${earned ? '' : 'locked'}">${svgHtml}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        ${awardBtn}
      </div>`;
    }).join('');

    return `${shieldHtml}
      <div style="font-size:0.6rem;font-weight:700;letter-spacing:2px;color:${color};margin-bottom:8px;">ACHIEVEMENTS</div>

      <div style="font-size:0.6rem;font-weight:700;letter-spacing:2px;color:var(--muted);margin-top:14px;margin-bottom:8px;">SHARED BADGES</div>

  function toggleManualBadge(who, badgeId, el) {
    const key     = 'sv-' + who + '-badge-' + badgeId;
    const earned  = !!localStorage.getItem(key);
    if (earned) {
      localStorage.removeItem(key);

      localStorage.setItem(key, '1');
      showToast('Badge awarded! 🎖️');

    const svgHtml = badge.svg.replace(/\{\{c\}\}/g, c);
    const container = document.getElementById('mb-' + who + '-' + badgeId);
    if (container) {
      container.className = 'badge-item ' + (newEarned ? 'earned' : 'locked');
      container.innerHTML = `
        <div class="badge-svg-wrap ${newEarned ? '' : 'locked'}">${svgHtml}</div>

  // ── KID LEVELING HELPERS ──────────────────────────────────────────────────

  function getKidRangeSessions(who) {
    try { return JSON.parse(localStorage.getItem('sv-' + who + '-range-sessions') || '[]'); }
    catch(e) { return []; }
  }

  function saveKidRangeSession(who, session) {
    const sessions = getKidRangeSessions(who);
    sessions.unshift({ ...session, date: new Date().toISOString().split('T')[0] });
    if (sessions.length > 30) sessions.length = 30;
    localStorage.setItem('sv-' + who + '-range-sessions', JSON.stringify(sessions));
  }


  function getKidActivityPoints(who, rounds) {
    return (rounds || []).length * 3 + getKidRangeSessions(who).length;
  }

  // Maps 9-level system (0-8) to 4 content tiers for range body rendering
  function getRangeContentLevel(level) {
    if (level <= 1) return 1;
    if (level <= 3) return 2;
    if (level <= 5) return 3;
    return 4;
  }

  // One-time migration: old 4-level system → new 9-level system
  function migrateKidLevel(who) {
    const migKey = 'sv-' + who + '-level-v9';
    if (localStorage.getItem(migKey)) return;
    const old = parseInt(localStorage.getItem('sv-' + who + '-level') || '0');
    const map  = { 1: 2, 2: 3, 3: 5, 4: 7 };
    const next = map[old];
    if (next !== undefined) localStorage.setItem('sv-' + who + '-level', String(next));
    localStorage.setItem(migKey, '1');
  }

  function getKidReadiness(who, rounds) {
    const level = getKidLevel(who);
    const reqs  = KID_LEVEL_REQS[level];
    if (!reqs) return { ready: true, atMax: true };

    const pts          = getKidActivityPoints(who, rounds || []);
    const roundCount   = (rounds || []).length;
    const checkinDone  = !!localStorage.getItem('sv-' + who + '-checkin-' + level);
    const ch           = reqs.challenge ? KID_CHALLENGES[reqs.challenge] : null;
    const challengeDone = ch ? (!!localStorage.getItem('sv-' + who + '-challenge-' + level) || ch.check(who, rounds || [])) : true;
    const pointsDone   = pts >= reqs.points;
    const roundsDone   = !reqs.minRounds || roundCount >= reqs.minRounds;
    const withinParDone = !reqs.withinPar || (rounds||[]).some(r => typeof r.score_vs_par === 'number' && r.score_vs_par <= reqs.withinPar);

    return {
      ready:           pointsDone && roundsDone && checkinDone && challengeDone && withinParDone,
      pointsDone,      pts,            pointsNeeded:   reqs.points,
      roundsDone,      roundCount,     minRounds:      reqs.minRounds || 0,
      withinParDone,   withinPar:      reqs.withinPar  || null,
      checkinDone,
      challengeDone,
      challengeTitle:  ch?.title || '',
      challengeShort:  ch?.short || '',
    };
  }

  function autoCheckChallenge(who, rounds) {
    const level = getKidLevel(who);
    const reqs  = KID_LEVEL_REQS[level];
    if (!reqs || !reqs.challenge) return;
    const key = 'sv-' + who + '-challenge-' + level;
    if (localStorage.getItem(key)) return;
    const ch = KID_CHALLENGES[reqs.challenge];
    if (ch && ch.check(who, rounds || [])) {
      localStorage.setItem(key, new Date().toISOString().split('T')[0]);
      const name = who === 'son' ? 'Son' : 'Daughter';
      setTimeout(() => showToast(name + ' completed the ' + ch.title + '!', 'gold'), 700);

  // ── ACCOUNT HOLDER CHECK-IN FLOW ────────────────────────────────────────

  function saveKidCheckin(who, score) {
    const level = getKidLevel(who);
    const qs    = KID_CHECKIN_QS[level];
    const pass  = qs ? (qs.passing || 3) : 3;

    }
    document.getElementById('kid-checkin-overlay')?.remove();
    const name = who === 'son' ? 'Son' : 'Daughter';
    if (score >= 3) showToast(name + '\'s Level ' + (level+1) + ' check-in passed!', 'gold');
    else showToast('Check-in saved, keep working toward it!');
    if (who === 'son') loadSonRoundsAndRender();
    if (who === 'girl') loadGirlRoundsAndRender();

  // Returns a score chip span using golf-standard color coding
  function scoreChip(score, par) {
    const d = score - par;
    let cls;
    if (d <= -2)     cls = 'sc-chip sc-eagle';
    else if (d === -1) cls = 'sc-chip sc-birdie';
    else if (d === 0)  cls = 'sc-chip sc-par';
    else if (d === 1)  cls = 'sc-chip sc-bogey';
    else if (d === 2)  cls = 'sc-chip sc-double';
    else               cls = 'sc-chip sc-triple';
    return `<span class="${cls}">${score}</span>`;
  }

  function getClubDist(name) {
    // Settings/Supabase distances are the source of truth for suggestions
    const active = getActiveClubs().find(c => c.name === name);
    if (active) return active.dist;
    // Legacy fallback: per-shot rolling average (sv-clubs) if club not in active list
    const saved = JSON.parse(localStorage.getItem('sv-clubs') || '{}');
    return saved[name] !== undefined ? saved[name] : 100;
  }

  function recordClubHit(clubName, yards) {
    if (!yards || yards < 10 || yards > 370) return;
    const saved = JSON.parse(localStorage.getItem('sv-clubs') || '{}');
    const n   = (saved[clubName + '_n'] || 0) + 1;
    const old = saved[clubName] !== undefined
      ? saved[clubName]
      : (CLUBS.find(c => c.name === clubName)?.dist || 100);
    saved[clubName]        = Math.round((old * (n - 1) + yards) / n);
    saved[clubName + '_n'] = n;
    localStorage.setItem('sv-clubs', JSON.stringify(saved));
  }

  function suggestClub(yards) {
    if (!yards || yards < 1) return null;
    // Driver excluded from approach suggestions, 7-Wood IS available for long layups (170+ yds)
    const approachClubs = getActiveClubs().filter(c => c.name !== 'Driver');
    const ranked = approachClubs.map(c => ({ ...c, avg: getClubDist(c.name) }))
                                .sort((a, b) => a.avg - b.avg);
    // Best fit: can reach AND not more than 40 yds overkill
    // Sorted ascending so goodFit[0] is always the shortest sufficient club
    const goodFit = ranked.filter(c => c.avg >= yards && c.avg <= yards + 40);
    if (goodFit.length) return goodFit[0];
    // Can reach (might be significant overkill), still pick shortest available
    const canReach = ranked.filter(c => c.avg >= yards);
    if (canReach.length) return canReach[0];
    // Nothing can reach, return the longest club available
    return ranked[ranked.length - 1];
  }

  function clubNote(club, yards) {
    if (!club) return '';
    const avg  = getClubDist(club.name);
    const n    = JSON.parse(localStorage.getItem('sv-clubs') || '{}')[club.name + '_n'] || 0;
    const diff = avg - yards;

    // Swing tips by club type
    const tips = {
      'Driver':   'tee low, ball forward off lead instep, sweep up, 60–70% tempo',
      '7-Wood':   'ball just inside lead instep, sweep through, 80% tempo, let it release',
      '4-Hybrid': 'ball lead-of-center, sweep with hip fire, 70% swing, let it run',
      '5-iron':   'ball lead-of-center, weight forward, compress',
      '6-iron':   'ball center-to-lead, divot after the ball, full finish',
      '7-iron':   'ball center, weight shifts to lead side, divot right of ball',
      '8-iron':   'ball center, hands forward, ball-first contact',
      '9-iron':   'ball center, trust the loft, hit down, let it fly',
      'PW':       'ball center, hands ahead, 80% swing, distance control over power',
      'GW':       '70–90 yds zone, find your reliable carry, don\'t max it',
      'SW':       'ball center-to-forward, light grip, accelerate through',
      'LW':       'ball forward, open face slightly, hinge and hold, soft landing',
    };
    const swingTip = tips[club.name] || '';

    if (avg < yards) return `max club, ${yards - avg} yds short · aim at front, let it run`;
    if (n === 0)   return `default estimate · ${swingTip}`;
    if (diff <= 5) return `tight fit, one more club? · ${swingTip}`;
    return `avg ${avg} yds · ${diff > 0 ? diff + ' yds buffer' : 'right on'} · ${swingTip}`;
  }

  // ── GPS ───────────────────────────────────────────────────────
  let _gpsWatchId = null, _currentPos = null, _markedPos = null;
  let _manualYards = null, _selectedApproachClub = null;

  function startGPS() {
    if (!('geolocation' in navigator)) return;
    _currentPos = null; _markedPos = null; _manualYards = null; _selectedApproachClub = null;
    _gpsWatchId = navigator.geolocation.watchPosition(
      p => {
        _currentPos = { lat: p.coords.latitude, lng: p.coords.longitude,
                        acc: Math.round(p.coords.accuracy * 1.094) };
        refreshGPSDisplay();
      },
      () => {},
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 3000 }
    );
  }

  // ── WAKE LOCK (keeps screen on during round, does NOT affect audio/Spotify) ──
  let _wakeLock = null;
  async function _acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    } catch(e) { /* silently ignore, not critical */ }
  }
  function _releaseWakeLock() {
    if (_wakeLock) { _wakeLock.release(); _wakeLock = null; }
  }

  function stopGPS() {
    if (_gpsWatchId !== null) {
      navigator.geolocation.clearWatch(_gpsWatchId); _gpsWatchId = null;
    }
    _currentPos = null; _markedPos = null; _manualYards = null; _selectedApproachClub = null;
  }

  function markBall() {
    if (!_currentPos) {
      // No GPS, apply manually typed yardage if present
      const inp = document.getElementById('live-yardage-input');
      if (inp && inp.value) {
        setManualYards(inp.value);
        const btn = document.querySelector('.mark-ball-btn');
        if (btn) btn.classList.add('marked');
        showToast('Yardage set ✓');
      } else {
        showToast('No GPS, type yardage in the field above', 'error');
      }
      return;
    }
    _markedPos = { ..._currentPos };
    const btn = document.querySelector('.mark-ball-btn');
    if (btn) btn.classList.add('marked');
    showToast('Ball marked ✓');
    refreshGPSDisplay();
  }

  function refreshGPSDisplay() {
    const yEl = document.getElementById('live-yards');
    const aEl = document.getElementById('live-gps-acc');
    if (!yEl) return;
    if (_manualYards !== null) {
      yEl.textContent = _manualYards;
      if (aEl) aEl.innerHTML = '<span class="gps-dot marked"></span>manual entry';
      refreshClubSuggestion(_manualYards); return;
    }
    if (!_currentPos) {
      yEl.textContent = '—';
      if (aEl) aEl.innerHTML = '<span class="gps-dot"></span>finding GPS…'; return;
    }
    if (!_markedPos) {
      yEl.textContent = '—';
      if (aEl) aEl.innerHTML = `<span class="gps-dot ready"></span>GPS ready (±${_currentPos.acc} yds) · tap Mark Ball at your ball`; return;
    }
    yEl.textContent = '—';
    if (aEl) aEl.innerHTML = `<span class="gps-dot marked"></span>ball marked (±${_markedPos.acc} yds) · now enter yardage from a marker`;
  }

  function setManualYards(val) {
    const n = parseInt(val);
    if (!val || isNaN(n) || n < 1) {
      _manualYards = null;
      const yEl = document.getElementById('live-yards');
      if (yEl) yEl.textContent = '—';
      const s = document.getElementById('live-club-suggest');
      if (s) s.style.display = 'none'; return;
    }
    _manualYards = n;
    const yEl = document.getElementById('live-yards');
    if (yEl) yEl.textContent = n;
    // Sync slider to typed value (clamp to range)
    const sldr = document.getElementById('live-yardage-slider');
    if (sldr) sldr.value = Math.min(250, Math.max(30, n));
    const s = document.getElementById('live-club-suggest');
    if (s) s.style.display = '';
    refreshClubSuggestion(n);
  }

  function tapYardage(y) {
    _manualYards = y;
    const inp = document.getElementById('live-yardage-input');

  function refreshClubSuggestion(yards) {
    const el = document.getElementById('live-club-suggest');
    if (!el) return;
    const suggested = suggestClub(yards);
    const note = suggested ? clubNote(suggested, yards) : '';
    // All clubs except Driver, reversed so SHORT clubs are LEFT, LONG clubs RIGHT
    // This matches the slider direction (30 yds = left, 250 yds = right)
    const approachClubs = [...getActiveClubs().filter(c => c.name !== 'Driver')].reverse();

    el.innerHTML = `
      ${suggested ? `<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--gold);line-height:1;">✦ ${suggested.name}</div>
        <div class="live-club-note">${note}</div>
      </div>` : ''}
      <div style="display:flex;flex-wrap:wrap;gap:5px;">
        ${approachClubs.map(c => {
          const avg = getClubDist(c.name);
          const isSuggested = suggested && c.name === suggested.name;
          const isSelected = _selectedApproachClub === c.name;
          const cls = isSelected ? ' used' : (isSuggested ? ' suggested' : '');
          return `<button class="club-chip${cls}" data-club="${c.name}" onclick="selectApproachClub(this,'${c.name}')">${c.name} <span style="font-size:0.6rem;opacity:0.6;">${avg}</span></button>`;

    `;
  }

  const _FAM_DRAFT_KEY       = 'spinvibes-fam-round-draft';

  function _saveFamDraft() {

      localStorage.setItem(_FAM_DRAFT_KEY, JSON.stringify({
        round: _famRound, holes: _famHoles, holeIdx: _famHoleIdx, ts: Date.now()
      }));

    try { return JSON.parse(localStorage.getItem(_FAM_DRAFT_KEY)); } catch(e) { return null; }

    try {
      localStorage.setItem(_ROUND_DRAFT_KEY, JSON.stringify({
        round: _dadRound,
        holes: _dadHoles,
        holeIdx: _dadHoleIdx,
        ts: Date.now()
      }));
    } catch(e) {}

  function _clearDraftRound() {
    try { localStorage.removeItem(_ROUND_DRAFT_KEY); } catch(e) {}

    dadHoleSave();
    if (_selectedApproachClub && _manualYards) recordClubHit(_selectedApproachClub, _manualYards);

    _dadHoles[_dadHoleIdx].approach_yds  = _manualYards || null;
    _dadHoles[_dadHoleIdx].approach_club = _selectedApproachClub

    _dadHoles[_dadHoleIdx].miss_dir   = document.querySelector('#dh-miss-dir-pills .pill.active')?.dataset.val   || null;

    _selectedApproachClub = null; _manualYards = null;
    if (_dadHoleIdx === _dadHoles.length - 1) {
      _clearDraftRound();
      renderDadReflection();
    } else {
      _dadHoleIdx++;
      _saveDraftRound();
      renderDadLiveHole();

  function dadMidRoundScorecard() {
    dadHoleSave();
    const total    = _dadHoles.reduce((a, h) => a + h.score, 0);
    const totalPar = _dadHoles.reduce((a, h) => a + h.par, 0);
    const diff     = total - totalPar;
    const diffStr  = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : String(diff));
    const thru     = _dadHoleIdx + 1;
    const diffColor = diff < 0 ? '#1E7A3A' : diff === 0 ? 'var(--muted)' : '#c0392b';

    // Split into front/back nines
    const front = _dadHoles.slice(0, 9);
    const back  = _dadHoles.slice(9);

    function buildGrid(holes, label) {
      if (!holes.length) return '';
      const holeNums  = holes.map(h => `<td style="text-align:center;font-size:0.62rem;font-weight:700;color:var(--muted);padding:5px 4px;letter-spacing:0.5px;">${h.hole}</td>`).join('');
      const pars      = holes.map(h => `<td style="text-align:center;font-size:0.72rem;color:var(--muted);padding:4px;">${h.par}</td>`).join('');
      const yds       = holes.map(h => `<td style="text-align:center;font-size:0.6rem;color:var(--muted);padding:3px;opacity:0.7;">${h.yds || '—'}</td>`).join('');
      let running = 0;
      holes.forEach(h => { running += h.score - h.par; });
      const scores = holes.map((h, idx) => {
        const isThru = _dadHoles.indexOf(h) < thru;
        const isCur  = _dadHoles.indexOf(h) === _dadHoleIdx;
        const chip   = isThru ? scoreChip(h.score, h.par) : `<span style="font-size:0.72rem;color:var(--border);font-weight:600;">·</span>`;
        const cur    = isCur ? `style="background:rgba(212,168,67,0.08);border-radius:4px;"` : '';
        return `<td ${cur} style="text-align:center;padding:4px 2px;">${chip}</td>`;
      }).join('');

      // Subtotal column
      const nineScore = holes.filter((_,i) => _dadHoles.indexOf(holes[i]) < thru).reduce((a,h) => a + h.score, 0);
      const ninePar   = holes.filter((_,i) => _dadHoles.indexOf(holes[i]) < thru).reduce((a,h) => a + h.par, 0);
      const nineDiff  = nineScore - ninePar;
      const nineDiffStr = nineScore === 0 ? '' : (nineDiff === 0 ? 'E' : (nineDiff > 0 ? '+'+nineDiff : String(nineDiff)));
      const nineColor = nineDiff < 0 ? '#1E7A3A' : nineDiff === 0 ? 'var(--muted)' : '#c0392b';

      return `

  // ── DAD ROUND RENDER ─────────────────────────────────────────
  async function loadDadRoundsAndRender() {
    const listEl = document.getElementById('dad-history-list');
    listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.85rem;"><i class="ti ti-loader-2" style="font-size:1.1rem;vertical-align:-2px;"></i> Loading your rounds…</div>';

  // Helper: is this a regulation 18-hole round?
  // Checks explicit round_type first (new rounds), falls back to course_par inference (legacy)
  function isRegulationRound(r) {
    if ((r.course_par || 0) < 65) return false; // safety net, par-3/exec always excluded
    if (r.round_type) return r.round_type === 'regulation_18';
    return true; // legacy rounds with course_par >= 65 assumed regulation
  }
  // Visual tag for non-regulation rounds
  function roundTypeTag(r) {
    if (r.round_type) {
      if (r.round_type === 'regulation_18') return '';
      if (r.round_type === 'nine_hole')     return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">9 HOLES</span>';
      if (r.round_type === 'par3_exec')     return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">PAR-3</span>';
      return '';
    }
    // Legacy fallback: infer from course_par
    if (!r.course_par || r.course_par >= 60) return '';
    if (r.course_par <= 36) return '<span style="font-size:0.6rem;background:rgba(100,116,139,0.2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:700;letter-spacing:0.5px;">9 HOLES</span>';

  // ── HANDICAP CALCULATOR ──────────────────────────────────────
  function calcScoreDifferential(score, rating, slope) {
    return Math.round(((score - rating) * 113 / slope) * 10) / 10;
  }

  // WHS table: number of best differentials to average given N available rounds
  function _whsBestCount(n) {
    if (n <= 5)   return 1;
    if (n <= 7)   return 2;
    if (n <= 9)   return 3;
    if (n <= 11)  return 4;
    if (n <= 13)  return 5;
    if (n === 14) return 6;
    if (n === 15) return 6;
    if (n === 16) return 6;
    if (n === 17) return 7;
    if (n === 18) return 7;
    if (n === 19) return 8;
    return 8;
  }

  // Returns { index, differentials, eligibleCount } or null if no eligible rounds
  function calcHandicapIndex(rounds) {
    // Enrich rounds with course rating/slope from COURSES list
    const allCourses = getAllCourses();
    const eligible = rounds
      .filter(r => {
        const rt = r.round_type || (r.course_par >= 60 ? 'regulation_18' : '');
        return rt === 'regulation_18';
      })
      .map(r => {
        const course = allCourses.find(c => c.name === r.course_name);
        const rating = course?.rating || null;
        const slope  = course?.slope  || null;
        if (!rating || !slope) return null;
        return {
          date: r.date_played,
          score: r.total_score,
          rating, slope,
          diff: calcScoreDifferential(r.total_score, rating, slope),
          course: r.course_name,
        };
      })
      .filter(Boolean)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (!eligible.length) return null;

    const last20 = eligible.slice(-20);
    const count  = _whsBestCount(last20.length);
    const sorted = [...last20].sort((a, b) => a.diff - b.diff);
    const best   = sorted.slice(0, count);
    const avg    = best.reduce((s, d) => s + d.diff, 0) / best.length;
    // WHS applies 0.96 multiplier (soft cap not implemented for simplicity)
    const index  = Math.round(avg * 0.96 * 10) / 10;

    return { index, differentials: last20, eligibleCount: eligible.length, usedCount: count };
  }

  function renderHandicapCard(rounds) {
    const el = document.getElementById('dad-hc-card');
    if (!el) return;
    const hc = calcHandicapIndex(rounds);
    if (!hc) {
      el.innerHTML = `
        <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;">
          <div style="font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:6px;">HANDICAP INDEX</div>
          <div style="font-size:0.82rem;color:var(--muted);line-height:1.5;">No eligible rounds yet, play a regulation 18 at TCI to start tracking your index.</div>
        </div>`;
      return;
    }
    // Last 8 differentials for mini sparkline
    const recent = hc.differentials.slice(-8);
    const diffs  = recent.map(d => d.diff);
    const dMin   = Math.min(...diffs);
    const dMax   = Math.max(...diffs);
    const dRange = dMax - dMin || 1;
    const diffBars = recent.map((d, i) => {
      // Lower diff = better = taller bar (invert scale)
      const pct = 100 - Math.round(((d.diff - dMin) / dRange) * 70);
      const isLast = i === recent.length - 1;
      const col = d.diff < hc.index ? '#1E7A3A' : 'var(--border)';
      return `<div title="${d.diff}" style="flex:1;height:${pct}%;min-height:15%;background:${isLast ? '#D4A843' : col};border-radius:2px 2px 0 0;"></div>`;
    }).join('');

    const indexColor = hc.index <= 18 ? 'var(--gold)' : hc.index <= 25 ? '#a78bfa' : 'var(--cream)';
    el.innerHTML = `
      <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;">
          <div>
            <div style="font-size:0.58rem;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:4px;">HANDICAP INDEX</div>
            <div style="display:flex;align-items:baseline;gap:6px;">
              <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:3rem;color:${indexColor};line-height:1;">${hc.index}</div>
              <div style="font-size:0.72rem;color:var(--muted);">est. WHS</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.58rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px;">ROUNDS USED</div>
            <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.6rem;color:var(--cream);line-height:1;">${hc.usedCount} <span style="font-size:0.9rem;">of</span> ${hc.eligibleCount}</div>
            <div style="font-size:0.6rem;color:var(--muted);">best differentials</div>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:28px;">
          ${diffBars}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px;">
          <div style="font-size:0.55rem;color:var(--muted);">${recent[0]?.date?.slice(5) || ''}</div>
          <div style="font-size:0.55rem;color:var(--gold);font-weight:600;">← recent · lower is better</div>
        </div>
      </div>`;
  }

  function renderApproachStats(rounds) {
    const el = document.getElementById('dad-approach-stats');
    if (!el) return;

    // Aggregate approach data across all rounds
    const clubData = {};
    let totalApproachHoles = 0;
    let totalApproachVsPar = 0;

    rounds.forEach(r => {
      const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
      holes.forEach(h => {
        if (!h.approach_club) return;
        const club = h.approach_club;
        if (!clubData[club]) clubData[club] = { count: 0, totalYds: 0, ydsCount: 0, totalVsPar: 0 };
        clubData[club].count++;
        totalApproachHoles++;
        const vp = (h.score || 0) - (h.par || 0);
        clubData[club].totalVsPar += vp;
        totalApproachVsPar += vp;
        if (h.approach_yds && h.approach_yds > 0) {
          clubData[club].totalYds += h.approach_yds;
          clubData[club].ydsCount++;
        }
      });
    });

    const clubs = Object.keys(clubData);
    if (clubs.length === 0) { el.style.display = 'none'; return; }

    // Sort by frequency
    clubs.sort((a,b) => clubData[b].count - clubData[a].count);

    const overallAvg = totalApproachVsPar / totalApproachHoles;
    const overallStr = overallAvg >= 0 ? '+' + overallAvg.toFixed(1) : overallAvg.toFixed(1);
    const overallColor = overallAvg <= 0.5 ? 'var(--green)' : overallAvg <= 1.2 ? 'var(--gold)' : 'var(--red)';

    // Per-round trend data (newest first, max 6 rounds with approach data)
    const roundTrend = rounds
      .map(r => {
        const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
        const aHoles = holes.filter(h => h.approach_club);
        if (!aHoles.length) return null;
        const avg = aHoles.reduce((a, h) => a + ((h.score || 0) - (h.par || 0)), 0) / aHoles.length;
        return { date: r.date_played, course: r.course_name || r.course || '', count: aHoles.length, avg };
      })
      .filter(Boolean)
      .slice(0, 6);

    const roundsWithData = roundTrend.length;

    // Best club (min 2 uses, best avg vs par)
    const eligibleClubs = clubs.filter(c => clubData[c].count >= 2);
    const bestClub = eligibleClubs.length
      ? eligibleClubs.slice().sort((a,b) => (clubData[a].totalVsPar/clubData[a].count) - (clubData[b].totalVsPar/clubData[b].count))[0]
      : null;

    // Per-club table rows
    const rows = clubs.map(club => {
      const d = clubData[club];
      const avgYds = d.ydsCount ? Math.round(d.totalYds / d.ydsCount) + 'y' : '—';
      const avg = d.totalVsPar / d.count;
      const avgStr = avg >= 0 ? '+' + avg.toFixed(1) : avg.toFixed(1);
      const color = avg <= 0.5 ? 'var(--green)' : avg <= 1.2 ? 'var(--gold)' : 'var(--red)';
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
        <td style="padding:7px 8px 7px 0;font-weight:600;font-size:0.82rem;color:var(--cream);">${club}</td>
        <td style="padding:7px 4px;text-align:center;font-size:0.8rem;color:var(--muted);">${d.count}</td>
        <td style="padding:7px 4px;text-align:center;font-size:0.8rem;color:var(--cream);">${avgYds}</td>
        <td style="padding:7px 0 7px 4px;text-align:right;font-size:0.82rem;font-weight:700;color:${color};">${avgStr}</td>
      </tr>`;
    }).join('');

    // Best club callout
    const bestClubHtml = bestClub ? (() => {
      const bc = clubData[bestClub];
      const avg = bc.totalVsPar / bc.count;
      const avgStr = avg >= 0 ? '+' + avg.toFixed(1) : avg.toFixed(1);
      return `<div style="margin-bottom:12px;padding:8px 12px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);border-radius:8px;font-size:0.8rem;line-height:1.4;">
        <i class="ti ti-trophy" style="color:var(--green);font-size:0.9rem;vertical-align:-1px;"></i> <strong style="color:var(--green);">Best club:</strong> ${bestClub}, avg <strong style="color:var(--green);">${avgStr}</strong> vs par over ${bc.count} approach${bc.count !== 1 ? 'es' : ''}
      </div>`;
    })() : '';

    // Round-by-round trend section
    let trendHtml = '';
    if (roundTrend.length >= 2) {
      const trendRows = roundTrend.map(r => {
        const avgStr = r.avg >= 0 ? '+' + r.avg.toFixed(1) : r.avg.toFixed(1);
        const color = r.avg <= 0.5 ? 'var(--green)' : r.avg <= 1.2 ? 'var(--gold)' : 'var(--red)';
        const d = new Date(r.date + 'T12:00:00');
        const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const course = r.course ? r.course.replace(/\s*\(.*\)/, '').substring(0, 22) : '—';
        return `<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">
          <td style="padding:5px 6px 5px 0;font-size:0.74rem;color:var(--muted);white-space:nowrap;">${dateStr}</td>
          <td style="padding:5px 4px;font-size:0.74rem;color:var(--cream);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${course}</td>
          <td style="padding:5px 4px;text-align:center;font-size:0.74rem;color:var(--muted);">${r.count}</td>
          <td style="padding:5px 0 5px 4px;text-align:right;font-size:0.77rem;font-weight:700;color:${color};">${avgStr}</td>
        </tr>`;
      }).join('');
      // Trend direction: compare most recent vs previous round
      const delta = roundTrend[0].avg - roundTrend[1].avg;
      const trendLabel = delta < -0.15 ? '↑ Improving' : delta > 0.15 ? '↓ Trending worse' : '→ Steady';
      trendHtml = `
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.07);">
          <div style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:8px;">Round by Round</div>
          <table style="width:100%;border-collapse:collapse;">
            <thead>
              <tr style="border-bottom:1px solid rgba(212,168,67,0.2);">
                <th style="text-align:left;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Date</th>
                <th style="text-align:left;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Course</th>
                <th style="text-align:center;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Shots</th>
                <th style="text-align:right;font-size:0.65rem;color:var(--muted);font-weight:600;padding-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;">Avg ±Par</th>
              </tr>
            </thead>
            <tbody>${trendRows}</tbody>
          </table>
          <div style="margin-top:8px;font-size:0.75rem;color:var(--muted);">${trendLabel}</div>
        </div>`;
    }

    el.style.display = '';
    el.innerHTML = `
      <button onclick="var p=this.nextElementSibling;p.style.display=p.style.display==='none'?'block':'none';this.querySelector('.arrow').textContent=p.style.display==='none'?'▼':'▲';"
        class="exp-trigger" style="width:100%;display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
        <span>Approach Stats</span>
        <span class="arrow">▼</span>
      </button>
      <div style="display:none;background:var(--surface2);border:1px solid rgba(212,168,67,0.2);border-radius:0 0 10px 10px;padding:16px;">
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:12px;">
          ${totalApproachHoles} approach${totalApproachHoles !== 1 ? 'es' : ''} tracked across ${roundsWithData} round${roundsWithData !== 1 ? 's' : ''}
          &nbsp;·&nbsp; avg <span style="color:${overallColor};font-weight:700;">${overallStr}</span> vs par on approach holes
        </div>
        ${bestClubHtml}
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="border-bottom:1px solid rgba(212,168,67,0.25);">
              <th style="text-align:left;font-size:0.68rem;color:var(--muted);font-weight:600;padding-bottom:7px;text-transform:uppercase;letter-spacing:0.5px;">Club</th>
              <th style="text-align:center;font-size:0.68rem;color:var(--muted);font-weight:600;padding-bottom:7px;text-transform:uppercase;letter-spacing:0.5px;">Used</th>
              <th style="text-align:center;font-size:0.68rem;color:var(--muted);font-weight:600;padding-bottom:7px;text-transform:uppercase;letter-spacing:0.5px;">Avg Yds</th>
              <th style="text-align:right;font-size:0.68rem;color:var(--muted);font-weight:600;padding-bottom:7px;text-transform:uppercase;letter-spacing:0.5px;">Avg ±Par</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div style="margin-top:12px;font-size:0.72rem;color:var(--muted);line-height:1.5;">
          ✅ Green = avg ≤ +0.5 &nbsp; 🟡 Gold = ≤ +1.2 &nbsp; 🔴 Red = > +1.2
        </div>
        ${trendHtml}
        ${renderDispersionSection(rounds)}
      </div>`;
  }

  function renderDispersionSection(rounds) {
    // Collect all holes with miss_dir or miss_depth data
    const missHoles = [];
    rounds.forEach(r => {
      const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
      holes.forEach(h => { if (h.miss_dir || h.miss_depth) missHoles.push(h); });
    });
    if (missHoles.length < 3) return ''; // Need at least 3 data points

    // Direction counts
    const dir = { left:0, center:0, right:0 };
    missHoles.forEach(h => { if (h.miss_dir && dir[h.miss_dir] !== undefined) dir[h.miss_dir]++; });
    const dirTotal = dir.left + dir.center + dir.right || 1;

    // Depth counts
    const dep = { short:0, pin:0, long:0 };
    missHoles.forEach(h => { if (h.miss_depth && dep[h.miss_depth] !== undefined) dep[h.miss_depth]++; });
    const depTotal = dep.short + dep.pin + dep.long || 1;

    const pct = (n, t) => Math.round(n / t * 100);
    const bar = (pct, color) =>
      `<div style="height:8px;border-radius:4px;background:${color};width:${Math.max(pct,4)}%;transition:width 0.3s;"></div>`;

    // Dominant miss for callout
    const dominantDir   = dir.left > dir.right && dir.left > dir.center ? 'left'
                        : dir.right > dir.left && dir.right > dir.center ? 'right' : 'center';
    const dominantDepth = dep.short > dep.long && dep.short > dep.pin ? 'short'
                        : dep.long > dep.short && dep.long > dep.pin ? 'long' : 'pin high';
    const tipMap = {
      left:   'You miss left. Aim slightly right of target, avoid pins tucked left.',
      right:  'You miss right. Aim slightly left of target, avoid pins tucked right.',
      center: 'Solid direction, keep tracking to confirm the pattern.',
    };
    const tip = tipMap[dominantDir];

    return `
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07);">
        <div style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;margin-bottom:10px;">
          Shot Dispersion <span style="font-weight:400;opacity:0.6;">(${missHoles.length} shots)</span>
        </div>

        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">
            <span>Direction</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">← Left</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dir.left,dirTotal),'#f97316')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dir.left,dirTotal)}%</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">✓ On</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dir.center,dirTotal),'#22c55e')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dir.center,dirTotal)}%</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">Right →</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dir.right,dirTotal),'#3b82f6')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dir.right,dirTotal)}%</div>
            </div>
          </div>
        </div>

        <div style="margin-bottom:12px;">
          <div style="display:flex;flex-direction:column;gap:5px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">Short</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dep.short,depTotal),'#f97316')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dep.short,depTotal)}%</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">Pin High</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dep.pin,depTotal),'#22c55e')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dep.pin,depTotal)}%</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:0.72rem;color:var(--cream);width:52px;">Long</div>
              <div style="flex:1;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;">${bar(pct(dep.long,depTotal),'#3b82f6')}</div>
              <div style="font-size:0.72rem;color:var(--muted);width:32px;text-align:right;">${pct(dep.long,depTotal)}%</div>
            </div>
          </div>
        </div>

        <div style="background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.2);border-radius:8px;padding:8px 12px;font-size:0.76rem;color:var(--cream);line-height:1.5;">
          <strong style="color:var(--gold);">Pattern:</strong> ${tip} Typical depth: <strong>${dominantDepth}</strong>.
        </div>
      </div>`;
  }

  function toggleRoundExpand(id) {
    const exp = document.getElementById(id + '-expand');
    if (exp) exp.classList.toggle('open');
  }

  // ── BEST ROUND (dynamic) ──────────────────────────────────────
  function refreshDadBestRound(rounds) {
    // rounds = already-loaded array (avoids second network call)
    // Only regulation rounds count, exclude par-3/exec and practice
    const regulation = rounds.filter(r => !r.is_practice && r.total_score > 0 && isRegulationRound(r));
    if (!regulation.length) return;
    const best = regulation.reduce((a, b) => a.total_score <= b.total_score ? a : b);
    const el = document.getElementById('dad-home-best');
    if (!el) return;
    const d = new Date(best.date_played + 'T12:00:00');
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    el.textContent = `Best: ${best.total_score}, ${dateStr}`;
  }

  async function loadDadBestRoundFromSupabase() {
    if (!_sb) return;
    try {
      // Fetch all non-practice rounds with round_type + course_par so isRegulationRound() can filter
      const { data } = await _sb
        .from('dad_rounds')
        .select('total_score, date_played, is_practice, round_type, course_par')
        .eq('is_practice', false)
        .order('total_score', { ascending: true });
      if (data && data.length) refreshDadBestRound(data);
    } catch(e) { /* silent, home hero keeps loading fallback */ }
  }

  async function confirmDeleteDadRound(id) {
    if (!confirm('Delete this round?')) return;
    try {
      await deleteDadRound(id);
      showToast('Round deleted');
      loadDadRoundsAndRender();
    } catch(e) {
      showToast('Delete failed, check your signal', 'error');
    }
  }

  // ── ROUND EDITING ─────────────────────────────────────────────
  function openRoundEditModal(roundId) {
    const r = _dadLoadedRounds.find(r => r.id === roundId);
    if (!r) return showToast('Round not found', 'error');
    _editingRoundId = roundId;
    const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
    const d = new Date(r.date_played + 'T12:00:00');
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const clubOptions = ['', ...getActiveClubs().map(c => c.name)];

    let modal = document.getElementById('round-edit-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'round-edit-modal';
      document.body.appendChild(modal);
    }
    modal.innerHTML = `
      <div class="rem-inner">
        <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--gold);margin-bottom:2px;">Edit Round</div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:18px;">${dateStr} · ${r.course_name}</div>
        <div style="font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;">APPROACH DATA</div>
        ${holes.map((h, i) => `
          <div class="rem-hole-row">
            <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1rem;color:var(--cream);width:28px;flex-shrink:0;">H${h.hole}</div>
            <div style="font-size:0.7rem;color:var(--muted);width:22px;flex-shrink:0;text-align:right;">p${h.par}</div>
            <select id="rem-club-${i}" style="flex:1;min-width:0;">
              <option value="">none —</option>
              ${clubOptions.filter(c => c).map(c =>
                `<option value="${c}"${h.approach_club === c ? ' selected' : ''}>${c}</option>`
              ).join('')}
            </select>
            <input id="rem-yds-${i}" type="number" min="0" max="320" placeholder="yds"
              value="${h.approach_yds != null ? h.approach_yds : ''}" />
          </div>`).join('')}
        <div style="display:flex;gap:10px;margin-top:20px;">
          <button onclick="saveRoundEdit(${holes.length})"
            style="flex:1;padding:13px;background:var(--green);border:none;border-radius:10px;color:var(--cream);font-family:'Archivo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;">
            Save Changes
          </button>
          <button onclick="closeRoundEditModal()"
            style="padding:13px 18px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'Archivo',sans-serif;font-size:0.9rem;cursor:pointer;">
            Cancel
          </button>
        </div>
      </div>`;
    modal.style.display = 'block';
  }

  function closeRoundEditModal() {
    const modal = document.getElementById('round-edit-modal');
    if (modal) modal.style.display = 'none';
    _editingRoundId = null;
  }

  async function saveRoundEdit(holeCount) {
    const r = _dadLoadedRounds.find(r => r.id === _editingRoundId);
    if (!r) return;
    const holes = (Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]')).map((h, i) => {
      const club = document.getElementById(`rem-club-${i}`)?.value || '';
      const ydsRaw = document.getElementById(`rem-yds-${i}`)?.value;
      return { ...h, approach_club: club || null, approach_yds: ydsRaw ? parseInt(ydsRaw, 10) : null };
    });
    try {
      const { error } = await _sb.from('dad_rounds').update({ holes }).eq('id', _editingRoundId);
      if (error) throw error;
      // Update local cache so UI reflects change without a full reload
      const cached = _dadLoadedRounds.find(r => r.id === _editingRoundId);
      if (cached) cached.holes = holes;
      showToast('Round updated ✓');
      closeRoundEditModal();
      loadDadRoundsAndRender();
    } catch(e) {
      showToast('Save failed, ' + (e?.message || 'check signal'), 'error');
    }
  }

  // ── SON ROUND RENDER ─────────────────────────────────────────
  async function loadSonRoundsAndRender() {
    const listEl = document.getElementById('son-history-list');
    listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.85rem;"><i class="ti ti-loader-2" style="font-size:1.1rem;vertical-align:-2px;"></i> Loading your rounds…</div>';
    try {
      migrateKidLevel('son');
      const rounds = await loadSonRounds();
      renderKidLevelCard('son', rounds);
      checkAutoLevelUp('son', rounds);
      renderSonHistory(rounds);
    } catch(e) {
      renderKidLevelCard('son', []);
      listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:0.85rem;">Could not connect, check your signal</div>';
    }
  }

  function renderSonHistory(rounds) {
    const listEl = document.getElementById('son-history-list');
    if (!rounds || rounds.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.85rem;">No rounds yet. Tap \u2018Start New Round\u2019 after your next game. \uD83C\uDFCC\uFE0F</div>';
      return;
    }
    // Badges section at top (level shield + kid-specific + shared)
    const badgesHtml = `<div style="margin-bottom:16px;">${renderKidBadges('son', rounds, '#3B7CB8')}</div>`;
    listEl.innerHTML = badgesHtml + rounds.map((r, idx) => {
      const d = new Date(r.date_played + 'T12:00:00');
      const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const diff = r.score_vs_par >= 0 ? '+' + r.score_vs_par : r.score_vs_par;
      const badgeClass = r.total_score < 90 ? 'green' : r.total_score <= 99 ? 'gold' : 'red';
      const holes = Array.isArray(r.holes) ? r.holes : JSON.parse(r.holes || '[]');
      const holeGrid = holes.map(h => `<div class="hole-cell"><div class="h-num">${h.hole}</div><div class="h-score">${h.score}</div><div class="h-par">p${h.par}</div></div>`).join('');
      const ref = r.reflection ? (typeof r.reflection === 'string' ? JSON.parse(r.reflection) : r.reflection) : {};
      return `
        <div class="round-card" id="son-round-${idx}">
          <div class="round-card-header" onclick="toggleRoundExpand('son-round-${idx}')">
            <div class="round-card-left">
              <div class="round-card-date">${dateStr}</div>
              <div class="round-card-course">${r.course_name}</div>
            </div>
            <div class="round-card-right">
              <div class="round-badge ${badgeClass}">${r.total_score} <span style="font-size:0.75rem;opacity:0.7;">(${diff})</span></div>
            </div>
          </div>
          <div class="round-card-expand" id="son-round-${idx}-expand">
            <div class="hole-grid">${holeGrid}</div>

  // Lock/unlock background scroll when modal is open (prevents iOS scroll bleed-through)
  // Uses top-offset technique so iOS doesn't jump to top on lock
  function _lockBodyScroll() {
    const scrollY = window.scrollY || 0;
    document.body.dataset.scrollY = scrollY;
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = '100%';
    // .page has a `transform` (for page-switch animation) which creates a new
    // containing block for position:fixed descendants, #dad-modal lives inside
    // .page.dad-progress, so without this the modal positions relative to .page
    // and the Round History list bleeds through behind the CARD view. Neutralize
    // the transform for the duration of the modal.
    document.documentElement.classList.add('modal-open');
  }
  function _unlockBodyScroll() {
    const scrollY = parseInt(document.body.dataset.scrollY || '0');
    document.body.style.overflow = '';
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, scrollY);
    document.documentElement.classList.remove('modal-open');
  }

  // Temecula Creek fix: GolfCourseAPI has no "Sage" tee for this course (only
  // Blue/White/Red, none matching Jeremy's physical scorecard, confirmed by
  // probing /course-detail directly). Inject the verified Sage tee from the
  // local COURSES list (scorecard-sourced) so it's selectable alongside
  // whatever the API returns, keyed off the API's course/sub-layout name.
  function _injectSageTee(courseData, clubName, courseName) {
    if (!/temecula creek/i.test(clubName||'')) return courseData;
    const already = (courseData.allTees||[]).some(t => /sage/i.test(t.name||''));
    if (already) return courseData;
    const cn = (courseName||'').toLowerCase();
    const hasCreek = cn.includes('creek'), hasStone = cn.includes('stone'), hasOaks = cn.includes('oaks');
    const nineOnly = !cn.includes('/');
    let match = null;
    if (nineOnly && hasCreek)      match = COURSES.find(c => c.name === 'TCI, Creek (9 holes)');
    else if (nineOnly && hasStone) match = COURSES.find(c => c.name === 'TCI, Stonehouse (9 holes)');
    else if (nineOnly && hasOaks)  match = COURSES.find(c => c.name === 'TCI, Oaks (9 holes)');
    else if (hasCreek && hasStone) match = COURSES.find(c => c.name === 'TCI, Creek + Stonehouse');
    else if (hasOaks && hasCreek && cn.indexOf('oaks') < cn.indexOf('creek')) match = COURSES.find(c => c.name === 'TCI, Oaks + Creek');
    else if (hasCreek && hasOaks)  match = COURSES.find(c => c.name === 'TCI, Creek + Oaks');
    if (!match) return courseData;
    const sageTee = {
      name: 'Sage', rating: match.rating||null, slope: match.slope||null,
      yards: match.yardages.reduce((a,y)=>a+y,0), par: match.par,
      holePars: match.holePars, yardages: match.yardages,
    };
    courseData.allTees = [sageTee, ...(courseData.allTees||[])];
    return courseData;
  }

  async function dadSelectCourse(courseId, clubName, location, courseName) {

    if(st)st.textContent='Loading tee data...'; if(re)re.innerHTML='';

      const data=await resp.json();
      if(!resp.ok||data.error){if(st)st.textContent=data.error||'Failed to load course';return;}
      _dadCourseId=courseId; _dadCourseData=_injectSageTee(data.course, clubName, courseName);
      if(st)st.textContent='';
      const sd=document.getElementById('dm-course-selected');
      if(sd)sd.style.display='';
      const ne=document.getElementById('dm-course-name'); if(ne)ne.textContent=clubName+(courseName?', '+courseName:'');

      // Tee pills
      const tees=data.course.allTees||[];
      const tw=document.getElementById('dm-tee-wrap'), tp=document.getElementById('dm-tee-pills');
      if(tees.length&&tw&&tp){
        tw.style.display='';
        const sage = tees.find(t=>/sage/i.test(t.name||''));

        tp.innerHTML=tees.map((t,i)=>`<div class="pill${_dadSelectedTee===t.name?' active':''}" onclick="dadSetTee(this,'${t.name.replace(/'/g,"\\'")}',${i})" data-val="${t.name}" style="touch-action:manipulation;">${t.name}${t.yards?' <span style=\'font-size:0.62rem;opacity:0.7;\'>'+(t.yards)+'y</span>':''}</div>`).join('');
      }
      // Auto-detect format from hole count
      const holes=(data.course.allTees?.[0]?.holePars||[]).length||18;

      if(fmtPill){document.querySelectorAll('#dm-format-pills .pill').forEach(p=>p.classList.remove('active'));fmtPill.classList.add('active');}
    } catch(e){if(st)st.textContent='Network error';}
  }

  function dadStartRound() {
    const roundType  = document.querySelector('#dm-format-pills .pill.active')?.dataset.val || 'regulation_18';
    const isPractice = document.querySelector('#dm-type-pills .pill.active')?.dataset.val === 'practice';

    // Practice rounds don't require a course, use placeholder if none selected
    if (!_dadCourseData && !isPractice) { showToast('Search and select a course first', 'error'); return; }

    const tee      = _dadSelectedTee || (_dadCourseData?.allTees?.[_dadCourseData.allTees.length-1]?.name) || 'White';
    const teeData  = _dadCourseData?.allTees?.find(t => t.name === tee) || _dadCourseData?.allTees?.[0] || {};
    const holePars = teeData.holePars || _dadCourseData?.holePars || [];
    const yardages = teeData.yardages || _dadCourseData?.yardages || [];

    // Determine hole count from format pill or course data
    let numHoles = holePars.length || 18;
    if (roundType === 'nine_hole') numHoles = Math.min(numHoles, 9);

    const coursePar  = holePars.slice(0, numHoles).reduce((a,b)=>a+b, 0) || _dadCourseData?.par || (numHoles === 9 ? 36 : 72);
    const courseName = _dadCourseData
      ? _dadCourseData.name + (_dadCourseData.course ? ', ' + _dadCourseData.course : '')
      : 'Practice Session';

    _dadRound = {
      date_played: document.getElementById('dm-date').value,
      course_name: courseName,
      course_par:  coursePar,
      tee_color:   tee,
      total_score: 0,
      score_vs_par: 0,
      is_practice: isPractice,
      round_type:  roundType,
    };
    _dadHoles = [];
    _dadHoleIdx = 0;
    _dadLiveCaddieHistory = [];
    _dadLiveCaddieOpen    = false;

    const defaultPar = Math.round(coursePar / numHoles) || 4;
    for (let i = 1; i <= numHoles; i++) {
      const holePar = holePars[i-1] || defaultPar;
      const yds = yardages[i-1] || null;
      _dadHoles.push({ hole: i, par: holePar, score: holePar, fairway: 'no', gir: false, putts: 2, yds });
    }
    document.getElementById('dad-running-total').style.display = '';
    _acquireWakeLock();
    renderDadLiveHole();
  }

  }

  function dadHoleScore(delta) {

    _updateDadRT();
  }
  function dadHolePar(delta) {
    const h = _dadHoles[_dadHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    document.getElementById('dh-par').textContent = h.par;
  }
  function dadHolePutts(delta) {
    const h = _dadHoles[_dadHoleIdx];
    h.putts = Math.max(0, Math.min(6, h.putts + delta));
    document.getElementById('dh-putts-val').textContent = h.putts;
    document.getElementById('dh-putts-big').textContent = h.putts;

  function dadHoleSave() {

    h.fairway = document.querySelector('#dh-fairway-pills .pill.active')?.dataset.val || 'no';
    h.gir = document.querySelector('#dh-gir-pills .pill.active')?.dataset.val === 'yes';

    dadHoleSave();

      renderDadReflection();
    } else {
      _dadHoleIdx++;
      renderDadHole();
    }

    dadHoleSave();

  let _dadStars = 0;

    if (total < 90) motivational = 'SUB-90! The goal is done. 🏆';
    else if (total <= 95) motivational = "You're right there. Sub-90 is one clean round away. 🔥";
    else if (total <= 100) motivational = 'Solid round. Keep eliminating the doubles. 💪';
    else if (total <= 110) motivational = 'Good data. Every round teaches you something. 🎯';

        <span class="star-btn" onclick="dadSetStar(4)" id="dstar-4">⭐</span>

        <span style="font-size:0.87rem;color:var(--muted);">Save this round</span>
        <label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer;">

          <span style="position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform 0.2s;" id="dr-save-thumb"></span>

      thumb.style.transform  = cb.checked ? 'translateX(20px)' : 'translateX(0)';

        saveBtn.style.color      = cb.checked ? '' : 'var(--muted)';

  function dadSetStar(n) {
    _dadStars = n;

  async function saveDadRoundFull() {
    const doSave = document.getElementById('dr-do-save')?.checked !== false;
    const total = _dadHoles.reduce((a, h) => a + h.score, 0);

    // Skip Save mode, just close, no DB write
    if (!doSave) {
      showToast('Test round, not saved');
      _clearDraftRound();
      closeDadModal();
      return;
    }

    const roundObj = {
      date_played: _dadRound.date_played,
      course_name: _dadRound.course_name,
      course_par: _dadRound.course_par,
      tee_color: _dadRound.tee_color,
      total_score: total,
      score_vs_par: total - _dadRound.course_par,
      holes: _dadHoles,
      is_practice: _dadRound.is_practice || false,
      round_type: _dadRound.round_type || 'regulation_18',
      reflection: {
        best: document.getElementById('dr-best').value.trim(),
        worst: document.getElementById('dr-worst').value.trim(),
        worked: document.getElementById('dr-worked').value.trim(),
        fix: document.getElementById('dr-fix').value.trim(),
        stars: _dadStars
      },
      stars: _dadStars
    };
    const saveBtn = document.querySelector('#dad-modal-body .btn-primary');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }
    try {
      // Upload hole photos to Supabase Storage before saving
      const dadRoundId = crypto.randomUUID();
      const hasDadPhotos = _dadHoles.some(h => h.photo && !h.photo.startsWith('http'));
      if (hasDadPhotos) {
        if (saveBtn) saveBtn.textContent = 'Uploading photos...';
        await uploadDadRoundPhotos(dadRoundId);
        // Reflect uploaded URLs back into roundObj.holes
        roundObj.holes = _dadHoles;
        if (saveBtn) saveBtn.textContent = 'Saving...';
      }
      await saveDadRound(roundObj);
      _clearDraftRound();
      showToast(_dadRound.is_practice ? 'Practice round saved' : 'Round saved');
      closeDadModal();
      loadDadRoundsAndRender();
    } catch(e) {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = '↺ Retry Save';
        saveBtn.style.background = 'var(--red)';
      }
      showToast('Save failed, tap Retry Save when you have signal', 'error');
    }
  }

  // ══════════════════════════════════════════════════════════
  //  KIDS LEVELING SYSTEM

  // KID_LEVELS moved to top of file, see line ~20

  function getKidLevel(who) {
    const defaults = { son: 0, girl: 0 };
    return parseInt(localStorage.getItem('sv-' + who + '-level') || defaults[who] || 1);
  }
  function setKidLevel(who, level) {
    localStorage.setItem('sv-' + who + '-level', String(Math.min(4, Math.max(1, level))));
  }

  function renderKidLevelCard(who, rounds) {

    const color    = def.color;
    const r        = getKidReadiness(who, rounds || []);

    const gate = (done, label, action) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">

      </div>`;

    let readinessHtml = '';

        <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.07);">
          <div style="font-size:0.6rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;">LEVEL ${level+1} READINESS</div>
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
              <span style="font-size:0.7rem;color:var(--muted);">Activity points</span>
              <span style="font-size:0.7rem;color:${color};font-weight:700;">${r.pts} / ${r.pointsNeeded}</span>

          </div>

          ${gate(r.checkinDone,   'Account holder check-in', currentProfile==='dad'?'showKidCheckin(\'' + who + '\')':'')}
          ${ch ? gate(r.challengeDone, ch.title + ', ' + ch.short, '') : ''}
          ${r.withinPar ? gate(r.withinParDone, 'Shoot within +' + r.withinPar + ' of par in a round', '') : ''}

    }

    el.innerHTML = `
      <div class="section level-card" style="padding-bottom:4px;">
        <div class="card" style="border-color:${color}50;background:${color}12;padding:14px 16px;">

            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:1.6rem;line-height:1;"><i class="${def.icon}" style="color:${color};"></i></span>
              <div>
                <div style="font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${color};margin-bottom:1px;">Level ${level}</div>
                <div style="font-size:1rem;font-weight:700;color:var(--cream);line-height:1.1;">${def.name}</div>

          </div>

          ${readinessHtml}
        </div>

  // Account holder promotes a kid, requires confirmation
  function adminLevelUp(who) {
    const current = getKidLevel(who);
    if (current >= 8) { showToast('Already at max level! Tour Bound!', 'gold'); return; }
    const next = KID_LEVELS[current + 1];
    const name = who === 'son' ? 'Son' : 'Daughter';
    const r    = getKidReadiness(who, null); // null rounds = use cached state

    let msg = `Promote ${name} to Level ${current + 1}: "${next.name}"?`;
    if (!r.ready) {
      const missing = [];
      if (!r.roundsDone)    missing.push(`${r.roundCount}/${r.roundsNeeded} rounds played`);
      if (!r.rangeDone)     missing.push(`${r.rangeCount}/${r.rangeNeeded} range sessions`);
      if (!r.checkinDone)   missing.push('check-in not completed');
      if (!r.challengeDone) missing.push(`${r.challengeTitle} not completed`);
      msg += `\n\n⚠️ Still pending:\n• ${missing.join('\n• ')}\n\nYou can still promote, you know best.`;
    } else {
      msg += '\n\nAll readiness gates are met, great milestone!';
    }

    if (!confirm(msg)) return;
    setKidLevel(who, current + 1);
    localStorage.removeItem('sv-' + who + '-autolvl-' + (current + 1));
    triggerLevelUpCeremony(who, current + 1);
  }

  // Check if auto-flag should fire (does NOT auto-promote, just notifies account holder)
  function checkAutoLevelUp(who, rounds) {
    const current = getKidLevel(who);
    if (current >= 8) return;
    autoCheckChallenge(who, rounds); // auto-detect challenge completion
    const r      = getKidReadiness(who, rounds);
    const flagKey = 'sv-' + who + '-autolvl-' + (current + 1);
    if (r.ready && !localStorage.getItem(flagKey)) {
      localStorage.setItem(flagKey, '1');
      const name = who === 'son' ? 'Son' : 'Daughter';
      setTimeout(() => showToast(name + ' is ready for Level ' + (current + 1) + '! Check their progress page.', 'gold'), 800);
    }
  }

  // Check for first-ever par / birdie milestones on a kid round
  // Fires a celebratory toast the very first time it happens, does not auto-promote
  function checkKidMilestones(who, holes) {
    if (!holes || !holes.length) return;
    const name = who === 'son' ? 'Son' : 'Daughter';

    // First birdie (score <= par - 1 on any hole)
    const hasBirdie = holes.some(h => {
      const par   = h.par   || h.course_par || 3;
      const score = h.score || (h.scores && h.scores[who]) || 0;
      return score > 0 && score <= par - 1;
    });
    if (hasBirdie && !localStorage.getItem('sv-' + who + '-first-birdie')) {
      localStorage.setItem('sv-' + who + '-first-birdie', new Date().toISOString().split('T')[0]);
      setTimeout(() => showToast('🌿 First Birdie for ' + name + '! Amazing round!', 'gold'), 600);
      // Also flag for level-up consideration
      localStorage.setItem('sv-' + who + '-milestone-birdie', '1');
    }

    // First par (score === par on any hole, if no birdie already flagged)
    if (!localStorage.getItem('sv-' + who + '-first-par')) {
      const hasPar = holes.some(h => {
        const par   = h.par   || h.course_par || 3;
        const score = h.score || (h.scores && h.scores[who]) || 0;
        return score > 0 && score === par;
      });
      if (hasPar) {
        localStorage.setItem('sv-' + who + '-first-par', new Date().toISOString().split('T')[0]);
        if (!hasBirdie) {
          setTimeout(() => showToast('🎯 First Par for ' + name + '! Keep it up!', 'gold'), 600);
        }
        localStorage.setItem('sv-' + who + '-milestone-par', '1');
      }
    }

    // After milestones, re-check auto level-up threshold
    // (milestone flags are considered alongside round count in future Sprint 6)
  }

  // ── SON ROUND MODAL ─────────────────────────────────────────
  let _sonRound = {};
  let _sonHoles = [];
  let _sonHoleIdx = 0;

  function openSonModal() {
    _sonRound = {};
    _sonHoles = [];
    _sonHoleIdx = 0;
    document.getElementById('son-modal').style.display = 'block';
    document.getElementById('son-running-total').style.display = 'none';
    renderSonModalSetup();
  }
  function closeSonModal() {
    document.getElementById('son-modal').style.display = 'none';
  }

  function renderSonModalSetup() {
    document.getElementById('son-modal-step-label').textContent = 'Round Setup';
    const today = new Date().toISOString().split('T')[0];
    const courseOpts = getAllCourses().map((c,i) => `<option value="${i}">${c.name} (par ${c.par})</option>`).join('');
    document.getElementById('son-modal-body').innerHTML = `
      <label class="modal-label">Date</label>
      <input type="date" id="sm-date" class="modal-input" value="${today}">
      <label class="modal-label">Course</label>
      <select id="sm-course" class="modal-input" onchange="sonCourseChange(this.value)">
        ${courseOpts}
      </select>
      <div id="sm-custom-wrap" style="display:none;">
        <input type="text" id="sm-custom-name" class="modal-input" placeholder="Course name">
        <div style="display:flex;gap:10px;">
          <input type="number" id="sm-custom-par" class="modal-input" placeholder="Par (e.g. 72)" style="flex:1;">
          <select id="sm-custom-holes" class="modal-input" style="flex:1;">
            <option value="18">18 holes</option>
            <option value="9">9 holes</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:10px;" onclick="sonStartRound()">Start Round →</button>
    `;
  }

  function sonCourseChange(val) {
    const custom = document.getElementById('sm-custom-wrap');
    custom.style.display = parseInt(val) === getAllCourses().length - 1 ? 'block' : 'none';
  }

  function sonStartRound() {
    const courseIdx = parseInt(document.getElementById('sm-course').value);
    let course = getAllCourses()[courseIdx];
    let courseName = course.name;
    let coursePar = course.par;
    let numHoles = course.holes;
    if (courseIdx === getAllCourses().length - 1) {
      courseName = document.getElementById('sm-custom-name').value.trim() || 'Custom Course';
      coursePar = parseInt(document.getElementById('sm-custom-par').value) || 72;
      numHoles = parseInt(document.getElementById('sm-custom-holes').value) || 18;
    }
    _sonRound = {
      date_played: document.getElementById('sm-date').value,
      course_name: courseName,
      course_par: coursePar,
    };
    _sonHoles = [];
    _sonHoleIdx = 0;
    const holePar = Math.round(coursePar / numHoles);
    for (let i = 1; i <= numHoles; i++) {
      _sonHoles.push({ hole: i, par: holePar, score: holePar });
    }
    document.getElementById('son-running-total').style.display = '';
    renderSonHole();
  }

  function renderSonHole() {
    const h = _sonHoles[_sonHoleIdx];
    const total = _sonHoles.slice(0, _sonHoleIdx).reduce((a, x) => a + x.score, 0) + h.score;
    document.getElementById('son-running-total').textContent = total;
    document.getElementById('son-modal-step-label').textContent = `Hole ${_sonHoleIdx + 1} of ${_sonHoles.length}`;
    const isLast = _sonHoleIdx === _sonHoles.length - 1;
    document.getElementById('son-modal-body').innerHTML = `
      <div class="hole-score-block">
        <div class="hole-number-big">HOLE ${h.hole}</div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;">
          Par:
          <button class="stepper-btn" onclick="sonHolePar(-1)">−</button>
          <span style="font-size:1.1rem;color:var(--cream);margin:0 8px;" id="sh-par">${h.par}</span>
          <button class="stepper-btn" onclick="sonHolePar(1)">+</button>
        </div>
        <label class="modal-label" style="align-self:flex-start;">Score</label>
        <div class="score-stepper">
          <button class="stepper-btn" onclick="sonHoleScore(-1)">−</button>
          <div class="score-val" id="sh-score">${h.score}</div>
          <button class="stepper-btn" onclick="sonHoleScore(1)">+</button>
        </div>
      </div>
      <div class="modal-nav-row">
        <button class="btn-ghost" onclick="sonHoleBack()" ${_sonHoleIdx===0?'disabled style="opacity:0.3;"':''}>← Back</button>
        <button class="btn-gold" onclick="sonHoleNext()">${isLast ? 'Finish Round →' : 'Next Hole →'}</button>
      </div>
    `;
  }

  function sonHoleScore(delta) {
    const h = _sonHoles[_sonHoleIdx];
    h.score = Math.max(1, h.score + delta);
    document.getElementById('sh-score').textContent = h.score;
    const total = _sonHoles.slice(0, _sonHoleIdx).reduce((a, x) => a + x.score, 0) + h.score;
    document.getElementById('son-running-total').textContent = total;
  }
  function sonHolePar(delta) {
    const h = _sonHoles[_sonHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    document.getElementById('sh-par').textContent = h.par;
  }
  function sonHoleNext() {
    if (_sonHoleIdx === _sonHoles.length - 1) {
      renderSonReflection();
    } else {
      _sonHoleIdx++;
      renderSonHole();
    }
  }
  function sonHoleBack() {
    if (_sonHoleIdx > 0) { _sonHoleIdx--; renderSonHole(); }
  }

  function renderSonReflection() {
    document.getElementById('son-running-total').style.display = 'none';
    const total = _sonHoles.reduce((a, h) => a + h.score, 0);
    const par = _sonRound.course_par;
    const diff = total - par;
    const diffStr = diff >= 0 ? '+' + diff : '' + diff;
    document.getElementById('son-modal-step-label').textContent = 'Post-Round';
    document.getElementById('son-modal-body').innerHTML = `
      <div class="score-summary-card">
        <div class="score-summary-score">${total}</div>
        <div class="score-summary-line">You shot ${total}, ${diffStr} over par</div>
      </div>
      <label class="modal-label">🏆 Best hole this round</label>
      <textarea id="sr-best" class="modal-input" rows="2" placeholder="Your best hole..."></textarea>
      <label class="modal-label">📝 Anything to remember?</label>
      <textarea id="sr-remember" class="modal-input" rows="2" placeholder="Notes for next time..."></textarea>
      <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="saveSonRoundFull()">Save Round</button>
    `;
  }
