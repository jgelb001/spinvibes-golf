  function _caddieSystemWithCtx() {
    const tendency = localStorage.getItem('sv-dad-tendency') || '';
    const tendencyMap = {
      pull_left:   'Miss tendency: pulls left. Aim slightly right of target; avoid pins tucked left.',
      push_right:  'Miss tendency: pushes right. Aim slightly left of target; avoid pins tucked right.',
      hook:        'Miss tendency: hooks hard left. Club up and aim well right; avoid left trouble.',
      slice:       'Miss tendency: slices right. Aim left of target and expect rightward curve.',
      thin:        'Miss tendency: thins/tops. Take one extra club; do not try to help the ball up.',
      fat:         'Miss tendency: hits fat. Ball slightly back in stance cue; take one less club.',
    };
    const tendencyLine = tendencyMap[tendency] || '';
    return _CADDIE_SYSTEM + (tendencyLine ? '\n\nMISS TENDENCY: ' + tendencyLine : '');
  }

  function renderCaddieYardageChips() {
    const el = document.getElementById('caddie-yardage-chips');
    if (!el) return;
    // Build yardage chips from active clubs, skipping driver, sorted by distance asc
    const clubs = getActiveClubs()
      .filter(c => c.name !== 'Driver')
      .sort((a, b) => a.dist - b.dist);
    // Pick ~7 evenly spaced distances as tap targets
    const step = Math.max(1, Math.floor(clubs.length / 7));
    const picks = clubs.filter((_, i) => i % step === 0).slice(0, 8);
    el.innerHTML = picks.map(c =>
      `<button class="caddie-yardage-chip" onclick="caddieQuickTap('I\\'m ${c.dist} yards out, what\\'s the play?')">${c.dist}y</button>`
    ).join('');
  }

  function caddieQuickTap(msg) {

  function caddieInputKeydown(e) {

  async function sendCaddieMessage() {
    const inp = document.getElementById('caddie-input');
    const msg = inp.value.trim();
    if (!msg) return;

    inp.value = '';
    _caddieHistory.push({ role: 'user', content: msg });
    renderCaddieMessages(true);

    const btn = document.getElementById('caddie-send-btn');
    btn.disabled = true;
    btn.textContent = '…';

    try {
      const resp = await fetch(CADDIE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({
          messages: _caddieHistory.slice(-6),
          systemPrompt: _caddieSystemWithCtx()
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast(err?.error || `Error ${resp.status}`, 'error');
        _caddieHistory.pop();
        renderCaddieMessages(false);
        return;
      }

      const data = await resp.json();
      const reply = data?.reply || '—';
      _caddieHistory.push({ role: 'assistant', content: reply });
      renderCaddieMessages(false);
    } catch(e) {
      showToast('No signal, check your connection', 'error');
      _caddieHistory.pop();
      renderCaddieMessages(false);
    } finally {
      btn.disabled = false;
      btn.textContent = '➤';
    }
  }

  function toggleCaddieMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showToast('Voice not supported on this browser', 'error');
      return;
    }
    if (_caddieListening) {
      _caddieRecognition && _caddieRecognition.stop();
      return;
    }
    _caddieRecognition = new SpeechRecognition();
    _caddieRecognition.lang = 'en-US';
    _caddieRecognition.interimResults = false;
    _caddieRecognition.maxAlternatives = 1;

    const micBtn = document.getElementById('caddie-mic-btn');

    _caddieRecognition.onstart = () => {
      _caddieListening = true;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone" style="color:#ef4444;"></i>'; micBtn.style.color = '#ef4444'; micBtn.style.borderColor = '#ef4444'; }
    };
    _caddieRecognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      const inp = document.getElementById('caddie-input');
      if (inp) {
        inp.value = (inp.value ? inp.value + ' ' : '') + transcript;
      }
    };
    _caddieRecognition.onend = () => {
      _caddieListening = false;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone"></i>'; micBtn.style.color = ''; micBtn.style.borderColor = ''; }
      // Auto-send if there's content
      const inp = document.getElementById('caddie-input');
      if (inp && inp.value.trim()) sendCaddieMessage();
    };
    _caddieRecognition.onerror = (e) => {
      _caddieListening = false;
      if (micBtn) { micBtn.innerHTML = '<i class="ti ti-microphone"></i>'; micBtn.style.color = ''; micBtn.style.borderColor = ''; }
      if (e.error !== 'no-speech') showToast('Mic error: ' + e.error, 'error');
    };

    _caddieRecognition.start();
  }

      </div>

    loadFamHistory();
    famRenderTeamPicker();

  async function famSearchCourse() {
    const query = (document.getElementById('fm-search-input')?.value || '').trim();
    const statusEl  = document.getElementById('fm-search-status');
    const resultsEl = document.getElementById('fm-search-results');
    if (!query || query.length < 2) { if (statusEl) statusEl.textContent = 'Type at least 2 characters'; return; }
    if (statusEl) statusEl.textContent = 'Searching...';
    if (resultsEl) resultsEl.innerHTML = '';
    try {
      const resp = await fetch(CADDIE_URL + '/course-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({ query }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) { if (statusEl) statusEl.textContent = data.error || 'Search failed'; return; }
      const courses = data.courses || [];
      if (!courses.length) { if (statusEl) statusEl.textContent = 'No courses found, try a shorter name'; return; }
      if (statusEl) statusEl.textContent = courses.length + ' found, tap to select';
      resultsEl.innerHTML = courses.map(c => {
        const loc = [c.city, c.state].filter(Boolean).join(', ');
        const sub = loc ? '<div style="font-size:0.7rem;color:var(--muted);">' + loc + '</div>' : '';
        const safeId   = String(c.id);
        const safeName = (c.name || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        const safeLoc  = loc.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        const safeCourse = (c.course || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return '<div onclick="famSelectCourse(' + safeId + ',\'' + safeName + '\',\'' + safeLoc + '\',\'' + safeCourse + '\')"'
          + ' style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;touch-action:manipulation;margin-bottom:4px;">'
          + '<div style="font-size:0.88rem;font-weight:600;color:var(--cream);">' + c.name + '</div>' + sub + '</div>';
      }).join('');
    } catch(e) {
      if (statusEl) statusEl.textContent = 'Network error, check signal';
    }
  }

  async function famSelectCourse(courseId, clubName, location, courseName) {
    const statusEl  = document.getElementById('fm-search-status');
    const resultsEl = document.getElementById('fm-search-results');
    if (statusEl) statusEl.textContent = 'Loading tee data...';
    if (resultsEl) resultsEl.innerHTML = '';
    try {
      const resp = await fetch(CADDIE_URL + '/course-detail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({ courseId, includeAllTeeHoles: true }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) { if (statusEl) statusEl.textContent = data.error || 'Failed to load course'; return; }

      _famCourseId   = courseId;
      _famCourseData = data.course;
      if (statusEl) statusEl.textContent = '';

      const selectedDiv = document.getElementById('fm-course-selected');
      const nameEl = document.getElementById('fm-course-name');
      const subEl  = document.getElementById('fm-course-sub');
      if (selectedDiv) selectedDiv.style.display = '';
      if (nameEl) nameEl.textContent = clubName + (courseName ? ', ' + courseName : '');
      const teeNames = (data.course.allTees || []).map(t => t.name).join(', ');
      if (subEl) subEl.textContent = (location || '') + (teeNames ? ' · Tees: ' + teeNames : '');

      famRefreshTeePills();
    } catch(e) {
      if (statusEl) statusEl.textContent = 'Network error, check signal';
    }
  }

  function famClearCourse() {
    _famCourseId   = null;
    _famCourseData = null;
    const selectedDiv = document.getElementById('fm-course-selected');
    if (selectedDiv) selectedDiv.style.display = 'none';
    ['dad','son','girl','mom','grandma'].forEach(pk => {
      const pillsEl = document.getElementById('fam-tee-pills-' + pk);
      if (pillsEl) pillsEl.innerHTML = '<div class="pill" style="font-size:0.72rem;padding:4px 10px;opacity:0.5;">Search a course first</div>';
      _famPlayerTees[pk] = null;
    });
    const statusEl = document.getElementById('fm-search-status');
    if (statusEl) statusEl.textContent = '';
  }

  function famRefreshTeePills() {
    const tees = (_famCourseData?.allTees || []);
    ['dad','son','girl','mom','grandma'].forEach(pk => {
      const selectorEl = document.getElementById('fam-tee-selector-' + pk);
      const pillsEl    = document.getElementById('fam-tee-pills-' + pk);
      if (!selectorEl || !pillsEl) return;
      const isActive = document.querySelector('.fam-checkbox-card[data-player="' + pk + '"].selected');
      if (!isActive) return;
      if (!tees.length) {
        pillsEl.innerHTML = '<div class="pill" style="font-size:0.72rem;padding:4px 10px;opacity:0.5;">No tee data</div>';
        return;
      }
      // Default: dad gets longest tee (tournament), others get shortest (resort/forward)
      const defaultTee = pk === 'dad' ? tees[tees.length - 1].name : tees[0].name;
      if (!_famPlayerTees[pk]) _famPlayerTees[pk] = defaultTee;
      pillsEl.innerHTML = tees.map(t =>
        '<div class="pill' + (_famPlayerTees[pk]===t.name?' active':'') + '" onclick="famSetPlayerTee(\'' + pk + '\',\'' + t.name.replace(/'/g,"\\'") + '\')"'
        + ' data-val="' + t.name + '" style="font-size:0.72rem;padding:4px 10px;touch-action:manipulation;">'
        + t.name + (t.yards ? ' <span style=\'font-size:0.62rem;opacity:0.7;\'>' + t.yards + 'y</span>' : '') + '</div>'
      ).join('');
    });
  }

  function famSetPlayerTee(pk, teeName) {
    _famPlayerTees[pk] = teeName;
    const pillsEl = document.getElementById('fam-tee-pills-' + pk);
    if (!pillsEl) return;
    pillsEl.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.val === teeName));
  }

  function famTogglePlayer(el, pk) {
    el.classList.toggle('selected');
    const isSelected = el.classList.contains('selected');
    el.style.background   = isSelected ? 'rgba(36,150,87,0.08)' : 'var(--bg)';
    el.style.borderColor  = isSelected ? 'var(--green)'  : 'var(--border)';
    const selectorEl = document.getElementById('fam-tee-selector-' + pk);
    if (selectorEl) {
      selectorEl.style.display = isSelected ? 'block' : 'none';
      if (isSelected && _famCourseData) famRefreshTeePills();
    }
    famRenderTeamPicker();
  }

  // Called whenever the round-type pill changes, hides game mode for fun/practice rounds.
  function famOnTypeChange() {
    const val = document.querySelector('#fm-type-pills .pill.active')?.dataset.val;
    const gmWrap = document.getElementById('fm-gamemode-wrap');
    if (gmWrap) gmWrap.style.display = (val === 'scored') ? 'flex' : 'none';
  }

  function famSelectGameMode(key) {
    if (!GAME_MODES[key] || GAME_MODES[key].status === 'soon') return;
    _famGameMode = key;
    _famGmExplainerOpen = false;
    document.querySelectorAll('#fm-gamemode-wrap .fm-gamemode-card').forEach(card => {
      const ck = card.dataset.mode;
      const isSel = ck === key;
      card.classList.toggle('selected', isSel);
      card.style.borderColor = isSel ? 'var(--green)' : 'var(--border)';
      card.style.background  = isSel ? 'rgba(36,150,87,0.08)' : 'var(--bg)';
      const check = card.querySelector('.ph-check-circle');
      if (check) check.style.color = isSel ? 'var(--green)' : 'var(--surface3)';
    });
    const howtoTrigger = document.getElementById('fm-gamemode-howto');
    const howtoBody    = document.getElementById('fm-gamemode-howto-body');
    if (howtoTrigger) {
      howtoTrigger.style.display = key === 'none' ? 'none' : 'flex';
      const span = howtoTrigger.querySelector('span');
      if (span) span.textContent = `How does ${GAME_MODES[key].name} work?`;
      const caret = howtoTrigger.querySelector('[class*="ph-caret"]');
      if (caret) caret.className = 'ph-light ph-caret-down';
    }
    if (howtoBody) {
      howtoBody.style.display = 'none';
      howtoBody.textContent = GAME_MODES[key].howTo;
    }
    famRenderTeamPicker();
  }

  // Team Scramble: renders the team-assignment picker (names + per-player A/B toggle)
  // into #fm-teams-wrap. Re-run whenever the game mode or player selection changes.
  function famRenderTeamPicker() {
    const wrap = document.getElementById('fm-teams-wrap');
    if (!wrap) return;
    if (_famGameMode !== 'team_scramble') { wrap.innerHTML = ''; return; }

    const selectedPlayers = Array.from(document.querySelectorAll('#fam-modal-body .fam-checkbox-card.selected')).map(c => c.dataset.player);
    // Default-assign any newly-selected player to whichever team is smaller (keeps it balanced)
    selectedPlayers.forEach(pk => {
      if (!_famTeamAssign[pk]) {
        const aCount = selectedPlayers.filter(k => _famTeamAssign[k] === 'a').length;
        const bCount = selectedPlayers.filter(k => _famTeamAssign[k] === 'b').length;
        _famTeamAssign[pk] = aCount <= bCount ? 'a' : 'b';
      }
    });
    // Drop assignments for players no longer selected
    Object.keys(_famTeamAssign).forEach(pk => { if (!selectedPlayers.includes(pk)) delete _famTeamAssign[pk]; });

    if (selectedPlayers.length < 2) {
      wrap.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);padding:10px 0;">Pick at least 2 players to set up teams.</div>`;
      return;
    }

    const teamRow = (teamKey, color) => {
      const members = selectedPlayers.filter(pk => _famTeamAssign[pk] === teamKey);
      return `<div style="background:${color}12;border:1px solid ${color}45;border-radius:12px;padding:11px 13px;margin-bottom:8px;">
        <input type="text" value="${_famTeamNames[teamKey]}" maxlength="18" oninput="famSetTeamName('${teamKey}', this.value)"
          style="width:100%;background:transparent;border:none;border-bottom:1.5px solid ${color}55;color:${color};font-family:'Archivo',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:0.5px;padding:2px 0 5px;margin-bottom:8px;">
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${members.length ? members.map(pk => {
            const p = FAM_PLAYERS[pk];
            return `<div onclick="famAssignTeam('${pk}','${teamKey==='a'?'b':'a'}')" style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);border-radius:20px;cursor:pointer;touch-action:manipulation;">
              <div style="width:22px;height:22px;border-radius:50%;background:${p.color};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-weight:800;font-size:0.7rem;flex-shrink:0;">${p.emoji}</div>
              <span style="font-size:0.76rem;font-weight:600;color:var(--cream);">${p.name}</span>
              <i class="ph-light ph-arrows-left-right" style="font-size:0.85rem;color:var(--muted);"></i>
            </div>`;
          }).join('') : `<div style="font-size:0.7rem;color:var(--muted);padding:4px 0;">No one yet, tap a player on the other team to move them here.</div>`}
        </div>
      </div>`;
    };

    wrap.innerHTML = `
      <label class="modal-label" style="margin-top:12px;">Set your teams <span style="font-weight:400;color:var(--muted);">tap a player to swap sides</span></label>
      ${teamRow('a', '#378ADD')}
      ${teamRow('b', '#D4537E')}
      <div style="font-size:0.68rem;color:var(--muted);text-align:center;margin:-2px 0 10px;">📸 Tip: name your teams something fun, it'll show up when you share photos from the round.</div>
    `;
  }

  function famAssignTeam(pk, teamKey) {
    _famTeamAssign[pk] = teamKey;
    famRenderTeamPicker();
  }

  function famSetTeamName(teamKey, val) {
    // Store the live value as typed, don't re-render (would steal input focus).
    // Empty/default fallback is applied at round-start time in startFamRound().
    _famTeamNames[teamKey] = val;
  }

  function famToggleGmExplainer() {
    if (_famGameMode === 'none') return;
    _famGmExplainerOpen = !_famGmExplainerOpen;
    const body  = document.getElementById('fm-gamemode-howto-body');
    const caret = document.querySelector('#fm-gamemode-howto [class*="ph-caret"]');
    if (body)  body.style.display = _famGmExplainerOpen ? 'block' : 'none';
    if (caret) caret.className = _famGmExplainerOpen ? 'ph-light ph-caret-up' : 'ph-light ph-caret-down';
  }

      await deleteFamilyRound(id);
      showToast('Round deleted');
      loadFamHistory();
    } catch(e) {
      showToast('Delete failed, check your signal', 'error');

  // ── FAMILY MEMORIES GALLERY ───────────────────────────────────
  let _memFilter = 'all';

  function memFilterPill(el) {
    _memFilter = el.dataset.val;
    document.querySelectorAll('#mem-filter-pills .pill').forEach(p => {
      const active = p === el;
      p.classList.toggle('selected', active);
      p.style.color    = active ? 'var(--gold)' : 'var(--muted)';
      p.style.background = active ? 'rgba(212,168,67,0.18)' : p.style.background.replace('0.18','0.08');
      p.style.borderColor = active ? 'rgba(212,168,67,0.3)' : 'rgba(255,255,255,0.08)';

  async function loadMemoriesGallery() {
    const listEl = document.getElementById('fam-memories-list');
    if (!listEl) return;
    listEl.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;text-align:center;padding:20px 0;">Loading…</div>';
    try {
      let rounds = await loadFamilyRounds();
      if (!rounds || rounds.length === 0) {
        listEl.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;text-align:center;padding:24px 0;">No family rounds yet, start one.</div>';
        return;
      }
      if (_memFilter !== 'all') {
        rounds = rounds.filter(r => (r.players || []).includes(_memFilter));
      }
      if (rounds.length === 0) {
        listEl.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;text-align:center;padding:24px 0;">No rounds for this player yet.</div>';
        return;
      }
      listEl.innerHTML = rounds.map(r => {
        const totals  = r.totals || {};
        const players = r.players || [];
        const photos  = (r.holes || []).map(h => h.photo).filter(p => _hasPhoto(p));
        const chips   = players.map(pk => {
          const p = FAM_PLAYERS[pk];
          if (!p) return '';
          return `<span style="background:${p.bg};color:${p.color};padding:2px 8px;border-radius:20px;font-size:0.72rem;font-weight:700;">${p.emoji} ${totals[pk] ?? '?'}</span>`;
        }).join('');
        const photoStrip = photos.length ? `
          <div style="display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;">
            ${photos.map(src => `<img src="${src}" loading="lazy"
              style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;border:1px solid rgba(212,168,67,0.25);cursor:pointer;"
              onclick="event.stopPropagation();_showPhotoOverlay('${src}')">`).join('')}
          </div>` : '';
        return `<div style="background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.05);">
          <div onclick="viewFamRound(${JSON.stringify(r).replace(/"/g,'&quot;')})" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <div style="flex:1;">
              <div style="font-weight:700;font-size:0.88rem;color:var(--cream);">${r.course_name}</div>
              <div style="font-size:0.72rem;color:var(--muted);margin-top:2px;">${r.date_played}${photos.length ? ` · 📷 ${photos.length}` : ''}</div>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:160px;">${chips}</div>
            <div style="color:var(--muted);font-size:0.9rem;">›</div>
          </div>
          ${photoStrip}
          <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <button onclick="event.stopPropagation();viewFamRound(${JSON.stringify(r).replace(/"/g,'&quot;')})" style="background:none;border:1px solid rgba(212,168,67,0.3);border-radius:8px;padding:5px 12px;color:var(--gold-l);font-size:0.75rem;font-weight:600;cursor:pointer;touch-action:manipulation;">Share ↗</button>
          </div>
        </div>`;
      }).join('');
    } catch(e) {
      listEl.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;text-align:center;padding:20px 0;">Could not load, check signal</div>';
    }
  }

  async function loadFamHistory() {
    const listEl = document.getElementById('fam-history-list');
    if (!listEl) return;
    try {
      const rounds = await loadFamilyRounds();
      if (!rounds || rounds.length === 0) {
        listEl.textContent = 'No family rounds yet, start one above!';
        return;
      }
      listEl.innerHTML = rounds.map(r => {
        const totals   = r.totals || {};
        const players  = r.players || [];
        const isFun    = r.game_mode === 'fun';
        const chips    = isFun
          ? players.map(pk => {
              const p = FAM_PLAYERS[pk];
              if (!p) return '';
              return `<span style="background:${p.bg};color:${p.color};padding:2px 8px;border-radius:20px;font-size:0.72rem;font-weight:700;">${p.emoji} ${p.name}</span>`;
            }).join('')
          : players.map(pk => {
              const p = FAM_PLAYERS[pk];
              if (!p) return '';
              return `<span style="background:${p.bg};color:${p.color};padding:2px 8px;border-radius:20px;font-size:0.72rem;font-weight:700;">${p.emoji} ${totals[pk] ?? '?'}</span>`;
            }).join('');
        const funBadge = isFun ? `<span style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 5px;margin-left:6px;">Fun</span>` : '';
        return `<div style="background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.05);">

            <div style="flex:1;">
              <div style="font-weight:700;font-size:0.88rem;color:var(--cream);">${r.course_name}${funBadge}</div>
              <div style="font-size:0.72rem;color:var(--muted);margin-top:2px;">${r.date_played}</div>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">${chips}</div>
            <div style="color:var(--muted);font-size:0.9rem;">›</div>
          </div>

          </div>
        </div>`;
      }).join('');
    } catch(e) {
      listEl.textContent = 'Could not load history, check signal';
    }
  }

  function viewFamRound(r) {
    // Reconstruct _famRound and _famHoles from saved data
    _famRound = { date_played: r.date_played, course_name: r.course_name, course_par: r.course_par, players: r.players || [], game_mode: r.game_mode || null, game_mode_data: r.game_mode_data || null, is_fun_round: r.game_mode === 'fun', is_practice: r.is_practice || false };
    _famHoles = (r.holes || []).map(h => ({
      ...h,
      scores: h.scores || {},
      photos: h.photos || (h.photo || h.photo_url ? [h.photo || h.photo_url] : []),
      photo:  h.photos?.[0] || h.photo || h.photo_url || null,
    }));
    // Open modal if not already visible
    const modal = document.getElementById('family-modal');
    if (modal && modal.style.display !== 'flex') {
      _lockBodyScroll();
      modal.style.display = 'flex';
    }
    const footer = document.getElementById('fam-modal-footer');
    if (footer) footer.style.display = 'none';
    const closeBtn = document.getElementById('fam-modal-close-btn');
    if (closeBtn) closeBtn.style.display = '';
    const holeSub = document.getElementById('fam-modal-hole-sub');
    if (holeSub) holeSub.style.display = 'none';
    const label = document.getElementById('fam-modal-label');
    if (label) label.textContent = r.course_name || 'Round';
    renderFamSummary();
    // Override buttons, read-only share view
    setTimeout(() => {
      const saveBtn = document.querySelector('#fam-modal-body .btn-primary');
      if (saveBtn) saveBtn.style.display = 'none';
      // Change Done to Back
      const btns = document.querySelectorAll('#fam-modal-body .btn-ghost');
      btns.forEach(b => { if (b.id !== 'fam-share-btn') { b.textContent = '\u2190 Back'; b.setAttribute('onclick','closeFamilyModal()'); } });
    }, 50);
  }

  function startFamRound() {
    const players = Array.from(document.querySelectorAll('#fam-modal-body .fam-checkbox-card.selected'))
                         .map(c => c.dataset.player);
    if (!players.length) { showToast('Pick at least one player', 'error'); return; }

    const famType       = document.querySelector('#fm-type-pills .pill.active')?.dataset.val || 'scored';
    const famIsPractice = famType === 'practice';
    const famIsFun      = famType === 'fun';
    const dateVal = document.getElementById('fm-date').value;

    let courseName, coursePar, numHoles, holePars, playerYardages;

    if (_famCourseData) {
      // API-sourced course, use tee data per player
      const dadTee = _famCourseData.allTees?.find(t => t.name === _famPlayerTees['dad']) || _famCourseData.allTees?.[_famCourseData.allTees.length - 1] || {};
      courseName = _famCourseData.name + (_famCourseData.course ? ', ' + _famCourseData.course : '');
      numHoles   = (dadTee.holePars || _famCourseData.holePars || []).length || 18;
      holePars   = dadTee.holePars || _famCourseData.holePars || Array(numHoles).fill(4);
      coursePar  = holePars.reduce((a,b) => a+b, 0);
      playerYardages = {};
      players.forEach(pk => {
        const tee = _famCourseData.allTees?.find(t => t.name === _famPlayerTees[pk]);
        playerYardages[pk] = tee?.yardages || null;
      });
    } else if (famIsFun) {
      // Fun round, course selection optional; use typed name if available
      const typed = (document.getElementById('fm-search-input')?.value || '').trim();
      courseName = typed || 'Golf Course';
      numHoles   = 18;
      holePars   = Array(18).fill(4);
      coursePar  = 72;
      playerYardages = {};
    } else {
      showToast('Please search and select a course first', 'error');
      return;
    }

    // Fun rounds use game_mode:'fun' (no schema change needed, reuses existing column)
    // Game mode setup, additive, backward-compatible. 'none' stores game_mode:null
    const gmKey = famIsFun ? 'fun' : (_famGameMode || 'none');
    const gameMode = gmKey === 'none' ? null : gmKey;
    let gameModeData = null;
    if (gmKey === 'junior_scramble') {
      // Each kid gets one bomb-drive rescue per 9 holes. Track usage + which holes were rescued.
      const kidKeys = players.filter(pk => pk === 'son' || pk === 'girl');
      gameModeData = {
        kids: kidKeys,
        bombDrivesUsed: Object.fromEntries(kidKeys.map(pk => [pk, []])),   // [{hole, front9: bool}]
        rescuedHoles:   {},   // { holeNum: kidKey }
      };
    }
    if (gmKey === 'team_scramble') {
      const teamA = players.filter(pk => _famTeamAssign[pk] === 'a');
      const teamB = players.filter(pk => _famTeamAssign[pk] === 'b');
      if (!teamA.length || !teamB.length) { showToast('Each team needs at least one player', 'error'); return; }
      gameModeData = {
        teamNames: {
          a: (_famTeamNames.a || '').trim() || 'Team A',
          b: (_famTeamNames.b || '').trim() || 'Team B',
        },
        teams: { a: teamA, b: teamB },
      };
    }
    if (gmKey === 'parents_vs_kids') {
      const kidKeys   = players.filter(pk => pk === 'son' || pk === 'girl');
      const adultKeys = players.filter(pk => pk !== 'son' && pk !== 'girl');
      if (!kidKeys.length || !adultKeys.length) { showToast('Needs at least one kid and one adult', 'error'); return; }
      const kidHcap = pk => { const lvl = getKidLevel(pk); return lvl <= 1 ? 3 : lvl <= 3 ? 2 : 1; };
      gameModeData = {
        kids: kidKeys, adults: adultKeys,
        kidHandicaps: Object.fromEntries(kidKeys.map(pk => [pk, kidHcap(pk)])),
        holeWins: {},
      };
    }
    if (gmKey === 'hole_challenge') {
      const POOL = ['fewest_putts', 'longest_drive', 'hit_fairway'];
      let pi = 0;
      const challenges = {};
      holePars.forEach((par, i) => { challenges[i + 1] = par === 3 ? 'closest_pin' : POOL[pi++ % POOL.length]; });
      gameModeData = { challenges, wins: {} };
    }
    if (gmKey === 'kid_birdie_bomb') {
      const kidKeys = players.filter(pk => pk === 'son' || pk === 'girl');
      if (!kidKeys.length) { showToast('Needs at least one kid', 'error'); return; }
      const kidOffset = pk => { const lvl = getKidLevel(pk); return lvl <= 1 ? 3 : lvl <= 3 ? 2 : 1; };
      gameModeData = {
        kids: kidKeys,
        kidTargetOffset: Object.fromEntries(kidKeys.map(pk => [pk, kidOffset(pk)])),
        kidWins: {},
      };
    }
    if (gmKey === 'team_captain') {
      const kidKeys   = players.filter(pk => pk === 'son' || pk === 'girl');
      const adultKeys = players.filter(pk => pk !== 'son' && pk !== 'girl');
      if (!kidKeys.length) { showToast('Needs at least one kid to be captain', 'error'); return; }
      gameModeData = { kids: kidKeys, adults: adultKeys, captainOrder: kidKeys, captainPicks: {} };
    }

    _famRound = {
      date_played: dateVal,
      course_name: courseName,
      course_par:  coursePar,
      players,
      is_practice:  famIsPractice,
      is_fun_round: famIsFun,
      player_tees:  Object.fromEntries(players.map(pk => [pk, _famPlayerTees[pk] || null])),
      course_id:    _famCourseId,
      game_mode:      gameMode,
      game_mode_data: gameModeData,
    };
    _famHoleIdx       = 0;
    _famCaddieHistory = [];
    _famCaddieOpen    = false;

    _famHoles = Array.from({length: numHoles}, (_, i) => {
      const par    = holePars[i] || 4;
      const scores = {};
      if (!famIsFun) players.forEach(p => { scores[p] = par; }); // fun rounds start with no scores
      const playerYds = {};
      players.forEach(pk => { playerYds[pk] = playerYardages[pk]?.[i] || null; });
      return { hole: i+1, par, scores, photos: [], highlights: [], yds: playerYardages['dad']?.[i] || null, playerYds, putts: {}, fairway: {} };
    });

    document.getElementById('fam-running-bar').style.display = famIsFun ? 'none' : 'flex';
    _renderFamCurrentHole();
  }

    function famScoreColor(diff) {
    if (diff <= -2) return '#a78bfa';
    if (diff === -1) return '#60a5fa';
    if (diff === 0)  return 'var(--green)';
    if (diff === 1)  return 'var(--cream)';
    if (diff === 2)  return 'var(--red)';
    return '#ff4444';
  }

  function famScoreClass(diff) {
    if (diff <= -2) return 'fam-eagle';
    if (diff === -1) return 'fam-birdie';
    if (diff === 0)  return 'fam-par';
    if (diff === 1)  return 'fam-bogey';
    if (diff === 2)  return 'fam-double';
    return 'fam-triple';
  }

  function updateFamRunningBar() {
    const bar = document.getElementById('fam-running-bar');
    if (!bar) return;
    bar.innerHTML = _famRound.players.map(pk => {
      const p = FAM_PLAYERS[pk];
      const total = _famHoles.slice(0, _famHoleIdx + 1).reduce((a, h) => {
        const sc = h.scores?.[pk] ?? null; return a + (sc !== null ? sc : 0);
      }, 0);
      return `<span class="fam-running-chip" style="background:${p.bg};color:${p.color};">${p.emoji} ${total}</span>`;
    }).join('');

  // Junior Scramble: builds the per-hole banner showing rescue status + bomb-drive buttons.
  // Each kid gets ONE rescue per 9 holes (front 9 / back 9 tracked separately).
  function famJuniorScrambleBanner(h) {
    if (_famRound.game_mode !== 'junior_scramble' || !_famRound.game_mode_data) return '';
    const gm = _famRound.game_mode_data;
    const holeNum = h.hole;
    const isFront9 = holeNum <= 9;
    const rescuedBy = gm.rescuedHoles[holeNum];

    if (rescuedBy) {
      const p = FAM_PLAYERS[rescuedBy];
      return `<div style="display:flex;align-items:center;gap:10px;background:${p.color}1c;border:1px solid ${p.color}55;border-radius:12px;padding:11px 14px;margin-bottom:10px;">
        <i class="ph-light ph-rocket-launch" style="font-size:1.3rem;color:${p.color};"></i>
        <div style="flex:1;">
          <div style="font-size:0.84rem;font-weight:700;color:${p.color};">Bomb drive used, ${p.name}'s carrying the team!</div>
          <div style="font-size:0.7rem;color:var(--muted);margin-top:1px;">Team plays from ${p.name}'s tee shot on this hole.</div>
        </div>
        <button onclick="famUndoBombDrive(${holeNum})" style="background:none;border:none;color:var(--muted);font-size:0.68rem;text-decoration:underline;cursor:pointer;flex-shrink:0;touch-action:manipulation;">Undo</button>
      </div>`;
    }

    const kidButtons = (gm.kids || []).map(pk => {
      const p = FAM_PLAYERS[pk];

      const usedThisHalf = used.some(u => (u.front9 ?? true) === isFront9);
      if (usedThisHalf) {
        return `<div style="display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--muted);padding:7px 12px;background:var(--surface2);border-radius:20px;opacity:0.6;">
          <i class="ph-light ph-rocket-launch" style="color:${p.color};"></i> ${p.name}'s bomb drive used this ${isFront9?'front':'back'} 9
        </div>`;
      }
      return `<button onclick="famUseBombDrive('${pk}')" style="display:flex;align-items:center;gap:6px;font-size:0.74rem;font-weight:700;color:${p.color};padding:8px 14px;background:${p.color}18;border:1.5px solid ${p.color}55;border-radius:20px;cursor:pointer;touch-action:manipulation;">
        <i class="ph-light ph-rocket-launch"></i> ${p.name}: use bomb drive
      </button>`;
    }).join('');

    if (!kidButtons) return '';
    return `<div style="margin-bottom:10px;">
      <div style="font-size:0.66rem;color:var(--muted);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px;">Junior Scramble, ${isFront9?'Front':'Back'} 9 rescue available</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${kidButtons}</div>
    </div>`;
  }

  function famUseBombDrive(pk) {
    const h = _famHoles[_famHoleIdx];
    const gm = _famRound.game_mode_data;
    if (!gm || !gm.kids?.includes(pk)) return;
    const isFront9 = h.hole <= 9;
    const used = gm.bombDrivesUsed[pk] || (gm.bombDrivesUsed[pk] = []);
    if (used.some(u => (u.front9 ?? true) === isFront9)) { showToast(`${FAM_PLAYERS[pk].name} already used their ${isFront9?'front':'back'}-9 bomb drive`, 'error'); return; }
    used.push({ hole: h.hole, front9: isFront9 });
    gm.rescuedHoles[h.hole] = pk;
    _saveFamDraft();
    renderFamHole();
    showToast(`🚀 ${FAM_PLAYERS[pk].name}'s bomb drive is in play!`);
  }

  function famUndoBombDrive(holeNum) {
    const gm = _famRound.game_mode_data;
    if (!gm) return;
    const pk = gm.rescuedHoles[holeNum];
    if (!pk) return;
    delete gm.rescuedHoles[holeNum];
    gm.bombDrivesUsed[pk] = (gm.bombDrivesUsed[pk] || []).filter(u => u.hole !== holeNum);
    _saveFamDraft();
    renderFamHole();
  }

  function famTeamScrambleBanner(h) {
    if (_famRound.game_mode !== 'team_scramble' || !_famRound.game_mode_data) return '';
    const gm = _famRound.game_mode_data;
    const teamRow = (teamKey, color) => {
      const members = gm.teams[teamKey] || [];
      const scores = members.map(pk => h.scores[pk]).filter(s => typeof s === 'number' && s > 0);

        <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--text);">${best !== null ? best : '—'}</div>

    return `<div style="margin-bottom:10px;">
      <div style="font-size:0.66rem;color:var(--muted);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px;">Team Scramble, best ball this hole</div>

    </div>`;
  }

  function famPvkBanner(h) {
    if (_famRound.game_mode !== 'parents_vs_kids' || !_famRound.game_mode_data) return '';
    const gm = _famRound.game_mode_data;
    const kidsAdj   = gm.kids.map(pk => { const sc = h.scores[pk]; return (sc != null) ? Math.max(1, sc - (gm.kidHandicaps[pk] || 2)) : null; }).filter(s => s != null);
    const adultRaw  = gm.adults.map(pk => h.scores[pk]).filter(s => typeof s === 'number' && s > 0);
    const kidsBest  = kidsAdj.length  ? Math.min(...kidsAdj)  : null;
    const adultBest = adultRaw.length ? Math.min(...adultRaw) : null;
    const kidNames   = gm.kids.map(pk => FAM_PLAYERS[pk]?.name).join(' & ');
    const adultNames = gm.adults.map(pk => FAM_PLAYERS[pk]?.name).join(' & ');
    const kidSub = gm.kids.map(pk => `${FAM_PLAYERS[pk]?.name} –${gm.kidHandicaps[pk]}`).join(', ');

      `<div style="flex:1;background:${color}14;border:1px solid ${color}45;border-radius:11px;padding:9px 12px;">

        <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--text);">${score != null ? score : '—'}</div>
      </div>`;
    return `<div style="margin-bottom:10px;">
      <div style="font-size:0.66rem;color:var(--muted);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px;">Parents vs. Kids, adjusted best ball</div>

  function famCaptainPick(holeNum, captainPk, chosenAdult) {
    const gm = _famRound.game_mode_data; if (!gm) return;

    _saveFamDraft(); renderFamHole();
    showToast(`${FAM_PLAYERS[captainPk]?.name} picks ${FAM_PLAYERS[chosenAdult]?.name}!`);

            <button onclick="famRemoveHolePhoto(${i})" style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:rgba(192,57,43,0.85);border:none;color:#fff;font-size:0.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;">✕</button>

      ${famHoleChallengePanel(h)}
      ${famKidBirdieBombBanner(h)}

          ${h.yds ? `<span style="font-size:0.78rem;color:var(--gold);font-weight:700;">${h.yds} yds</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:0.75rem;color:var(--muted);">Par</span>
          <button onclick="famHolePar(-1)" style="width:26px;height:26px;border-radius:6px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">-</button>
          <span id="fh-par" style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.4rem;color:var(--cream);min-width:20px;text-align:center;">${h.par}</span>
          <button onclick="famHolePar(1)" style="width:26px;height:26px;border-radius:6px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>

      <div class="modal-nav-row" style="margin-top:14px;gap:7px;">
        <button class="btn-ghost" onclick="famHoleBack()" ${_famHoleIdx===0?'disabled style="opacity:0.3;"':''} style="padding:12px 14px;touch-action:manipulation;">←</button>
        <button class="btn-ghost" onclick="famMidRoundScorecard()" style="font-size:0.78rem;padding:12px 14px;">📋</button>

          <span>🎙️ Caddie, H${h.hole} P${h.par}</span>

        </button>
        <div id="fam-caddie-panel" style="display:${_famCaddieOpen ? 'block' : 'none'};background:var(--surface);border:1px solid rgba(212,168,67,0.15);border-top:none;border-radius:0 0 10px 10px;padding:12px 14px;">
          <div id="fam-caddie-msgs" style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;font-size:0.83rem;line-height:1.5;"></div>
          <div style="display:flex;gap:8px;align-items:flex-end;">
            <textarea id="fam-caddie-input" rows="2"
              style="flex:1;background:var(--surface2);border:1px solid rgba(212,168,67,0.25);border-radius:8px;padding:8px 10px;color:var(--cream);font-family:'Archivo',sans-serif;font-size:0.85rem;resize:none;"
              placeholder="Yardage? Lie? Wind?"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendFamCaddieMsg();}"></textarea>
            <button onclick="sendFamCaddieMsg()" id="fam-caddie-send"
              style="background:var(--green);border:none;border-radius:8px;padding:10px 14px;color:var(--cream);font-weight:700;font-size:1rem;cursor:pointer;flex-shrink:0;">➤</button>
          </div>
        </div>
      </div>
    `;
    renderFamCaddieMessages();
  }

  function famHolePuttAdj(pk, delta) {
    const h = _famHoles[_famHoleIdx];
    if (!h.putts) h.putts = {};
    h.putts[pk] = Math.max(0, (h.putts[pk] ?? 1) + delta);
    const el = document.getElementById('fputts-' + pk);
    if (el) el.textContent = h.putts[pk];
  }

  function famHoleFairway(pk, val) {
    const h = _famHoles[_famHoleIdx];
    if (!h.fairway) h.fairway = {};
    h.fairway[pk] = h.fairway[pk] === val ? null : val; // toggle
    renderFamHole();
  }

  function famHoleScore(pk, delta) {
    const h   = _famHoles[_famHoleIdx];
    const cur = h.scores[pk] ?? null;
    // N/A sits to the left of 1: decrement from 1 → null, increment from null → 1
    let next;
    if (cur === null) { next = delta > 0 ? 1 : null; }
    else { next = cur + delta; if (next < 1) next = null; }
    h.scores[pk] = next;
    const isNA    = next === null;
    const diff    = isNA ? 0 : (next - h.par);
    const dLbl    = isNA ? 'N/A' : (diff === 0 ? 'E' : (diff > 0 ? '+'+diff : ''+diff));
    const color   = isNA ? 'var(--muted)' : famScoreColor(diff);
    const scoreEl = document.getElementById('fsc-' + pk);
    const vparEl  = document.getElementById('fvpar-' + pk);
    if (scoreEl) { scoreEl.textContent = isNA ? '—' : next; scoreEl.style.color = color; }
    if (vparEl)  { vparEl.textContent  = isNA ? 'N/A' : (dLbl + ' this hole'); vparEl.style.color = color; }
    updateFamRunningBar();
  }

  function famHolePar(delta) {
    const h = _famHoles[_famHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    renderFamHole();
  }

  function famResizePhoto(dataUrl, maxPx = 1200) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxPx / img.width, maxPx / img.height, 1);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = dataUrl;
    });
  }

  function famLoadHolePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      const resized = await famResizePhoto(e.target.result);
      const h = _famHoles[_famHoleIdx];
      if (!h.photos) h.photos = [];
      h.photos.push(resized);
      renderFamHole();
    };
    reader.readAsDataURL(file);
  }

  function famRemoveHolePhoto(idx) {
    const h = _famHoles[_famHoleIdx];
    if (h.photos) h.photos.splice(idx, 1);
    renderFamHole();
  }

  function _showPhotoOverlay(src) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);';
    overlay.onclick = () => document.body.removeChild(overlay);
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:96vw;max-height:90vh;border-radius:12px;';
    overlay.appendChild(img);
    document.body.appendChild(overlay);
  }

  function famViewPhoto() {
    const h = _famHoles[_famHoleIdx];
    if (h) { const p = h.photos?.[0] || h.photo; if (p) _showPhotoOverlay(p); }
  }

  function famViewScorecardPhoto(holeNum) {
    const h = _famHoles.find(x => x.hole === parseInt(holeNum));
    if (h) { const p = h.photos?.[0] || h.photo; if (p) _showPhotoOverlay(p); }
  }

  function _renderFamCurrentHole() {
    if (_famRound?.is_fun_round) renderFamFunHole(); else renderFamHole();
  }

  function famHoleNext() {
    if (_famHoleIdx === _famHoles.length - 1) { _clearFamDraft(); renderFamSummary(); }
    else { _famHoleIdx++; _saveFamDraft(); _renderFamCurrentHole(); }
  }

  function famHoleBack() {
    if (_famHoleIdx > 0) { _famHoleIdx--; _renderFamCurrentHole(); }
  }

  function confirmExitFamRound() {
    if (confirm('Exit round? Progress is saved, tap Family Round to resume.')) {
      _saveFamDraft();
      closeFamilyModal();
    }
  }

  // ── RECAP CARD BUILDER ───────────────────────────────────────
  // Accept both uploaded HTTP URLs and local base64 captures
  function _hasPhoto(p) { return p && (p.startsWith('http') || p.startsWith('data:')); }

  function _loadImg(src) {
    // Fetch as blob first to avoid canvas cross-origin taint with Supabase Storage URLs
    return new Promise(async resolve => {
      try {
        const resp = await fetch(src);
        const blob = await resp.blob();
        const url  = URL.createObjectURL(blob);
        const img  = new Image();
        img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      } catch(e) { resolve(null); }
    });
  }

  // ── SHARE TEMPLATE PICKER ────────────────────────────────────
  let _shareOrientation = 'portrait'; // 'portrait' | 'landscape'

  function showDadSharePicker(round, holes) {
    // Can be called with a specific round from history, or defaults to current round
    const r = round || _dadRound;
    const hs = holes || _dadHoles || [];
    _famRound = {
      course_name: r.course_name || 'Round',
      date_played: r.date_played || new Date().toISOString().slice(0,10),
      course_par:  r.course_par  || 72,
      players:     ['dad'],
    };
    _famHoles = hs.map(h => ({
      hole:   h.hole,
      par:    h.par,
      yds:    h.yds || null,
      photos: h.photo ? [h.photo] : [],
      photo:  h.photo || null,
      scores: { dad: h.score || h.scores?.dad || 0 },
    }));
    showSharePicker();
  }

  function showSharePicker() {
    // Build photo strip from all hole photos
    const allPhotos = (_famHoles || []).flatMap(h => {
      const ps = h.photos?.length ? h.photos : (h.photo && _hasPhoto(h.photo) ? [h.photo] : []);
      return ps.filter(_hasPhoto).map(p => ({ src: p, hole: h.hole }));
    });
    const photoStrip = allPhotos.length ? `
      <div style="margin-bottom:14px;">
        <div style="font-size:0.58rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;">Round Photos (${allPhotos.length})</div>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;">
          ${allPhotos.map(({src, hole}) => `
            <div style="flex-shrink:0;text-align:center;">

              <div style="font-size:0.55rem;color:var(--muted);margin-top:2px;">H${hole}</div>
            </div>`).join('')}
        </div>
      </div>` : '';

    const overlay = document.createElement('div');
    overlay.id = 'share-picker-overlay';

    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    const sheet = document.createElement('div');
    sheet.style.cssText = 'width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));';
    sheet.innerHTML = `

  // ── CARD HELPERS ─────────────────────────────────────────────
  const _C = {
    bg:'#16120d', surf:'#231c14', gold:'#D4A843', goldDim:'#D4A843', cream:'#f5f0e8', muted:'#8a7a5a',
    dad:'#D4A843', son:'#378ADD', girl:'#D4537E', mom:'#7F77DD', grandma:'#1D9E75',
    dadBg:'rgba(212,168,67,0.13)', sonBg:'rgba(55,138,221,0.13)', girlBg:'rgba(212,83,126,0.13)',
    momBg:'rgba(127,119,221,0.13)', grandmaBg:'rgba(29,158,117,0.13)',
  };

  // Scale factor & frame constants
  const _SF = 0.76;
  const _FRAME_INSET = 16;  // photo frame inset from canvas edge (scaled up from mockup)
  const _FRAME_W     = 6;   // gold border thickness
  const _SAFE        = _FRAME_INSET + _FRAME_W + 20; // min distance from edge for all content

  // Draw inset gold photo frame on top of everything
  function _drawPhotoFrame(ctx, W, H) {
    ctx.strokeStyle = _C.gold;
    ctx.lineWidth   = _FRAME_W;
    ctx.strokeRect(
      _FRAME_INSET + _FRAME_W/2, _FRAME_INSET + _FRAME_W/2,
      W - _FRAME_INSET*2 - _FRAME_W, H - _FRAME_INSET*2 - _FRAME_W
    );
  }

  // Draw logo badge (SPINVIBES / Family Golf), box sized from text, no EST.
  function _drawLogoBadge(ctx, rightEdge, topEdge, sf) {
    const spinF = Math.round(26*sf);
    const famF  = Math.round(18*sf);
    const gap   = Math.round(6*sf);
    const padX  = Math.round(14*sf);
    const padY  = Math.round(10*sf);
    const totalTextH = spinF + gap + famF;
    const boxH  = totalTextH + padY * 2;
    const boxW  = Math.round(160*sf);
    const boxX  = rightEdge - boxW;
    const boxY  = topEdge;
    ctx.fillStyle = 'rgba(16,10,5,0.65)';
    _rr(ctx, boxX, boxY, boxW, boxH, 8); ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = _C.gold;
    ctx.font = `bold ${spinF}px "Archivo ExtraBold","Archivo",Impact,Arial,sans-serif`;
    ctx.fillText('SPINVIBES', boxX + boxW/2, boxY + padY + spinF);
    ctx.fillStyle = _C.cream;
    ctx.font = `italic ${famF}px Georgia,"Times New Roman",serif`;
    ctx.fillText('Family Golf', boxX + boxW/2, boxY + padY + spinF + gap + famF);
  }

  // Draw centered logo (scorecard header), SPINVIBES + Family Golf, no EST.
  function _drawLogoCenter(ctx, cx, y, sf) {
    const spinF = Math.round(36*sf);
    const famF  = Math.round(22*sf);
    const gap   = Math.round(8*sf);
    ctx.textAlign = 'center';
    ctx.fillStyle = _C.gold;
    ctx.font = `bold ${spinF}px "Archivo ExtraBold","Archivo",Impact,Arial,sans-serif`;
    ctx.fillText('SPINVIBES', cx, y + spinF);
    ctx.fillStyle = _C.cream;
    ctx.font = `italic ${famF}px Georgia,"Times New Roman",serif`;
    ctx.fillText('Family Golf', cx, y + spinF + gap + famF);
    return spinF + gap + famF; // return total height
  }

  function _cardDims() {
    return _shareOrientation === 'landscape' ? { W:1280, H:720 } : { W:720, H:1280 };
  }

  function _makeCanvas(w, h) { const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }

  function _gradBar(ctx, w) {
    const g = ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,_C.goldDim); g.addColorStop(0.5,_C.gold); g.addColorStop(1,_C.goldDim); return g;
  }

  function _rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  function _drawImgCover(ctx, img, x, y, w, h) {
    const ar = img.width/img.height;
    let dw=w, dh=h, dx=x, dy=y;
    if (ar > w/h) { dh=h; dw=h*ar; dx=x-(dw-w)/2; }
    else           { dw=w; dh=w/ar; dy=y-(dh-h)/2; }
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function _canvasToBlob(canvas) { return new Promise(r => canvas.toBlob(r, 'image/png')); }

  function _famTotals() {
    const players = _famRound.players||[], totals={};
    players.forEach(pk => { totals[pk]=0; });
    _famHoles.forEach(h => players.forEach(pk => {
      const sc = h.scores[pk] ?? null;
      if (sc !== null) totals[pk] += sc; // N/A holes don't count
    }));
    return totals;
  }

  // Auto-grid collage, works for 1 to 18+ photos
  async function _drawCollageBackground(ctx, W, H, allPhotos) {
    // Cap at 9, pick evenly spread if more
    const MAX = 9;
    let photos = allPhotos;
    if (photos.length > MAX) {
      photos = Array.from({length: MAX}, (_, i) =>
        allPhotos[Math.floor(i * allPhotos.length / MAX)]);
    }
    const count = photos.length;
    const cols  = count === 1 ? 1 : count <= 4 ? 2 : 3;
    const rows  = Math.ceil(count / cols);
    const cw    = W / cols;
    const ch    = H / rows;

    // Load all images in parallel
    const imgs = await Promise.all(photos.map(p => _loadImg(p)));

    imgs.forEach((img, i) => {
      if (!img) return;
      const col = i % cols;
      const row = Math.floor(i / cols);
      // If last row is not full, center remaining cells
      const rowStart = row * cols;
      const inRow    = Math.min(cols, count - rowStart);
      const offsetX  = inRow < cols ? (W - inRow * cw) / 2 : 0;
      ctx.save();
      ctx.beginPath();
      ctx.rect(offsetX + col * cw, row * ch, cw, ch);
      ctx.clip();
      _drawImgCover(ctx, img, offsetX + col * cw, row * ch, cw, ch);
      ctx.restore();
    });
  }

  // ── SHARED CARD HELPERS ─────────────────────────────────────────

  // Load SpinVibes logo once and cache it
  let _svLogoCache = null;
  async function _loadSvLogo() {
    if (_svLogoCache) return _svLogoCache;
    try { _svLogoCache = await _loadImg('/spinvibes_logo.png'); } catch(e) {}
    return _svLogoCache;
  }

  // Draw logo top-right, gold frame, and top gradient vignette
  async function _drawCardChrome(ctx, W, H, sf) {
    // Subtle top vignette so logo reads on any photo
    const topG = ctx.createLinearGradient(0, 0, 0, H * 0.22);
    topG.addColorStop(0, 'rgba(0,0,0,0.45)');
    topG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topG; ctx.fillRect(0, 0, W, H);

    // Logo, top right
    const logo = await _loadSvLogo();
    if (logo) {
      const logoW = Math.round(200 * sf);
      const logoH  = Math.round(logoW * (logo.height / logo.width));
      const pad    = Math.round(22 * sf);
      ctx.drawImage(logo, W - logoW - pad, pad, logoW, logoH);
    }

    // Gold border frame
    ctx.strokeStyle = '#c9a84c';
    ctx.lineWidth   = Math.round(4 * sf);
    const fi = Math.round(10 * sf);
    ctx.strokeRect(fi, fi, W - fi * 2, H - fi * 2);
  }

  // Bottom gradient: starts at 60% (15% less than before)
  function _bottomGrad(ctx, H) {
    const g = ctx.createLinearGradient(0, H * 0.60, 0, H);
    g.addColorStop(0, 'rgba(10,14,8,0)');
    g.addColorStop(0.45, 'rgba(10,14,8,0.72)');
    g.addColorStop(1, 'rgba(10,14,8,0.97)');
    return g;
  }

  // Draw a player chip, name / big score / vs-par label
  function _drawPlayerChip(ctx, pk, score, par, cx, cy, chipW, chipH, sf, isWinner) {
    const p    = FAM_PLAYERS[pk] || {};
    const diff = score - par;
    const dStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : String(diff));
    const achv = diff <= -2 ? 'Eagle' : diff === -1 ? 'Birdie' : diff === 0 ? 'Par' : null;
    const scoreColor = diff <= -2 ? '#a78bfa' : diff === -1 ? '#fbbf24' : diff === 0 ? '#6ec98a' : _C[pk] || _C.gold;

    // Chip background
    ctx.fillStyle = 'rgba(10,14,8,0.62)';
    _rr(ctx, cx, cy, chipW, chipH, Math.round(10 * sf)); ctx.fill();

    // Winner ring
    if (isWinner) {
      ctx.strokeStyle = _C[pk] || _C.gold;
      ctx.lineWidth   = Math.round(2.5 * sf);
      _rr(ctx, cx, cy, chipW, chipH, Math.round(10 * sf)); ctx.stroke();
    }

    ctx.textAlign = 'center';
    const midX = cx + chipW / 2;

    // Name
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `500 ${Math.round(15 * sf)}px Archivo,Arial,sans-serif`;
    ctx.fillText(p.name || pk, midX, cy + chipH * 0.28);

    // Score
    ctx.fillStyle = scoreColor;
    ctx.font = `500 ${Math.round(52 * sf)}px "Archivo ExtraBold","Archivo",Impact,Arial,sans-serif`;
    ctx.fillText(String(score), midX, cy + chipH * 0.70);

    // Achievement or vs-par
    const label = achv || dStr;
    ctx.fillStyle = achv ? '#fbbf24' : 'rgba(255,255,255,0.4)';
    ctx.font = `400 ${Math.round(13 * sf)}px Archivo,Arial,sans-serif`;
    ctx.fillText(label, midX, cy + chipH * 0.90);
  }

  // Bottom text: course + date + optional winner line
  function _drawBottomText(ctx, W, H, sf, courseName, date, winLine) {
    const pad = Math.round(20 * sf);
    ctx.textAlign = 'center';
    if (winLine) {
      ctx.fillStyle = _C.gold;
      ctx.font = `500 ${Math.round(16 * sf)}px Archivo,Arial,sans-serif`;
      ctx.fillText(winLine, W / 2, H - pad - Math.round(36 * sf));
    }
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = `400 ${Math.round(13 * sf)}px Archivo,Arial,sans-serif`;
    ctx.fillText(`${(courseName || '').toUpperCase()}  ·  ${date || ''}`, W / 2, H - pad);
  }

  // ── TEMPLATE 1: ROUND SUMMARY ─────────────────────────────────
  async function _buildScorecardCard() {
    const W = 720, H = 1280; // always portrait for scorecard
    const players  = _famRound.players || [];
    const totals   = _famTotals();
    const totalPar = _famHoles.reduce((a, h) => a + h.par, 0);
    const minScore = Math.min(...players.map(pk => totals[pk]));
    const winners  = players.filter(pk => totals[pk] === minScore);
    const front    = _famHoles.slice(0, 9);
    const back     = _famHoles.slice(9, 18);
    const frontPar = front.reduce((a,h) => a+h.par, 0);
    const backPar  = back.reduce((a,h)  => a+h.par, 0);
    const sf       = 0.76;

    const canvas = _makeCanvas(W, H);
    const ctx    = canvas.getContext('2d');

    // ── PHOTO BACKGROUND (top ~38%) ──
    const photos = _famHoles.flatMap(h => h.photos?.length ? h.photos : (h.photo ? [h.photo] : [])).filter(p => _hasPhoto(p));
    ctx.fillStyle = '#0d1a0a'; ctx.fillRect(0, 0, W, H);
    const photoH = Math.round(H * 0.38);
    if (photos.length) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, photoH); ctx.clip();
      await _drawCollageBackground(ctx, W, photoH, photos);
      ctx.restore();
    }

    // Gradient over photo into dark
    const fadeG = ctx.createLinearGradient(0, photoH * 0.45, 0, photoH + 40);
    fadeG.addColorStop(0, 'rgba(13,26,10,0)');
    fadeG.addColorStop(1, 'rgba(13,26,10,1)');
    ctx.fillStyle = fadeG; ctx.fillRect(0, 0, W, photoH + 40);

    // ── COURSE HEADER ──
    const pad = 28;
    let y = photoH - 10;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f5f0e8';
    ctx.font = `800 ${Math.round(42*sf)}px "Archivo",Impact,Arial`;
    ctx.fillText((_famRound.course_name||'').toUpperCase(), W/2, y);
    y += Math.round(28*sf);
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = `400 ${Math.round(17*sf)}px Archivo,Arial`;
    ctx.fillText(`${_famRound.date_played||''}  ·  Par ${totalPar}`, W/2, y);
    y += Math.round(22*sf);

    // ── SCORE GRID ──
    // Helper: draw score cell with golf notation (circle=birdie, square=bogey)
    function _scoreCell(cx, cy, cw, ch, score, par, color) {
      const diff = score - par;
      ctx.fillStyle = color;
      ctx.font = `500 ${Math.round(13.5*sf)}px Archivo,Arial`;
      ctx.textAlign = 'center';
      const tx = cx + cw/2, ty = cy + ch*0.66;

      if (diff <= -2) { // Eagle: double circle
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(9.5*sf), 0, Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(6.5*sf), 0, Math.PI*2); ctx.stroke();
      } else if (diff === -1) { // Birdie: circle
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(9*sf), 0, Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
      } else if (diff === 1) { // Bogey: square
        const s=Math.round(10*sf); ctx.strokeStyle=color; ctx.lineWidth=1.5;
        ctx.strokeRect(tx-s, cy+ch/2-s, s*2, s*2);
      } else if (diff >= 2) { // Double+: double square
        const s=Math.round(10*sf), s2=Math.round(13*sf); ctx.strokeStyle=color; ctx.lineWidth=1.2;
        ctx.strokeRect(tx-s, cy+ch/2-s, s*2, s*2);
        ctx.strokeRect(tx-s2, cy+ch/2-s2, s2*2, s2*2);
      }
      ctx.fillStyle = color;
      ctx.fillText(String(score), tx, ty);
    }

    function drawGrid(holes, startY, sectionPar) {
      const numCols = holes.length + 2; // holes + OUT/IN + TOT
      const nameW   = Math.round(54*sf);
      const totW    = Math.round(38*sf);
      const subW    = Math.round(36*sf);
      const holeW   = (W - pad*2 - nameW - subW - totW) / holes.length;
      const rowH    = Math.round(26*sf);

      // Header row (hole numbers)
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(pad, startY, W-pad*2, rowH);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `400 ${Math.round(11*sf)}px Archivo,Arial`;
      ctx.textAlign = 'center';
      holes.forEach((h,i) => ctx.fillText(String(h.hole), pad+nameW+i*holeW+holeW/2, startY+rowH*0.70));
      ctx.fillText(holes.length===9?'OUT':'', pad+nameW+holes.length*holeW+subW/2, startY+rowH*0.70);

      // Par row
      const parY = startY + rowH;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(pad, parY, W-pad*2, rowH);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = `400 ${Math.round(11*sf)}px Archivo,Arial`;
      ctx.textAlign = 'left';
      ctx.fillText('PAR', pad+6, parY+rowH*0.70);
      holes.forEach((h,i) => {
        ctx.textAlign='center';
        ctx.fillText(String(h.par), pad+nameW+i*holeW+holeW/2, parY+rowH*0.70);
      });
      ctx.fillText(String(sectionPar), pad+nameW+holes.length*holeW+subW/2, parY+rowH*0.70);

      // Player rows
      players.forEach((pk, pi) => {
        const p    = FAM_PLAYERS[pk];
        const rowY = parY + rowH*(pi+1);
        if (pi%2===0) { ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(pad,rowY,W-pad*2,rowH); }

        // Name
        ctx.fillStyle = _C[pk]||_C.gold;
        ctx.font = `500 ${Math.round(11.5*sf)}px Archivo,Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(p.name, pad+5, rowY+rowH*0.70);

        // Hole scores
        holes.forEach((h,i) => {
          const sc   = h.scores[pk]||0;
          const diff = sc - h.par;
          const col  = diff<=-1?'#60a5fa': diff===0?'rgba(255,255,255,0.75)': diff===1?'#f87171':'#ef4444';
          _scoreCell(pad+nameW+i*holeW, rowY, holeW, rowH, sc, h.par, col);
        });

        // Section subtotal
        const sub = holes.reduce((a,h)=>a+(h.scores[pk]||0),0);
        const subDiff = sub - sectionPar;
        const subColor = subDiff<0?'#60a5fa':subDiff===0?'rgba(255,255,255,0.6)':'#f87171';
        ctx.fillStyle = subColor;
        ctx.font = `500 ${Math.round(12.5*sf)}px Archivo,Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(String(sub), pad+nameW+holes.length*holeW+subW/2, rowY+rowH*0.70);
      });

      return parY + rowH*(players.length+1);
    }

    // Divider line
    ctx.strokeStyle = 'rgba(201,168,76,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
    y += 8;

    // Front 9
    const afterFront = drawGrid(front, y, frontPar);
    y = afterFront + Math.round(6*sf);

    // Back 9
    const afterBack = back.length ? drawGrid(back, y, backPar) : y;
    y = afterBack + Math.round(10*sf);

    // Divider
    ctx.strokeStyle = 'rgba(201,168,76,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
    y += Math.round(14*sf);

    // ── TOTAL ROW, player chips ──
    const chipW = Math.round(Math.min(155*sf, (W-pad*2-(players.length-1)*8)/players.length));
    const chipH = Math.round(82*sf);
    const chipX0 = (W-(players.length*chipW+(players.length-1)*8))/2;
    players.forEach((pk, i) => {
      _drawPlayerChip(ctx, pk, totals[pk], totalPar, chipX0+i*(chipW+8), y, chipW, chipH, sf, winners.includes(pk));
    });
    y += chipH + Math.round(10*sf);

    // Winner line
    const winLine = winners.length===players.length?'All tied!':
      winners.map(pk=>FAM_PLAYERS[pk]?.name||pk).join(' & ')+(winners.length===1?' wins!':' tie!');
    ctx.fillStyle = _C.gold;
    ctx.font = `500 ${Math.round(15*sf)}px Archivo,Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(winLine, W/2, y + Math.round(14*sf));

    await _drawCardChrome(ctx, W, H, sf);
    return _canvasToBlob(canvas);
  }

  // ── TEMPLATE 1b: TEAM SCRAMBLE RECAP, team names front and center, best-ball totals ──
  async function _buildTeamScrambleCard() {
    if (_famRound.game_mode !== 'team_scramble' || !_famRound.game_mode_data) return null;
    const W = 720, H = 1280;
    const gm = _famRound.game_mode_data;
    const totalPar = _famHoles.reduce((a, h) => a + h.par, 0);
    const sf = 0.76;
    const teamColor = { a: '#378ADD', b: '#D4537E' };

    const teamTotal = (teamKey) => {
      const members = gm.teams[teamKey] || [];
      return _famHoles.reduce((sum, h) => {
        const scores = members.map(pk => h.scores[pk]).filter(s => typeof s === 'number' && s > 0);
        return sum + (scores.length ? Math.min(...scores) : 0);
      }, 0);
    };
    const totalA = teamTotal('a');
    const totalB = teamTotal('b');
    const winnerKey = totalA === totalB ? null : (totalA < totalB ? 'a' : 'b');

    const canvas = _makeCanvas(W, H);
    const ctx    = canvas.getContext('2d');

    // ── PHOTO BACKGROUND (top ~38%) ──
    const photos = _famHoles.flatMap(h => h.photos?.length ? h.photos : (h.photo ? [h.photo] : [])).filter(p => _hasPhoto(p));
    ctx.fillStyle = '#0d1a0a'; ctx.fillRect(0, 0, W, H);
    const photoH = Math.round(H * 0.34);
    if (photos.length) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, photoH); ctx.clip();
      await _drawCollageBackground(ctx, W, photoH, photos);
      ctx.restore();
    }
    const fadeG = ctx.createLinearGradient(0, photoH * 0.45, 0, photoH + 40);
    fadeG.addColorStop(0, 'rgba(13,26,10,0)');
    fadeG.addColorStop(1, 'rgba(13,26,10,1)');
    ctx.fillStyle = fadeG; ctx.fillRect(0, 0, W, photoH + 40);

    // ── HEADER: course + "Team Scramble" badge ──
    const pad = 28;
    let y = photoH - 6;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(29,158,117,0.9)';
    ctx.font = `500 ${Math.round(15*sf)}px Archivo,Arial`;
    ctx.fillText('TEAM SCRAMBLE · BEST BALL', W/2, y - Math.round(34*sf));
    ctx.fillStyle = '#f5f0e8';
    ctx.font = `800 ${Math.round(42*sf)}px "Archivo",Impact,Arial`;
    ctx.fillText((_famRound.course_name||'').toUpperCase(), W/2, y);
    y += Math.round(28*sf);
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = `400 ${Math.round(17*sf)}px Archivo,Arial`;
    ctx.fillText(`${_famRound.date_played||''}  ·  Par ${totalPar}`, W/2, y);
    y += Math.round(50*sf);

    // ── TEAM CARDS, name, members, big total ──
    const cardW = Math.round((W - pad*2 - 18) / 2);
    const cardH = Math.round(220*sf);
    ['a','b'].forEach((teamKey, i) => {
      const cx = pad + i*(cardW+18);
      const color = teamColor[teamKey];
      const total = teamKey === 'a' ? totalA : totalB;
      const diff  = total - totalPar;
      const dStr  = diff === 0 ? 'E' : (diff > 0 ? '+'+diff : String(diff));
      const isWinner = winnerKey === teamKey;
      const members = (gm.teams[teamKey]||[]).map(pk => FAM_PLAYERS[pk]?.name || pk).join(' & ');

      ctx.fillStyle = `${color}20`;
      _rr(ctx, cx, y, cardW, cardH, Math.round(14*sf)); ctx.fill();
      if (isWinner) {
        ctx.strokeStyle = color; ctx.lineWidth = Math.round(2.5*sf);
        _rr(ctx, cx, y, cardW, cardH, Math.round(14*sf)); ctx.stroke();
      }
      ctx.textAlign = 'center';
      const midX = cx + cardW/2;
      ctx.fillStyle = color;
      ctx.font = `800 ${Math.round(20*sf)}px "Archivo",Impact,Arial`;
      ctx.fillText((gm.teamNames[teamKey]||'').toUpperCase(), midX, y + cardH*0.26);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = `400 ${Math.round(12.5*sf)}px Archivo,Arial`;
      ctx.fillText(members, midX, y + cardH*0.40);
      ctx.fillStyle = '#f5f0e8';
      ctx.font = `800 ${Math.round(54*sf)}px "Archivo",Impact,Arial`;
      ctx.fillText(String(total), midX, y + cardH*0.74);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = `400 ${Math.round(13*sf)}px Archivo,Arial`;
      ctx.fillText(dStr, midX, y + cardH*0.90);
      if (isWinner) {
        ctx.fillStyle = _C.gold;
        ctx.font = `500 ${Math.round(11*sf)}px Archivo,Arial`;
        ctx.fillText('🏆 WINNER', midX, y - Math.round(8*sf));
      }
    });
    y += cardH + Math.round(34*sf);

    // ── Result line ──
    const resultLine = winnerKey
      ? `${gm.teamNames[winnerKey]} wins by ${Math.abs(totalA-totalB)}!`
      : `${gm.teamNames.a} & ${gm.teamNames.b} tied!`;
    ctx.fillStyle = _C.gold;
    ctx.font = `500 ${Math.round(17*sf)}px Archivo,Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(resultLine, W/2, y);

    await _drawCardChrome(ctx, W, H, sf);
    return _canvasToBlob(canvas);
  }

  // ── TEMPLATE: FAMILY OUTING (fun rounds) ─────────────────────
  async function _buildFamilyOutingCard() {
    const W = 720, H = 1280;
    const canvas = _makeCanvas(W, H);
    const ctx    = canvas.getContext('2d');

    // Dark gradient background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0D1B0F');
    bg.addColorStop(1, '#0A0F0A');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // Subtle diagonal texture lines
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.025)'; ctx.lineWidth = 1;
    for (let i = -H; i < W + H; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke();
    }
    ctx.restore();

    // Top accent bar
    const topBar = ctx.createLinearGradient(0, 0, W, 0);
    topBar.addColorStop(0, 'rgba(212,168,67,0.0)');
    topBar.addColorStop(0.5, 'rgba(212,168,67,0.6)');
    topBar.addColorStop(1, 'rgba(212,168,67,0.0)');
    ctx.fillStyle = topBar; ctx.fillRect(0, 0, W, 3);

    // ── Photo collage ────────────────────────────────────────────
    const allPhotos = _famHoles.flatMap(h =>
      (h.photos?.length ? h.photos : (h.photo ? [h.photo] : [])).filter(_hasPhoto)
    );
    const photoCount = Math.min(allPhotos.length, 6);
    const collageTop  = 80;
    const collageH    = 480;
    if (photoCount > 0) {
      // Draw up to 6 photos in a grid: rows of 3 or 2+1
      const cols = photoCount <= 2 ? photoCount : 3;
      const rows = Math.ceil(photoCount / cols);
      const gutter = 6;
      const cellW = Math.floor((W - gutter * (cols + 1)) / cols);
      const cellH = Math.floor((collageH - gutter * (rows + 1)) / rows);
      const imgs = await Promise.all(allPhotos.slice(0, photoCount).map(src => new Promise(res => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => res(img); img.onerror = () => res(null);
        img.src = src;
      })));
      imgs.forEach((img, idx) => {
        if (!img) return;
        const col = idx % cols, row = Math.floor(idx / cols);
        const x = gutter + col * (cellW + gutter);
        const y = collageTop + gutter + row * (cellH + gutter);
        ctx.save();
        ctx.beginPath();
        const r = 12;
        ctx.moveTo(x + r, y); ctx.lineTo(x + cellW - r, y);
        ctx.quadraticCurveTo(x + cellW, y, x + cellW, y + r);
        ctx.lineTo(x + cellW, y + cellH - r);
        ctx.quadraticCurveTo(x + cellW, y + cellH, x + cellW - r, y + cellH);
        ctx.lineTo(x + r, y + cellH);
        ctx.quadraticCurveTo(x, y + cellH, x, y + cellH - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath(); ctx.clip();
        // Draw image cover-fit
        const scale = Math.max(cellW / img.width, cellH / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, x + (cellW - dw) / 2, y + (cellH - dh) / 2, dw, dh);
        ctx.restore();
      });
    } else {
      // Placeholder grass texture
      ctx.fillStyle = 'rgba(29,64,29,0.3)';
      _roundRect(ctx, 6, collageTop, W - 12, collageH, 12);
      ctx.fill();
      ctx.fillStyle = 'rgba(212,168,67,0.25)';
      ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⛳', W / 2, collageTop + collageH / 2 + 16);
    }

    // Semi-transparent overlay on bottom of collage for legibility
    const fadeY = collageTop + collageH - 120;
    const fade = ctx.createLinearGradient(0, fadeY, 0, collageTop + collageH);
    fade.addColorStop(0, 'rgba(13,27,15,0)');
    fade.addColorStop(1, 'rgba(13,27,15,0.85)');
    ctx.fillStyle = fade; ctx.fillRect(0, fadeY, W, 120);

    // ── Content area ─────────────────────────────────────────────
    let y = collageTop + collageH + 30;

    // "FAMILY OUTING" eyebrow
    ctx.font = '700 22px "Archivo", sans-serif';
    ctx.fillStyle = 'rgba(212,168,67,0.75)';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '3px';
    ctx.fillText('FAMILY OUTING', W / 2, y);
    y += 52;

    // Course name
    const courseName = (_famRound.course_name || 'Golf Course').toUpperCase();
    ctx.fillStyle = '#EDE3C8';
    ctx.textAlign = 'center';
    // Responsive font size
    let courseFontSize = 72;
    ctx.font = `900 ${courseFontSize}px "Archivo", sans-serif`;
    while (ctx.measureText(courseName).width > W - 60 && courseFontSize > 36) {
      courseFontSize -= 4;
      ctx.font = `900 ${courseFontSize}px "Archivo", sans-serif`;
    }
    ctx.fillText(courseName, W / 2, y);
    y += courseFontSize * 0.3 + 18;

    // Date
    ctx.font = '400 28px "Archivo", sans-serif';
    ctx.fillStyle = 'rgba(237,227,200,0.5)';
    ctx.fillText(_famRound.date_played || '', W / 2, y);
    y += 52;

    // Divider
    const divGrad = ctx.createLinearGradient(W * 0.2, 0, W * 0.8, 0);
    divGrad.addColorStop(0, 'rgba(212,168,67,0)');
    divGrad.addColorStop(0.5, 'rgba(212,168,67,0.4)');
    divGrad.addColorStop(1, 'rgba(212,168,67,0)');
    ctx.strokeStyle = divGrad; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W * 0.2, y); ctx.lineTo(W * 0.8, y); ctx.stroke();
    y += 30;

    // Player name chips
    const players = _famRound.players || [];
    const chipH = 44, chipR = 22, chipGap = 10;
    const chipLabels = players.map(pk => {
      const p = FAM_PLAYERS[pk];
      return p ? `${p.emoji} ${p.name}` : pk;
    });
    // Measure total width and wrap if needed
    ctx.font = '700 22px "Archivo", sans-serif';
    const chipWidths = chipLabels.map(lbl => ctx.measureText(lbl).width + 36);
    const totalW = chipWidths.reduce((a, b) => a + b, 0) + chipGap * (chipLabels.length - 1);
    const startX = totalW <= W - 40 ? (W - totalW) / 2 : 20;
    let cx = startX;
    players.forEach((pk, i) => {
      const p    = FAM_PLAYERS[pk];
      const bg   = p ? p.bg   : 'rgba(212,168,67,0.15)';
      const col  = p ? p.color : '#EDE3C8';
      const lbl  = chipLabels[i];
      const cw   = chipWidths[i];
      // Wrap to next row if overflow
      if (cx + cw > W - 20 && i > 0) { cx = 20; y += chipH + 10; }
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect?.(cx, y, cw, chipH, chipR) ||
        _roundRect(ctx, cx, y, cw, chipH, chipR);
      ctx.fill();
      ctx.font = '700 22px "Archivo", sans-serif';
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.fillText(lbl, cx + 18, y + chipH * 0.67);
      cx += cw + chipGap;
    });
    y += chipH + 36;

    // SpinVibes branding
    ctx.textAlign = 'center';
    ctx.font = '700 28px "Archivo", sans-serif';
    ctx.fillStyle = 'rgba(212,168,67,0.6)';
    ctx.fillText('SPINVIBES', W / 2, H - 56);
    ctx.font = '400 18px "Archivo", sans-serif';
    ctx.fillStyle = 'rgba(212,168,67,0.35)';
    ctx.fillText('spinvibes.com', W / 2, H - 30);

    return _canvasToBlob(canvas);
  }

  // ── TEMPLATE 2: HOLE HIGHLIGHT ────────────────────────────────
  async function _buildHoleHighlightCard(h) {

  }

  // ── TEMPLATE 3: BEST MOMENT ───────────────────────────────────
  function _showBestMomentPickerSheet() {
    const players = _famRound.players || [];
    const overlay = document.createElement('div');
    overlay.id = 'best-picker-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    const sheet = document.createElement('div');
    sheet.style.cssText = 'width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));';
    const items = players.map(pk => {
      const p = FAM_PLAYERS[pk]; if (!p) return '';
      let bestH = null, bestScore = Infinity;
      _famHoles.forEach(h => {
        const diff = (h.scores[pk] || 0) - h.par;
        const bonus = (h.photos?.length || h.photo) ? -0.5 : 0;
        if (diff + bonus < bestScore) { bestScore = diff + bonus; bestH = h; }
      });
      const diff = bestH ? (bestH.scores[pk] || 0) - bestH.par : 0;
      const ach  = diff <= -2 ? 'Eagle' : diff === -1 ? 'Birdie' : diff === 0 ? 'Par' : 'Best Hole';

  async function pickPlayerAndShareBest(playerKey) {
    const overlay = document.getElementById('best-picker-overlay');
    if (overlay) overlay.remove();

    // Find best hole for this player
    let bestH = null, bestScore = Infinity;
    _famHoles.forEach(h => {
      const diff  = (h.scores[playerKey] || 0) - h.par;
      const bonus = (h.photos?.length || h.photo) ? -0.5 : 0;
      if (diff + bonus < bestScore) { bestScore = diff + bonus; bestH = h; }
    });
    if (!bestH) return;

    const allPhotos = bestH.photos?.length ? bestH.photos : (bestH.photo ? [bestH.photo] : []);

    // If multiple photos on the best hole, ask which one to use
    if (allPhotos.filter(_hasPhoto).length > 1) {
      _showBestPhotoPickerSheet(playerKey, bestH, allPhotos.filter(_hasPhoto));
      return;
    }

    // Single or no photo, build directly
    const btn = document.getElementById('fam-share-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Building...'; }
    try {
      const blob = await _buildBestMomentCard(playerKey);
      if (blob) await _doShare(blob);
    } catch(e) { console.warn('Best moment share error:', e); }
    finally { if (btn) { btn.disabled = false; btn.textContent = '📤 Share'; } }
  }
