  function famRefreshTeePills() {
    const tees = (_famCourseData?.allTees || []);
    ['dad','son','girl','mom','grandma'].forEach(pk => {
      const selectorEl = document.getElementById('fam-tee-selector-' + pk);
      const pillsEl    = document.getElementById('fam-tee-pills-' + pk);
      if (!selectorEl || !pillsEl) return;
      const isActive = document.querySelector('.fam-checkbox-card[data-player="' + pk + '"].selected');
      if (!isActive) return;
      if (!tees.length) {
        pillsEl.innerHTML = '<div class="pill" style="font-size:0.72rem;padding:4px 10px;opacity:0.5;">No tee data</div>';
        return;
      }
      // Default: dad gets longest tee (tournament), others get shortest (resort/forward)
      const defaultTee = pk === 'dad' ? tees[tees.length - 1].name : tees[0].name;
      if (!_famPlayerTees[pk]) _famPlayerTees[pk] = defaultTee;
      pillsEl.innerHTML = tees.map(t =>
        '<div class="pill' + (_famPlayerTees[pk]===t.name?' active':'') + '" onclick="famSetPlayerTee(\'' + pk + '\',\'' + t.name.replace(/'/g,"\\'") + '\')"'
        + ' data-val="' + t.name + '" style="font-size:0.72rem;padding:4px 10px;touch-action:manipulation;">'
        + t.name + (t.yards ? ' <span style=\'font-size:0.62rem;opacity:0.7;\'>' + t.yards + 'y</span>' : '') + '</div>'
      ).join('');
    });
  }

    pillsEl.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.val === teeName));

  function viewFamRound(r) {
    // Reconstruct _famRound and _famHoles from saved data
    _famRound = { date_played: r.date_played, course_name: r.course_name, course_par: r.course_par, players: r.players || [] };
    _famHoles = (r.holes || []).map(h => ({
      ...h,
      scores: h.scores || {},
      photos: h.photos || (h.photo || h.photo_url ? [h.photo || h.photo_url] : []),
      photo:  h.photos?.[0] || h.photo || h.photo_url || null,
    }));
    // Open modal if not already visible
    const modal = document.getElementById('family-modal');
    if (modal && modal.style.display !== 'flex') {
      _lockBodyScroll();
      modal.style.display = 'flex';
    }
    const footer = document.getElementById('fam-modal-footer');
    if (footer) footer.style.display = 'none';
    const closeBtn = document.getElementById('fam-modal-close-btn');
    if (closeBtn) closeBtn.style.display = '';
    const holeSub = document.getElementById('fam-modal-hole-sub');
    if (holeSub) holeSub.style.display = 'none';
    const label = document.getElementById('fam-modal-label');
    if (label) label.textContent = r.course_name || 'Round';
    renderFamSummary();
    // Override buttons — read-only share view
    setTimeout(() => {
      const saveBtn = document.querySelector('#fam-modal-body .btn-primary');
      if (saveBtn) saveBtn.style.display = 'none';
      // Change Done to Back
      const btns = document.querySelectorAll('#fam-modal-body .btn-ghost');
      btns.forEach(b => { if (b.id !== 'fam-share-btn') { b.textContent = '\u2190 Back'; b.setAttribute('onclick','closeFamilyModal()'); } });
    }, 50);
  }

  function startFamRound() {
    const players = Array.from(document.querySelectorAll('#fam-modal-body .fam-checkbox-card.selected'))
                         .map(c => c.dataset.player);
    if (!players.length) { showToast('Pick at least one player', 'error'); return; }

    const famIsPractice = document.querySelector('#fm-type-pills .pill.active')?.dataset.val === 'practice';
    const dateVal = document.getElementById('fm-date').value;

    let courseName, coursePar, numHoles, holePars, playerYardages;

    if (_famCourseData) {
      // API-sourced course — use tee data per player
      const dadTee = _famCourseData.allTees?.find(t => t.name === _famPlayerTees['dad']) || _famCourseData.allTees?.[_famCourseData.allTees.length - 1] || {};
      courseName = _famCourseData.name + (_famCourseData.course ? ' — ' + _famCourseData.course : '');
      numHoles   = (dadTee.holePars || _famCourseData.holePars || []).length || 18;
      holePars   = dadTee.holePars || _famCourseData.holePars || Array(numHoles).fill(4);
      coursePar  = holePars.reduce((a,b) => a+b, 0);
      // Build per-player yardage lookup: { dad: [412, 380, ...], son: [340, 310, ...] }
      playerYardages = {};
      players.forEach(pk => {
        const tee = _famCourseData.allTees?.find(t => t.name === _famPlayerTees[pk]);
        playerYardages[pk] = tee?.yardages || null;
      });
    } else {
      // No API course — require manual fallback not yet implemented; prompt to search
      showToast('Please search and select a course first', 'error');
      return;
    }

    _famRound = {
      date_played: dateVal,
      course_name: courseName,
      course_par:  coursePar,
      players,
      is_practice: famIsPractice,
      player_tees: Object.fromEntries(players.map(pk => [pk, _famPlayerTees[pk] || null])),
      course_id:   _famCourseId,
    };
    _famHoleIdx       = 0;
    _famCaddieHistory = [];
    _famCaddieOpen    = false;

    _famHoles = Array.from({length: numHoles}, (_, i) => {
      const par    = holePars[i] || 4;
      const scores = {};
      players.forEach(p => { scores[p] = par; });
      // Per-player yardage for this hole
      const playerYds = {};
      players.forEach(pk => { playerYds[pk] = playerYardages[pk]?.[i] || null; });
      return { hole: i+1, par, scores, photos: [], yds: playerYardages['dad']?.[i] || null, playerYds, putts: {}, fairway: {} };
    });

    document.getElementById('fam-running-bar').style.display = 'flex';
    renderFamHole();
  }

    function famScoreColor(diff) {
    if (diff <= -2) return '#a78bfa';
    if (diff === -1) return '#60a5fa';
    if (diff === 0)  return 'var(--green)';
    if (diff === 1)  return 'var(--cream)';
    if (diff === 2)  return 'var(--red)';
    return '#ff4444';
  }

  function famScoreClass(diff) {
    if (diff <= -2) return 'fam-eagle';
    if (diff === -1) return 'fam-birdie';
    if (diff === 0)  return 'fam-par';
    if (diff === 1)  return 'fam-bogey';
    if (diff === 2)  return 'fam-double';
    return 'fam-triple';
  }

  function famHolePuttAdj(pk, delta) {
    const h = _famHoles[_famHoleIdx];
    if (!h.putts) h.putts = {};
    h.putts[pk] = Math.max(0, (h.putts[pk] ?? 1) + delta);
    const el = document.getElementById('fputts-' + pk);
    if (el) el.textContent = h.putts[pk];
  }

  function famHoleFairway(pk, val) {
    const h = _famHoles[_famHoleIdx];
    if (!h.fairway) h.fairway = {};
    h.fairway[pk] = h.fairway[pk] === val ? null : val; // toggle
    renderFamHole();
  }

  function famHoleScore(pk, delta) {
    const h = _famHoles[_famHoleIdx];
    h.scores[pk] = Math.max(1, (h.scores[pk] || h.par) + delta);
    const sc   = h.scores[pk];
    const diff = sc - h.par;
    const dLbl = diff === 0 ? 'E' : (diff > 0 ? '+'+diff : ''+diff);
    const scoreEl = document.getElementById('fsc-' + pk);
    const vparEl  = document.getElementById('fvpar-' + pk);
    if (scoreEl) { scoreEl.textContent = sc; scoreEl.style.color = famScoreColor(diff); }
    if (vparEl)  { vparEl.textContent = dLbl + ' this hole'; vparEl.style.color = famScoreColor(diff); }
    updateFamRunningBar();
  }

  function famHolePar(delta) {
    const h = _famHoles[_famHoleIdx];
    h.par = Math.max(3, Math.min(5, h.par + delta));
    renderFamHole();
  }

  function famResizePhoto(dataUrl, maxPx = 1200) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxPx / img.width, maxPx / img.height, 1);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = dataUrl;
    });
  }

  function famLoadHolePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      const resized = await famResizePhoto(e.target.result);
      const h = _famHoles[_famHoleIdx];
      if (!h.photos) h.photos = [];
      h.photos.push(resized);
      renderFamHole();
    };
    reader.readAsDataURL(file);
  }

  function famRemoveHolePhoto(idx) {
    const h = _famHoles[_famHoleIdx];
    if (h.photos) h.photos.splice(idx, 1);
    renderFamHole();
  }

  function _showPhotoOverlay(src) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);';
    overlay.onclick = () => document.body.removeChild(overlay);
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:96vw;max-height:90vh;border-radius:12px;';
    overlay.appendChild(img);
    document.body.appendChild(overlay);
  }

  // ── RECAP CARD BUILDER ───────────────────────────────────────
  // Accept both uploaded HTTP URLs and local base64 captures
  function _hasPhoto(p) { return p && (p.startsWith('http') || p.startsWith('data:')); }

  function _loadImg(src) {
    // Fetch as blob first to avoid canvas cross-origin taint with Supabase Storage URLs
    return new Promise(async resolve => {
      try {
        const resp = await fetch(src);
        const blob = await resp.blob();
        const url  = URL.createObjectURL(blob);
        const img  = new Image();
        img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      } catch(e) { resolve(null); }
    });
  }

  // ── SHARE TEMPLATE PICKER ────────────────────────────────────
  let _shareOrientation = 'portrait'; // 'portrait' | 'landscape'

  function showDadSharePicker(round, holes) {
    // Can be called with a specific round from history, or defaults to current round
    const r = round || _dadRound;
    const hs = holes || _dadHoles || [];
    _famRound = {
      course_name: r.course_name || 'Round',
      date_played: r.date_played || new Date().toISOString().slice(0,10),
      course_par:  r.course_par  || 72,
      players:     ['dad'],
    };
    _famHoles = hs.map(h => ({
      hole:   h.hole,
      par:    h.par,
      yds:    h.yds || null,
      photos: h.photo ? [h.photo] : [],
      photo:  h.photo || null,
      scores: { dad: h.score || h.scores?.dad || 0 },
    }));

  // ── CARD HELPERS ─────────────────────────────────────────────
  const _C = {
    bg:'#16120d', surf:'#231c14', gold:'#d4af70', goldDim:'#8a6010', cream:'#f5f0e8', muted:'#8a7a5a',
    dad:'#d4a520', son:'#60a5fa', girl:'#f472b6', mom:'#f2c879', grandma:'#d4af70',
    dadBg:'rgba(212,165,32,0.13)', sonBg:'rgba(96,165,250,0.13)', girlBg:'rgba(244,114,182,0.13)',
    momBg:'rgba(242,200,121,0.13)', grandmaBg:'rgba(212,175,112,0.13)',
  };

  // Scale factor & frame constants
  const _SF = 0.76;
  const _FRAME_INSET = 16;  // photo frame inset from canvas edge (scaled up from mockup)
  const _FRAME_W     = 6;   // gold border thickness
  const _SAFE        = _FRAME_INSET + _FRAME_W + 20; // min distance from edge for all content

  // Draw inset gold photo frame on top of everything
  function _drawPhotoFrame(ctx, W, H) {
    ctx.strokeStyle = _C.gold;
    ctx.lineWidth   = _FRAME_W;
    ctx.strokeRect(
      _FRAME_INSET + _FRAME_W/2, _FRAME_INSET + _FRAME_W/2,
      W - _FRAME_INSET*2 - _FRAME_W, H - _FRAME_INSET*2 - _FRAME_W
    );
  }

  // Draw logo badge (SPINVIBES / Family Golf) — box sized from text, no EST.
  function _drawLogoBadge(ctx, rightEdge, topEdge, sf) {
    const spinF = Math.round(26*sf);
    const famF  = Math.round(18*sf);
    const gap   = Math.round(6*sf);
    const padX  = Math.round(14*sf);
    const padY  = Math.round(10*sf);
    const totalTextH = spinF + gap + famF;
    const boxH  = totalTextH + padY * 2;
    const boxW  = Math.round(160*sf);
    const boxX  = rightEdge - boxW;
    const boxY  = topEdge;
    ctx.fillStyle = 'rgba(16,10,5,0.65)';
    _rr(ctx, boxX, boxY, boxW, boxH, 8); ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = _C.gold;
    ctx.font = `bold ${spinF}px "Bebas Neue",Impact,Arial,sans-serif`;
    ctx.fillText('SPINVIBES', boxX + boxW/2, boxY + padY + spinF);
    ctx.fillStyle = _C.cream;
    ctx.font = `italic ${famF}px Georgia,"Times New Roman",serif`;
    ctx.fillText('Family Golf', boxX + boxW/2, boxY + padY + spinF + gap + famF);
  }

  // Draw centered logo (scorecard header) — SPINVIBES + Family Golf, no EST.
  function _drawLogoCenter(ctx, cx, y, sf) {
    const spinF = Math.round(36*sf);
    const famF  = Math.round(22*sf);
    const gap   = Math.round(8*sf);
    ctx.textAlign = 'center';
    ctx.fillStyle = _C.gold;
    ctx.font = `bold ${spinF}px "Bebas Neue",Impact,Arial,sans-serif`;
    ctx.fillText('SPINVIBES', cx, y + spinF);
    ctx.fillStyle = _C.cream;
    ctx.font = `italic ${famF}px Georgia,"Times New Roman",serif`;
    ctx.fillText('Family Golf', cx, y + spinF + gap + famF);
    return spinF + gap + famF; // return total height
  }

  function _cardDims() {
    return _shareOrientation === 'landscape' ? { W:1280, H:720 } : { W:720, H:1280 };
  }

  function _makeCanvas(w, h) { const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }

  function _gradBar(ctx, w) {
    const g = ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,_C.goldDim); g.addColorStop(0.5,_C.gold); g.addColorStop(1,_C.goldDim); return g;
  }

  function _rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  function _drawImgCover(ctx, img, x, y, w, h) {
    const ar = img.width/img.height;
    let dw=w, dh=h, dx=x, dy=y;
    if (ar > w/h) { dh=h; dw=h*ar; dx=x-(dw-w)/2; }
    else           { dw=w; dh=w/ar; dy=y-(dh-h)/2; }
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function _canvasToBlob(canvas) { return new Promise(r => canvas.toBlob(r, 'image/png')); }

  function _famTotals() {
    const players = _famRound.players||[], totals={};
    players.forEach(pk => { totals[pk]=0; });
    _famHoles.forEach(h => players.forEach(pk => { totals[pk]+=(h.scores[pk]||0); }));
    return totals;
  }

  // Auto-grid collage — works for 1 to 18+ photos
  async function _drawCollageBackground(ctx, W, H, allPhotos) {
    // Cap at 9, pick evenly spread if more
    const MAX = 9;
    let photos = allPhotos;
    if (photos.length > MAX) {
      photos = Array.from({length: MAX}, (_, i) =>
        allPhotos[Math.floor(i * allPhotos.length / MAX)]);
    }
    const count = photos.length;
    const cols  = count === 1 ? 1 : count <= 4 ? 2 : 3;
    const rows  = Math.ceil(count / cols);
    const cw    = W / cols;
    const ch    = H / rows;

    // Load all images in parallel
    const imgs = await Promise.all(photos.map(p => _loadImg(p)));

    imgs.forEach((img, i) => {
      if (!img) return;
      const col = i % cols;
      const row = Math.floor(i / cols);
      // If last row is not full, center remaining cells
      const rowStart = row * cols;
      const inRow    = Math.min(cols, count - rowStart);
      const offsetX  = inRow < cols ? (W - inRow * cw) / 2 : 0;
      ctx.save();
      ctx.beginPath();
      ctx.rect(offsetX + col * cw, row * ch, cw, ch);
      ctx.clip();
      _drawImgCover(ctx, img, offsetX + col * cw, row * ch, cw, ch);
      ctx.restore();
    });
  }

  // ── SHARED CARD HELPERS ─────────────────────────────────────────

  // Load SpinVibes logo once and cache it
  let _svLogoCache = null;
  async function _loadSvLogo() {
    if (_svLogoCache) return _svLogoCache;
    try { _svLogoCache = await _loadImg('/spinvibes_logo.png'); } catch(e) {}
    return _svLogoCache;
  }

  // Draw logo top-right, gold frame, and top gradient vignette
  async function _drawCardChrome(ctx, W, H, sf) {
    // Subtle top vignette so logo reads on any photo
    const topG = ctx.createLinearGradient(0, 0, 0, H * 0.22);
    topG.addColorStop(0, 'rgba(0,0,0,0.45)');
    topG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topG; ctx.fillRect(0, 0, W, H);

    // Logo — top right
    const logo = await _loadSvLogo();
    if (logo) {
      const logoW = Math.round(200 * sf);
      const logoH  = Math.round(logoW * (logo.height / logo.width));
      const pad    = Math.round(22 * sf);
      ctx.drawImage(logo, W - logoW - pad, pad, logoW, logoH);
    }

    // Gold border frame
    ctx.strokeStyle = '#c9a84c';
    ctx.lineWidth   = Math.round(4 * sf);
    const fi = Math.round(10 * sf);
    ctx.strokeRect(fi, fi, W - fi * 2, H - fi * 2);
  }

  // Bottom gradient: starts at 60% (15% less than before)
  function _bottomGrad(ctx, H) {
    const g = ctx.createLinearGradient(0, H * 0.60, 0, H);
    g.addColorStop(0, 'rgba(10,14,8,0)');
    g.addColorStop(0.45, 'rgba(10,14,8,0.72)');
    g.addColorStop(1, 'rgba(10,14,8,0.97)');
    return g;
  }

  // Draw a player chip — name / big score / vs-par label
  function _drawPlayerChip(ctx, pk, score, par, cx, cy, chipW, chipH, sf, isWinner) {
    const p    = FAM_PLAYERS[pk] || {};
    const diff = score - par;
    const dStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : String(diff));
    const achv = diff <= -2 ? 'Eagle' : diff === -1 ? 'Birdie' : diff === 0 ? 'Par' : null;
    const scoreColor = diff <= -2 ? '#a78bfa' : diff === -1 ? '#fbbf24' : diff === 0 ? '#6ec98a' : _C[pk] || _C.gold;

    // Chip background
    ctx.fillStyle = 'rgba(10,14,8,0.62)';
    _rr(ctx, cx, cy, chipW, chipH, Math.round(10 * sf)); ctx.fill();

    // Winner ring
    if (isWinner) {
      ctx.strokeStyle = _C[pk] || _C.gold;
      ctx.lineWidth   = Math.round(2.5 * sf);
      _rr(ctx, cx, cy, chipW, chipH, Math.round(10 * sf)); ctx.stroke();
    }

    ctx.textAlign = 'center';
    const midX = cx + chipW / 2;

    // Name
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `500 ${Math.round(15 * sf)}px Outfit,Arial,sans-serif`;
    ctx.fillText(p.name || pk, midX, cy + chipH * 0.28);

    // Score
    ctx.fillStyle = scoreColor;
    ctx.font = `500 ${Math.round(52 * sf)}px "Bebas Neue",Impact,Arial,sans-serif`;
    ctx.fillText(String(score), midX, cy + chipH * 0.70);

    // Achievement or vs-par
    const label = achv || dStr;
    ctx.fillStyle = achv ? '#fbbf24' : 'rgba(255,255,255,0.4)';
    ctx.font = `400 ${Math.round(13 * sf)}px Outfit,Arial,sans-serif`;
    ctx.fillText(label, midX, cy + chipH * 0.90);
  }

  // Bottom text: course + date + optional winner line
  function _drawBottomText(ctx, W, H, sf, courseName, date, winLine) {
    const pad = Math.round(20 * sf);
    ctx.textAlign = 'center';
    if (winLine) {
      ctx.fillStyle = _C.gold;
      ctx.font = `500 ${Math.round(16 * sf)}px Outfit,Arial,sans-serif`;
      ctx.fillText(winLine, W / 2, H - pad - Math.round(36 * sf));
    }
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = `400 ${Math.round(13 * sf)}px Outfit,Arial,sans-serif`;
    ctx.fillText(`${(courseName || '').toUpperCase()}  ·  ${date || ''}`, W / 2, H - pad);
  }

  // ── TEMPLATE 1: ROUND SUMMARY ─────────────────────────────────
  async function _buildScorecardCard() {
    const W = 720, H = 1280; // always portrait for scorecard
    const players  = _famRound.players || [];
    const totals   = _famTotals();
    const totalPar = _famHoles.reduce((a, h) => a + h.par, 0);
    const minScore = Math.min(...players.map(pk => totals[pk]));
    const winners  = players.filter(pk => totals[pk] === minScore);
    const front    = _famHoles.slice(0, 9);
    const back     = _famHoles.slice(9, 18);
    const frontPar = front.reduce((a,h) => a+h.par, 0);
    const backPar  = back.reduce((a,h)  => a+h.par, 0);
    const sf       = 0.76;

    const canvas = _makeCanvas(W, H);
    const ctx    = canvas.getContext('2d');

    // ── PHOTO BACKGROUND (top ~38%) ──
    const photos = _famHoles.flatMap(h => h.photos?.length ? h.photos : (h.photo ? [h.photo] : [])).filter(p => _hasPhoto(p));
    ctx.fillStyle = '#0d1a0a'; ctx.fillRect(0, 0, W, H);
    const photoH = Math.round(H * 0.38);
    if (photos.length) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, photoH); ctx.clip();
      await _drawCollageBackground(ctx, W, photoH, photos);
      ctx.restore();
    }

    // Gradient over photo into dark
    const fadeG = ctx.createLinearGradient(0, photoH * 0.45, 0, photoH + 40);
    fadeG.addColorStop(0, 'rgba(13,26,10,0)');
    fadeG.addColorStop(1, 'rgba(13,26,10,1)');
    ctx.fillStyle = fadeG; ctx.fillRect(0, 0, W, photoH + 40);

    // ── COURSE HEADER ──
    const pad = 28;
    let y = photoH - 10;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f5f0e8';
    ctx.font = `500 ${Math.round(42*sf)}px "Bebas Neue",Impact,Arial`;
    ctx.fillText((_famRound.course_name||'').toUpperCase(), W/2, y);
    y += Math.round(28*sf);
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = `400 ${Math.round(17*sf)}px Outfit,Arial`;
    ctx.fillText(`${_famRound.date_played||''}  ·  Par ${totalPar}`, W/2, y);
    y += Math.round(22*sf);

    // ── SCORE GRID ──
    // Helper: draw score cell with golf notation (circle=birdie, square=bogey)
    function _scoreCell(cx, cy, cw, ch, score, par, color) {
      const diff = score - par;
      ctx.fillStyle = color;
      ctx.font = `500 ${Math.round(13.5*sf)}px Outfit,Arial`;
      ctx.textAlign = 'center';
      const tx = cx + cw/2, ty = cy + ch*0.66;

      if (diff <= -2) { // Eagle: double circle
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(9.5*sf), 0, Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(6.5*sf), 0, Math.PI*2); ctx.stroke();
      } else if (diff === -1) { // Birdie: circle
        ctx.beginPath(); ctx.arc(tx, cy+ch/2, Math.round(9*sf), 0, Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
      } else if (diff === 1) { // Bogey: square
        const s=Math.round(10*sf); ctx.strokeStyle=color; ctx.lineWidth=1.5;
        ctx.strokeRect(tx-s, cy+ch/2-s, s*2, s*2);
      } else if (diff >= 2) { // Double+: double square
        const s=Math.round(10*sf), s2=Math.round(13*sf); ctx.strokeStyle=color; ctx.lineWidth=1.2;
        ctx.strokeRect(tx-s, cy+ch/2-s, s*2, s*2);
        ctx.strokeRect(tx-s2, cy+ch/2-s2, s2*2, s2*2);
      }
      ctx.fillStyle = color;
      ctx.fillText(String(score), tx, ty);
    }

    function drawGrid(holes, startY, sectionPar) {
      const numCols = holes.length + 2; // holes + OUT/IN + TOT
      const nameW   = Math.round(54*sf);
      const totW    = Math.round(38*sf);
      const subW    = Math.round(36*sf);
      const holeW   = (W - pad*2 - nameW - subW - totW) / holes.length;
      const rowH    = Math.round(26*sf);

      // Header row (hole numbers)
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(pad, startY, W-pad*2, rowH);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `400 ${Math.round(11*sf)}px Outfit,Arial`;
      ctx.textAlign = 'center';
      holes.forEach((h,i) => ctx.fillText(String(h.hole), pad+nameW+i*holeW+holeW/2, startY+rowH*0.70));
      ctx.fillText(holes.length===9?'OUT':'', pad+nameW+holes.length*holeW+subW/2, startY+rowH*0.70);

      // Par row
      const parY = startY + rowH;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(pad, parY, W-pad*2, rowH);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = `400 ${Math.round(11*sf)}px Outfit,Arial`;
      ctx.textAlign = 'left';
      ctx.fillText('PAR', pad+6, parY+rowH*0.70);
      holes.forEach((h,i) => {
        ctx.textAlign='center';
        ctx.fillText(String(h.par), pad+nameW+i*holeW+holeW/2, parY+rowH*0.70);
      });
      ctx.fillText(String(sectionPar), pad+nameW+holes.length*holeW+subW/2, parY+rowH*0.70);

      // Player rows
      players.forEach((pk, pi) => {
        const p    = FAM_PLAYERS[pk];
        const rowY = parY + rowH*(pi+1);
        if (pi%2===0) { ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(pad,rowY,W-pad*2,rowH); }

        // Name
        ctx.fillStyle = _C[pk]||_C.gold;
        ctx.font = `500 ${Math.round(11.5*sf)}px Outfit,Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(p.name, pad+5, rowY+rowH*0.70);

        // Hole scores
        holes.forEach((h,i) => {
          const sc   = h.scores[pk]||0;
          const diff = sc - h.par;
          const col  = diff<=-1?'#60a5fa': diff===0?'rgba(255,255,255,0.75)': diff===1?'#f87171':'#ef4444';
          _scoreCell(pad+nameW+i*holeW, rowY, holeW, rowH, sc, h.par, col);
        });

        // Section subtotal
        const sub = holes.reduce((a,h)=>a+(h.scores[pk]||0),0);
        const subDiff = sub - sectionPar;
        const subColor = subDiff<0?'#60a5fa':subDiff===0?'rgba(255,255,255,0.6)':'#f87171';
        ctx.fillStyle = subColor;
        ctx.font = `500 ${Math.round(12.5*sf)}px Outfit,Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(String(sub), pad+nameW+holes.length*holeW+subW/2, rowY+rowH*0.70);
      });

      return parY + rowH*(players.length+1);
    }

    // Divider line
    ctx.strokeStyle = 'rgba(201,168,76,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
    y += 8;

    // Front 9
    const afterFront = drawGrid(front, y, frontPar);
    y = afterFront + Math.round(6*sf);

    // Back 9
    const afterBack = back.length ? drawGrid(back, y, backPar) : y;
    y = afterBack + Math.round(10*sf);

    // Divider
    ctx.strokeStyle = 'rgba(201,168,76,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
    y += Math.round(14*sf);

    // ── TOTAL ROW — player chips ──
    const chipW = Math.round(Math.min(155*sf, (W-pad*2-(players.length-1)*8)/players.length));
    const chipH = Math.round(82*sf);
    const chipX0 = (W-(players.length*chipW+(players.length-1)*8))/2;
    players.forEach((pk, i) => {
      _drawPlayerChip(ctx, pk, totals[pk], totalPar, chipX0+i*(chipW+8), y, chipW, chipH, sf, winners.includes(pk));
    });
    y += chipH + Math.round(10*sf);

    // Winner line
    const winLine = winners.length===players.length?'All tied!':
      winners.map(pk=>FAM_PLAYERS[pk]?.name||pk).join(' & ')+(winners.length===1?' wins!':' tie!');
    ctx.fillStyle = _C.gold;
    ctx.font = `500 ${Math.round(15*sf)}px Outfit,Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(winLine, W/2, y + Math.round(14*sf));

    await _drawCardChrome(ctx, W, H, sf);
    return _canvasToBlob(canvas);
  }

  // ── TEMPLATE 2: HOLE HIGHLIGHT ────────────────────────────────
  async function _buildHoleHighlightCard(h) {
    if (!h) return null;
    const { W, H } = _cardDims();
    const canvas   = _makeCanvas(W, H);
    const ctx      = canvas.getContext('2d');
    const players  = _famRound.players || [];
    const sf       = _SF;
    const SAFE     = Math.round(18 * sf);

    ctx.fillStyle = '#0d1a0a'; ctx.fillRect(0, 0, W, H);
    const hlPhoto = h.photos?.[0] || h.photo;
    if (hlPhoto && _hasPhoto(hlPhoto)) {
      const img = await _loadImg(hlPhoto);
      if (img) _drawImgCover(ctx, img, 0, 0, W, H);
    }

    ctx.fillStyle = _bottomGrad(ctx, H); ctx.fillRect(0, 0, W, H);

    // Hole badge top-left
    const bH = Math.round(36 * sf);
    ctx.fillStyle = 'rgba(10,14,8,0.58)';
    _rr(ctx, SAFE, SAFE, Math.round(180 * sf), bH, 8); ctx.fill();
    ctx.fillStyle = _C.gold;
    ctx.font      = `500 ${Math.round(15 * sf)}px Outfit,Arial,sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`Hole ${h.hole}  ·  Par ${h.par}`, SAFE + 12, SAFE + bH * 0.70);

    // Player chips
    const cols   = Math.min(players.length, 4);
    const chipW  = Math.round(Math.min(170 * sf, (W - SAFE * 2 - (cols - 1) * 8) / cols));
    const chipH  = Math.round(108 * sf);
    const chipX0 = (W - (cols * chipW + (cols - 1) * 8)) / 2;
    const chipY0 = H - SAFE - Math.round(44 * sf) - chipH;
    const par    = h.par;

    players.forEach((pk, i) => {
      _drawPlayerChip(ctx, pk, h.scores[pk] || 0, par,
        chipX0 + i * (chipW + 8), chipY0, chipW, chipH, sf, false);
    });

    _drawBottomText(ctx, W, H, sf, _famRound.course_name, _famRound.date_played, null);
    await _drawCardChrome(ctx, W, H, sf);
    return _canvasToBlob(canvas);
  }

  async function pickPlayerAndShareBest(playerKey) {
    const overlay = document.getElementById('best-picker-overlay');
    if (overlay) overlay.remove();

    // Find best hole for this player
    let bestH = null, bestScore = Infinity;
    _famHoles.forEach(h => {
      const diff  = (h.scores[playerKey] || 0) - h.par;
      const bonus = (h.photos?.length || h.photo) ? -0.5 : 0;
      if (diff + bonus < bestScore) { bestScore = diff + bonus; bestH = h; }
    });
    if (!bestH) return;

    const allPhotos = bestH.photos?.length ? bestH.photos : (bestH.photo ? [bestH.photo] : []);

    // If multiple photos on the best hole, ask which one to use
    if (allPhotos.filter(_hasPhoto).length > 1) {
      _showBestPhotoPickerSheet(playerKey, bestH, allPhotos.filter(_hasPhoto));
      return;
    }

    // Single or no photo — build directly
    const btn = document.getElementById('fam-share-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Building...'; }
    try {
      const blob = await _buildBestMomentCard(playerKey);
      if (blob) await _doShare(blob);
    } catch(e) { console.warn('Best moment share error:', e); }
    finally { if (btn) { btn.disabled = false; btn.textContent = '📤 Share'; } }
  }

  function _drawLevelShieldCanvas(ctx, cx, cy, size, level) {
    const lvl_stroke = { 1:'#B0A070', 2:'#5A9A30', 3:'#3070C0', 4:'#A07800' };
    const lvl_fill   = { 1:'#F5EDD8', 2:'#D0EAB8', 3:'#C0D8F8', 4:'#FAD860' };
    const lvl_bg     = { 1:'#E8E0D0', 2:'#B8D8A0', 3:'#A8C8F0', 4:'#F0C030' };
    const tier = level <= 2 ? 1 : level <= 4 ? 2 : level <= 6 ? 3 : 4;
    const sc = lvl_stroke[tier] || '#B0A070';
    const fc = lvl_fill[tier]   || '#F5EDD8';
    const bg = lvl_bg[tier]     || '#E8E0D0';
    const pts = [
      [cx, cy - size * 0.5], [cx + size * 0.45, cy - size * 0.18],
      [cx + size * 0.28, cy + size * 0.46], [cx - size * 0.28, cy + size * 0.46],
      [cx - size * 0.45, cy - size * 0.18],
    ];
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = sc; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = sc;
    ctx.font = `bold ${Math.round(size * 0.55)}px Outfit,Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(String(level), cx, cy + size * 0.2);
  }

  async function _buildBestMomentCard(playerKey, photoIdx) {
    const pk = playerKey;
    const p  = FAM_PLAYERS[pk];
    if (!p) return null;

    let bestH = null, bestScore = Infinity;
    _famHoles.forEach(h => {
      const diff  = (h.scores[pk] || 0) - h.par;
      const bonus = _hasPhoto(h.photo) ? -0.5 : 0;
      if (diff + bonus < bestScore) { bestScore = diff + bonus; bestH = h; }
    });
    if (!bestH) return null;

    const { W, H } = _cardDims();
    const canvas   = _makeCanvas(W, H);
    const ctx      = canvas.getContext('2d');
    const sf       = _SF;
    const score    = bestH.scores[pk] || 0;
    const diff     = score - bestH.par;
    const achv     = diff <= -2 ? 'EAGLE' : diff === -1 ? 'BIRDIE' : diff === 0 ? 'PAR' : null;
    const scoreColor = diff <= -2 ? '#a78bfa' : diff === -1 ? '#fbbf24' : diff === 0 ? '#6ec98a' : _C[pk] || _C.gold;

    ctx.fillStyle = '#0d1a0a'; ctx.fillRect(0, 0, W, H);
    const bmPhotos = bestH.photos?.length ? bestH.photos : (bestH.photo ? [bestH.photo] : []);
    const bmPhoto  = (photoIdx != null ? bmPhotos[photoIdx] : null) || bmPhotos[0] || bestH.photo;
    if (bmPhoto && _hasPhoto(bmPhoto)) {
      const img = await _loadImg(bmPhoto);
      if (img) _drawImgCover(ctx, img, 0, 0, W, H);
    }

    ctx.fillStyle = _bottomGrad(ctx, H); ctx.fillRect(0, 0, W, H);

    // Center content
    const midX = W / 2;
    const midY = H * 0.42;

    // Player avatar circle
    const r = Math.round(36 * sf);
    ctx.fillStyle = _C[pk + 'Bg'] || 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.arc(midX, midY - Math.round(60 * sf), r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = _C[pk] || _C.gold; ctx.lineWidth = Math.round(2 * sf);
    ctx.beginPath(); ctx.arc(midX, midY - Math.round(60 * sf), r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = _C[pk] || _C.gold;
    ctx.font      = `500 ${Math.round(18 * sf)}px Outfit,Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(p.name, midX, midY - Math.round(60 * sf) + Math.round(6 * sf));

    // Hole info
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.font      = `400 ${Math.round(13 * sf)}px Outfit,Arial`;
    ctx.fillText(`Hole ${bestH.hole}  ·  Par ${bestH.par}`, midX, midY);

    // Big score
    ctx.fillStyle = scoreColor;
    ctx.font      = `500 ${Math.round(110 * sf)}px "Bebas Neue",Impact,Arial`;
    ctx.fillText(String(score), midX, midY + Math.round(80 * sf));

    // Achievement label
    if (achv) {
      ctx.fillStyle = '#fbbf24';
      ctx.font      = `500 ${Math.round(22 * sf)}px Outfit,Arial`;
      ctx.fillText(achv, midX, midY + Math.round(108 * sf));
    }

    // Level shield for kids
    if (pk === 'son' || pk === 'girl') {
      const lvl = getKidLevel(pk);
      _drawLevelShieldCanvas(ctx, midX + Math.round(52 * sf), midY + Math.round(58 * sf), Math.round(22 * sf), lvl);
    }

    _drawBottomText(ctx, W, H, sf, _famRound.course_name, _famRound.date_played, null);
    await _drawCardChrome(ctx, W, H, sf);
    return _canvasToBlob(canvas);
  }

  function renderFamSummary() {

    const totals  = {};

    const totalPar = _famHoles.reduce((a, h) => a + h.par, 0);

    const hdrCells  = players.map(pk => `<th style="color:${FAM_PLAYERS[pk].color};">${FAM_PLAYERS[pk].emoji} ${FAM_PLAYERS[pk].name}</th>`).join('');

    const totCells  = players.map(pk => {

    }).join('');

    const minScore = Math.min(...players.map(pk => totals[pk]));
    const winners  = players.filter(pk => totals[pk] === minScore);
    const winMsg   = winners.length === players.length ? '\uD83E\uDD1D Tied!' :

          <tbody>

      <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="saveFamRound(this)">Save to My Game \u2713</button>
      <div style="display:flex;gap:8px;margin-top:8px;">

        <button class="btn-ghost" style="flex:1;" id="fam-share-btn" onclick="showSharePicker()">\ud83d\udce4 Share</button>

  // Stores per-player round objects that failed to save, keyed by player key
  let _famFailedRounds = {};

  async function saveFamRound(btn) {
    btn.disabled = true; btn.textContent = 'Saving...';
    _clearFamDraft(); // round saved — clear in-progress draft
    const players  = _famRound.players;
    const statusEl = document.getElementById('fam-save-status');
    const saved = [], failed = [];

    // Upload hole photos to Supabase Storage before saving
    const roundId   = crypto.randomUUID();
    const hasPhotos = _famHoles.some(h => h.photo && !h.photo.startsWith('http'));
    if (hasPhotos) {
      btn.textContent = 'Uploading photos...';
      await uploadRoundPhotos(roundId);
    }
    btn.textContent = 'Saving...';

    // Build totals map
    const totals = {};
    players.forEach(pk => {
      totals[pk] = _famHoles.reduce((a, h) => a + (h.scores[pk] || 0), 0);
    });

    // Save individual round to each player's table
    for (const pk of players) {
      const p        = FAM_PLAYERS[pk];
      const total    = totals[pk];
      const holeData = _famHoles.map(h => ({
        hole: h.hole, par: h.par, score: h.scores[pk] || 0,
        photo_url: (h.photo && _hasPhoto(h.photo)) ? h.photo : null,
      }));
      const roundObj = {
        date_played:  _famRound.date_played,
        course_name:  _famRound.course_name + ' (Family)',
        course_par:   _famRound.course_par,
        total_score:  total,
        score_vs_par: total - _famRound.course_par,
        holes:        holeData,
        is_practice:  _famRound.is_practice || false,
        reflection:   { best:'', worked:'', worst:'', fix:'', stars:1 },
        stars:        1,
      };
      if (pk === 'dad') roundObj.tee_color = 'White';
      try {
        await p.saveFn(roundObj);
        saved.push(pk);
        delete _famFailedRounds[pk];
      } catch(e) {
        failed.push(pk);
        _famFailedRounds[pk] = roundObj;
      }
    }

    // Save full family round snapshot to family_rounds
    // Strip any remaining base64 (upload failed) so we don't bloat the DB row
    try {
      const safeFamHoles = _famHoles.map(h => ({
        ...h,
        photos: (h.photos || []).filter(_hasPhoto),
        photo: (h.photos?.[0] && _hasPhoto(h.photos[0])) ? h.photos[0] : ((h.photo && _hasPhoto(h.photo)) ? h.photo : null),
      }));
      await saveFamilyRound({
        date_played: _famRound.date_played,
        course_name: _famRound.course_name,
        course_par:  _famRound.course_par,
        players:     players,
        holes:       safeFamHoles,
        totals:      totals,
        is_practice: _famRound.is_practice || false,
      });
    } catch(e) { /* non-fatal \u2014 individual saves already done */ }

    statusEl.innerHTML = '';
    if (saved.length) {
      const savedNames = saved.map(pk => FAM_PLAYERS[pk]?.name || pk).join(', ');
      statusEl.innerHTML += `<div style="color:var(--green);font-size:0.85rem;margin-bottom:6px;">\u2713 Saved for ${savedNames}</div>`;
    }
    if (failed.length) {
      const failedNames = failed.map(pk => FAM_PLAYERS[pk]?.name || pk).join(', ');
      statusEl.innerHTML += `<div style="color:var(--red);font-size:0.85rem;margin-bottom:8px;">\u2717 Failed for ${failedNames} \u2014 check signal</div>`;
      statusEl.innerHTML += `<button onclick="retryFailedFamSaves(this)" style="background:var(--red);border:none;border-radius:8px;padding:9px 18px;color:#fff;font-weight:700;font-size:0.82rem;cursor:pointer;width:100%;">\u21ba Retry Failed Saves</button>`;
    }
    btn.textContent = failed.length === 0 ? 'Saved! \u2713' : 'Partial Save';
    if (failed.length === 0) btn.disabled = false;

    // Check kid milestones for son/girl in family rounds
    if (players.includes('son'))  {
      checkKidMilestones('son',  _famHoles);
      localStorage.setItem('sv-son-played-family', '1');
      localStorage.setItem('sv-son-family-count', String((parseInt(localStorage.getItem('sv-son-family-count')||'0'))+1));
    }
    if (players.includes('girl')) {
      checkKidMilestones('girl', _famHoles);
      localStorage.setItem('sv-girl-played-family', '1');
      localStorage.setItem('sv-girl-family-count', String((parseInt(localStorage.getItem('sv-girl-family-count')||'0'))+1));
    }

    // Fire AI range tip async (account holder only, non-blocking)
    if (players.includes('dad')) {
      const dadScore  = totals['dad'] || 0;
      const diffStr   = dadScore - _famRound.course_par;
      const diffLabel = diffStr === 0 ? 'even par' : (diffStr > 0 ? `+${diffStr}` : `${diffStr}`);
      generatePostRoundRangeTip(dadScore, _famRound.course_par, diffLabel, _famRound.course_name);
    }
  }

  async function generatePostRoundRangeTip(score, par, diffLabel, courseName) {
    try {
      const systemPrompt = `You are a concise golf coach. Based on the round data, output ONE range focus recommendation in a single sentence of 20 words or fewer. Start exactly with "Today at the range, focus on". No punctuation other than a period at the end.`;
      const userMsg = `Round: ${courseName}, score ${score} (${diffLabel} vs par ${par}). What should this player work on at the range?`;
      const resp = await fetch(CADDIE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({
          systemPrompt,
          messages: [{ role: 'user', content: userMsg }],
          max_tokens: 60,
        })
      });
      if (!resp.ok) return;
      const data = await resp.json();
      const tip = (data?.reply || '').trim();
      if (tip) {
        localStorage.setItem('sv-range-ai-tip', JSON.stringify({ tip, date: new Date().toISOString().split('T')[0], course: courseName }));
        renderRangeAiTip();
      }
    } catch(e) { /* non-fatal */ }
  }

  function renderRangeAiTip() {
    const el = document.getElementById('range-ai-tip-text');
    if (!el) return;
    try {
      const stored = JSON.parse(localStorage.getItem('sv-range-ai-tip'));
      if (stored && stored.tip) {
        el.textContent = stored.tip;
        const dateEl = document.getElementById('range-ai-tip-date');
        if (dateEl) dateEl.textContent = stored.course ? `After ${stored.course} · ${stored.date}` : stored.date;
        const row = document.getElementById('range-ai-tip-row');
        if (row) row.style.display = '';
      }
    } catch(e) { /* no tip stored */ }
  }

  async function acSearchCourse() {
    const query    = (document.getElementById('ac-search-input')?.value || '').trim();
    const statusEl = document.getElementById('ac-search-status');
    const resultsEl= document.getElementById('ac-search-results');
    if (!query || query.length < 2) { if (statusEl) statusEl.textContent = 'Type at least 2 characters'; return; }

    if (statusEl) statusEl.textContent = 'Searching…';
    if (resultsEl) resultsEl.innerHTML = '';

    try {
      const resp = await fetch(CADDIE_URL + '/course-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({ query }),
      });
      const data = await resp.json();

      if (!resp.ok || data.error) {
        if (statusEl) statusEl.textContent = data.error || 'Search failed — check your signal';
        return;
      }

      const courses = data.courses || [];
      if (!courses.length) {
        if (statusEl) statusEl.textContent = 'No courses found — try a different name or scan the scorecard below';
        return;
      }

      if (statusEl) statusEl.textContent = `${courses.length} course${courses.length !== 1 ? 's' : ''} found — tap to select`;
      if (resultsEl) {
        resultsEl.innerHTML = courses.map(c => {
          const loc = [c.city, c.state].filter(Boolean).join(', ');
          const sub = c.course ? `<div style="font-size:0.72rem;color:var(--muted);">${c.course}${loc ? ' · ' + loc : ''}</div>` :
                      loc ? `<div style="font-size:0.72rem;color:var(--muted);">${loc}</div>` : '';
          return `<div onclick="acSelectSearchResult(${c.id})"
            style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color 0.15s;"
            onmouseenter="this.style.borderColor='rgba(138,96,16,0.5)'" onmouseleave="this.style.borderColor='var(--border)'">
            <div style="font-size:0.88rem;font-weight:600;color:var(--cream);">${c.name}</div>
            ${sub}
          </div>`;
        }).join('');
      }
    } catch (e) {
      if (statusEl) statusEl.textContent = 'Network error — check your signal';
      console.error(e);
    }
  }

  async function acSelectSearchResult(courseId) {
    const teeColor  = document.querySelector('#ac-tee-pills .pill.active')?.dataset.val || 'White';

    const resultsEl = document.getElementById('ac-search-results');

        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({ courseId, teeColor }),
      });

  async function acParseScorecard() {
    const input = document.getElementById('ac-photo-input');
    const file  = input.files[0];
    if (!file) return;

    const teeColor  = document.querySelector('#ac-tee-pills .pill.active')?.dataset.val || 'White';
    const statusEl  = document.getElementById('ac-parse-status');
    const parseBtn  = document.getElementById('ac-parse-btn');
    parseBtn.disabled = true;
    parseBtn.textContent = 'Reading scorecard…';
    statusEl.textContent = '';

    try {
      // Resize image before sending (max 1400px, saves tokens)
      const resized   = await famResizePhoto(await fileToDataUrl(file), 1400);
      const base64    = resized.split(',')[1];
      const mediaType = resized.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';

      const resp = await fetch(CADDIE_URL + '/parse-scorecard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-SpinVibes-Token': WORKER_SECRET },
        body: JSON.stringify({ image: base64, mediaType, teeColor }),
      });
      const data = await resp.json();
      if (!resp.ok || data.error) {
        statusEl.textContent = data.error || 'Parse failed — try a clearer photo';
        parseBtn.disabled = false;
        parseBtn.textContent = 'Parse Scorecard →';
        return;
      }
      _parsedCourse = data.course;
      renderAcReviewForm(_parsedCourse);
    } catch(e) {
      statusEl.textContent = 'Network error — check your signal';
      console.error(e);
    } finally {
      parseBtn.disabled = false;
      parseBtn.textContent = 'Parse Scorecard →';
    }
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderAcReviewForm(course) {
    const formEl = document.getElementById('ac-review-form');
    formEl.style.display = 'block';

    const holeRows = (course.holePars || []).map((par, i) => `
      <tr>

        <div style="display:flex;gap:10px;">

            <label class="modal-label">City</label>

          </div>
          <div style="flex:0 0 80px;">
            <label class="modal-label">State</label>

            <label class="modal-label">Holes</label>
            <input type="number" id="ac-holes" class="modal-input" value="${course.holes||18}">

        <div style="display:flex;gap:10px;">
          <div style="flex:1;">
            <label class="modal-label">Course Rating</label>

        <div style="margin-top:4px;">

            ${course.allTees.map(t => `
              <button onclick="acSwitchTee(${JSON.stringify(t).replace(/"/g,'&quot;')})"

          <table style="width:100%;border-collapse:collapse;">
            <thead><tr>

  function acSwitchTee(tee) {
    // Swap rating/slope/yardages to the selected tee without re-fetching
    const ratingEl = document.getElementById('ac-rating');
    const slopeEl  = document.getElementById('ac-slope');
    if (ratingEl) ratingEl.value = tee.rating || '';
    if (slopeEl)  slopeEl.value  = tee.slope  || '';
    if (_parsedCourse) {
      _parsedCourse.rating   = tee.rating || null;
      _parsedCourse.slope    = tee.slope  || null;
      _parsedCourse.teeColor = tee.name   || _parsedCourse.teeColor;
    }
    showToast(`Switched to ${tee.name} tees`);
  }

  function acUpdateHole(idx, field, val) {
    if (!_parsedCourse) return;
    if (field === 'par') {
      if (!_parsedCourse.holePars) _parsedCourse.holePars = [];
      _parsedCourse.holePars[idx] = parseInt(val) || 4;
    } else {
      if (!_parsedCourse.yardages) _parsedCourse.yardages = [];
      _parsedCourse.yardages[idx] = parseInt(val) || null;
    }
  }

  async function acSaveCourse() {
    const name  = document.getElementById('ac-name').value.trim();
    const city  = document.getElementById('ac-city').value.trim() || null;
    const state = document.getElementById('ac-state').value.trim().toUpperCase() || null;
    const par   = parseInt(document.getElementById('ac-par').value) || _parsedCourse?.par || 72;
    const holes = parseInt(document.getElementById('ac-holes').value) || _parsedCourse?.holes || 18;
    const teeColor = document.querySelector('#ac-tee-pills .pill.active')?.dataset.val || 'White';

    if (!name) { showToast('Enter a course name', 'error'); return; }

    const saveBtn  = document.querySelector('#ac-review-form .btn-primary');
    const statusEl = document.getElementById('ac-save-status');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

    try {
      const rating = parseFloat(document.getElementById('ac-rating')?.value) || _parsedCourse?.rating || null;
      const slope  = parseInt(document.getElementById('ac-slope')?.value)   || _parsedCourse?.slope  || null;

      const { error } = await _sb.from('courses').insert([{
        name,
        par,
        holes,
        city,
        state,
        tee_color:  teeColor,
        hole_pars:  _parsedCourse?.holePars  || null,
        yardages:   _parsedCourse?.yardages  || null,
        rating:     rating,
        slope:      slope,
        submitted_by: 'jeremy',
      }]);
      if (error) throw error;

      // Reload custom courses so the new one appears in dropdowns
      await loadCustomCourses();
      showToast(`${name} saved!`);
      closeAddCourseOverlay();
      // Re-render the setup modal so the new course appears in the dropdown
      if (_addCourseContext === 'dad')      renderDadModalSetup();
      else if (_addCourseContext === 'son') renderSonModalSetup();
      else if (_addCourseContext === 'fam') renderFamSetup();
    } catch(e) {
      console.error(e);
      if (statusEl) statusEl.textContent = 'Save failed — check your signal';
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save Course ✓'; }
    }
  }

  // ══════════════════════════════════════════════════════════════
  // SPRINT 3 — SETTINGS & PROFILE SYSTEM
  // ══════════════════════════════════════════════════════════════

  // ── Helpers ───────────────────────────────────────────────────
  function getOrCreateDeviceId() {
    let id = localStorage.getItem('sv-device-id');
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem('sv-device-id', id);
    }
    return id;
  }

  function getActivePin()   { return _activePin; }
  function getActiveClubs() { return _activeClubs || CLUBS; }
  function getUserName()    { return _activeProfile?.display_name || 'Jeremy'; }
  function getGoalScore()   { return _activeProfile?.goal_score   || 90; }

  // ── Boot-time profile loader ──────────────────────────────────
  // Called in initApp(). Loads from Supabase and overrides defaults.
  // Fails silently so the app continues working on no-signal.
  async function loadUserProfile() {
    const deviceId = getOrCreateDeviceId();
    try {
      // 1. Profile row — try this device first, fall back to pin_code for cross-device sync
      let { data: profile } = await _sb
        .from('sv_profiles').select('*')
        .eq('device_id', deviceId).maybeSingle();

      if (!profile) {
        // Cross-device: look up by the stored pin (phone finds computer's saved profile)
        const storedPin = localStorage.getItem('sv-pin') || '4417';
        const { data: byPin } = await _sb
          .from('sv_profiles').select('*')
          .eq('pin_code', storedPin).maybeSingle();
        profile = byPin || null;
      }

      if (profile) {
        _activeProfile = profile;
        _activePin = profile.pin_code || '4417';
        localStorage.setItem('sv-pin', _activePin); // persist for cross-device lookup

        // 2. Clubs
        const { data: clubs } = await _sb
          .from('sv_clubs').select('*')
          .eq('profile_id', profile.id)
          .order('sort_order', { ascending: true });
        if (clubs && clubs.length) {
          _activeClubs = clubs.map(c => ({
            name:    c.name,
            display: c.display_name || c.name,
            dist:    c.dist,
            loft:    c.loft || '',
            wedge:   c.is_wedge  || false,
            confirmed: c.confirmed || false,
            note:    c.note || '',
          }));
          localStorage.setItem('sv-active-clubs', JSON.stringify(_activeClubs)); // cache for offline/refresh
        }

        // 3. Family members
        const { data: members } = await _sb
          .from('sv_family_members').select('*')
          .eq('profile_id', profile.id);
        if (members && members.length) {
          members.forEach(m => { _familyMembers[m.role] = m; });
          // Sync skill levels back to localStorage so the level system picks them up
          ['son','daughter'].forEach(role => {
            const m = _familyMembers[role];
            if (m && m.skill_level) {
              localStorage.setItem('sv-' + role + '-level', String(m.skill_level));
            }
          });
        }
      }
    } catch (e) {
      console.warn('[SpinVibes] Profile load skipped (no signal or table missing):', e.message);
    }
  }

  // ── Supabase save helpers ─────────────────────────────────────
  async function saveProfileToSupabase(profileData) {
    const { data, error } = await _sb
      .from('sv_profiles')
      .upsert(profileData, { onConflict: 'device_id' })
      .select().maybeSingle();
    if (error) throw error;
    return data;
  }

  async function saveClubsToSupabase(profileId, clubs) {
    // Delete existing then re-insert (simpler than diff + upsert for a small list)
    await _sb.from('sv_clubs').delete().eq('profile_id', profileId);
    if (!clubs.length) return;
    const rows = clubs.map((c, i) => ({
      profile_id:   profileId,
      name:         c.name,
      display_name: c.display || c.name,
      dist:         c.dist,
      loft:         c.loft || null,
      is_wedge:     c.wedge || false,
      confirmed:    c.confirmed || false,
      note:         c.note || null,
      sort_order:   i,
    }));
    const { error } = await _sb.from('sv_clubs').insert(rows);
    if (error) throw error;
  }

  async function saveFamilyMembersToSupabase(profileId) {
    const roles = ['son', 'daughter', 'mom', 'grandma'];
    for (const role of roles) {
      const m = _familyMembers[role];
      if (!m) continue;
      const { error } = await _sb
        .from('sv_family_members')
        .upsert({ ...m, profile_id: profileId }, { onConflict: 'profile_id,role' });
      if (error) console.warn('Family member save error:', role, error);
    }
  }

  // ── Settings overlay ──────────────────────────────────────────
  function openSettings() {
    const overlay = document.getElementById('settings-overlay');
    if (!overlay) return;
    overlay.style.display = 'block';
    _settingsDirty = false;
    hideSaveBanner();
    populateSettingsForm();
  }

  function closeSettings() {
    const overlay = document.getElementById('settings-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  function markSettingsDirty() {
    _settingsDirty = true;
    const banner = document.getElementById('settings-save-banner');
    if (banner) banner.style.display = 'flex';
  }

  function hideSaveBanner() {
    const banner = document.getElementById('settings-save-banner');
    if (banner) banner.style.display = 'none';
    _settingsDirty = false;
  }

  function populateSettingsForm() {
    // My Profile
    const p = _activeProfile || {};
    const nameEl  = document.getElementById('set-name');
    const goalEl  = document.getElementById('set-goal');
    const handEl  = document.getElementById('set-hand');
    const skillEl = document.getElementById('set-skill');
    if (nameEl)  nameEl.value  = p.display_name || 'Jeremy';
    if (goalEl)  goalEl.value  = p.goal_score   || 90;
    if (handEl)  handEl.value  = p.handedness   || 'left';
    if (skillEl) skillEl.value = p.skill_level  || 'intermediate';
    const tendEl = document.getElementById('set-tendency');
    if (tendEl)  tendEl.value  = localStorage.getItem('sv-dad-tendency') || '';

    // Bag — deep copy so edits don't mutate active clubs until Save
    _settingsClubs = getActiveClubs().map(c => ({ ...c }));
    renderSettingsBag();

    // Family
    const roles = ['son', 'daughter', 'mom', 'grandma'];
    roles.forEach(role => {
      const m = _familyMembers[role] || {};
      const nameIn = document.getElementById('fam-' + role + '-name');
      if (nameIn) nameIn.value = m.display_name || capitalize(role);

      if (role === 'son' || role === 'daughter') {
        const lvl = m.skill_level || parseInt(localStorage.getItem('sv-' + role + '-level') || '1');
        _familyMembers[role] = { ...m, role, skill_level: lvl };
        updateFamilyLevelBadge(role, lvl);
        const driverIn = document.getElementById('fam-' + role + '-driver');
        const ironIn   = document.getElementById('fam-' + role + '-iron');
        const wedgeIn  = document.getElementById('fam-' + role + '-wedge');
        if (driverIn) driverIn.value = m.driver_dist || '';
        if (ironIn)   ironIn.value   = m.iron_dist   || '';
        if (wedgeIn)  wedgeIn.value  = m.wedge_dist  || '';
      }
      if (role === 'mom') {
        const skillIn = document.getElementById('fam-mom-skill');
        if (skillIn) skillIn.value = m.skill_level_text || 'beginner';
      }
      if (role === 'grandma') {
        const skillIn = document.getElementById('fam-grandma-skill');
        if (skillIn) skillIn.value = m.skill_level_text || 'returning';
      }
    });

    // Set today's date as default for log-round
    const logDate = document.getElementById('log-round-date');
    if (logDate) logDate.value = new Date().toISOString().slice(0, 10);

    // Device info
    const devEl = document.getElementById('settings-device-id');
    if (devEl) devEl.textContent = getOrCreateDeviceId().slice(0, 12) + '…';
    const srcEl = document.getElementById('settings-profile-source');
    if (srcEl) srcEl.textContent = _activeProfile ? 'Supabase ✓' : 'Defaults (not yet saved)';
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ── Bag Editor ────────────────────────────────────────────────
  function renderSettingsBag() {
    const el = document.getElementById('settings-bag-list');
    if (!el) return;
    if (!_settingsClubs.length) {
      el.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:0.85rem;text-align:center;">No clubs yet. Add one below.</div>';
      return;
    }
    el.innerHTML = _settingsClubs.map((c, i) => `
      <div class="settings-bag-row">
        <span class="settings-bag-name">${c.display || c.name}</span>
        <input class="settings-bag-dist-input"
          type="number" min="1" max="400"
          value="${c.dist}"
          onchange="updateClubDist(${i}, this.value)"
          oninput="markSettingsDirty()" />
        <span style="font-size:0.7rem;color:var(--muted);">yds</span>
        <button class="settings-bag-confirmed ${c.confirmed ? 'is-confirmed' : 'is-estimated'}"
          onclick="toggleClubConfirmed(${i})">
          ${c.confirmed ? '✓ Confirmed' : 'Est.'}
        </button>
        <button class="settings-bag-remove" onclick="removeClub(${i})" title="Remove">
          <i class="ti ti-x"></i>
        </button>
      </div>
    `).join('');
  }

  function updateClubDist(i, val) {
    if (_settingsClubs[i]) {
      _settingsClubs[i].dist = parseInt(val) || _settingsClubs[i].dist;
      markSettingsDirty();
    }
  }

  function toggleClubConfirmed(i) {
    if (_settingsClubs[i]) {
      _settingsClubs[i].confirmed = !_settingsClubs[i].confirmed;
      markSettingsDirty();
      renderSettingsBag();
    }
  }

  function removeClub(i) {
    _settingsClubs.splice(i, 1);
    markSettingsDirty();
    renderSettingsBag();
  }

  function openAddClubForm() {
    const form = document.getElementById('add-club-form');
    if (form) form.style.display = 'block';
    const nameIn = document.getElementById('new-club-name');
    if (nameIn) nameIn.focus();
  }

  function addNewClub() {
    const name  = (document.getElementById('new-club-name')?.value || '').trim();
    const dist  = parseInt(document.getElementById('new-club-dist')?.value) || 0;
    const loft  = (document.getElementById('new-club-loft')?.value  || '').trim();
    const wedge = document.getElementById('new-club-wedge')?.checked || false;

    if (!name)  { showToast('Enter a club name', 'error'); return; }
    if (!dist)  { showToast('Enter a carry distance', 'error'); return; }

    _settingsClubs.push({ name, display: name, dist, loft, wedge, confirmed: false, note: '' });
    markSettingsDirty();
    renderSettingsBag();

    // Reset form
    ['new-club-name','new-club-dist','new-club-loft'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    const wedgeEl = document.getElementById('new-club-wedge');
    if (wedgeEl) wedgeEl.checked = false;
    const form = document.getElementById('add-club-form');
    if (form) form.style.display = 'none';
  }

  // ── Family Level Controls ─────────────────────────────────────
  function adjustFamilyLevel(role, delta) {
    const current = _familyMembers[role]?.skill_level
      || parseInt(localStorage.getItem('sv-' + role + '-level') || '1');
    const next = Math.min(4, Math.max(1, current + delta));
    if (!_familyMembers[role]) _familyMembers[role] = { role };
    _familyMembers[role].skill_level = next;
    updateFamilyLevelBadge(role, next);
    markSettingsDirty();
  }

  function updateFamilyLevelBadge(role, level) {
    const badge = document.getElementById('fam-' + role + '-level-badge');
    if (badge) badge.textContent = 'Lv ' + level;
  }

  // ── PIN Change ────────────────────────────────────────────────
  async function changePin() {
    const newPin  = (document.getElementById('pin-new')?.value     || '').trim();
    const confirm = (document.getElementById('pin-confirm')?.value  || '').trim();
    const msgEl   = document.getElementById('pin-change-msg');

    function pinMsg(text, ok) {
      if (!msgEl) return;
      msgEl.style.display = 'block';
      msgEl.style.color = ok ? 'var(--green)' : 'var(--red, #ef4444)';
      msgEl.textContent = text;
    }

    if (newPin.length !== 4 || !/^\d{4}$/.test(newPin)) { pinMsg('New PIN must be exactly 4 digits.', false); return; }
    if (newPin !== confirm) { pinMsg('PINs don\'t match — re-enter and try again.', false); return; }

    // Update in memory immediately
    _activePin = newPin;
    if (_activeProfile) _activeProfile.pin_code = newPin;

    // Persist to Supabase
    try {
      const deviceId = getOrCreateDeviceId();
      await _sb.from('sv_profiles')
        .upsert({
          device_id: deviceId,
          pin_code: newPin,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'device_id' });
      pinMsg('PIN updated successfully.', true);
    } catch(e) {
      pinMsg('Saved locally — will sync when online.', true);
    }

    // Clear fields
    ['pin-new','pin-confirm'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }

  // ── Save All ──────────────────────────────────────────────────
  async function saveAllSettings() {
    const saveBtn = document.querySelector('#settings-overlay .btn-primary:last-of-type');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

    try {
      const deviceId = getOrCreateDeviceId();

      // 1. Collect profile fields
      const display_name = document.getElementById('set-name')?.value.trim()  || 'Golfer';
      const goal_score   = parseInt(document.getElementById('set-goal')?.value)  || 90;
      const handedness   = document.getElementById('set-hand')?.value            || 'left';
      const skill_level  = document.getElementById('set-skill')?.value           || 'intermediate';
      const tendency     = document.getElementById('set-tendency')?.value        || '';
      localStorage.setItem('sv-dad-tendency', tendency);

      // 2. Upsert profile
      const saved = await saveProfileToSupabase({
        device_id: deviceId, display_name, goal_score,
        handedness, skill_level, pin_code: _activePin,
        updated_at: new Date().toISOString(),
      });
      _activeProfile = saved;

      // 3. Save clubs — Supabase + localStorage cache (cache survives refresh without Supabase)
      await saveClubsToSupabase(saved.id, _settingsClubs);
      _activeClubs = _settingsClubs.map(c => ({ ...c }));
      localStorage.setItem('sv-active-clubs', JSON.stringify(_activeClubs));

      // 4. Collect + save family members
      ['son','daughter','mom','grandma'].forEach(role => {
        const nameIn = document.getElementById('fam-' + role + '-name');
        const display_name = nameIn?.value.trim() || capitalize(role);
        if (!_familyMembers[role]) _familyMembers[role] = { role };
        _familyMembers[role].display_name = display_name;

        if (role === 'son' || role === 'daughter') {
          const lvl = _familyMembers[role].skill_level
            || parseInt(localStorage.getItem('sv-' + role + '-level') || '1');
          _familyMembers[role].skill_level = lvl;
          // Also update localStorage so live level system picks it up
          localStorage.setItem('sv-' + role + '-level', String(lvl));
          _familyMembers[role].driver_dist = parseInt(document.getElementById('fam-' + role + '-driver')?.value) || null;
          _familyMembers[role].iron_dist   = parseInt(document.getElementById('fam-' + role + '-iron')?.value)   || null;
          _familyMembers[role].wedge_dist  = parseInt(document.getElementById('fam-' + role + '-wedge')?.value)  || null;
        }
        if (role === 'mom')    _familyMembers[role].skill_level_text = document.getElementById('fam-mom-skill')?.value    || 'beginner';
        if (role === 'grandma') _familyMembers[role].skill_level_text = document.getElementById('fam-grandma-skill')?.value || 'returning';
      });
      await saveFamilyMembersToSupabase(saved.id);

      // 5. Update any live UI that depends on profile data
      updateLiveProfileUI();

      showToast('Settings saved!');
      hideSaveBanner();

      const srcEl = document.getElementById('settings-profile-source');
      if (srcEl) srcEl.textContent = 'Supabase ✓';
    } catch(e) {
      console.error('Settings save error:', e);
      showToast('Save failed — check signal', 'error');
    } finally {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save All Settings'; }
    }
  }

  // Refresh live UI elements that depend on loaded profile data
  function updateLiveProfileUI() {
    // Refresh Dad home-hero name if shown (update any elements with id 'dad-name-display')
    document.querySelectorAll('.dad-name-display').forEach(el => {
      el.textContent = getUserName();
    });
    // Refresh Next Target display
    document.querySelectorAll('.dad-goal-display').forEach(el => {
      el.textContent = '<' + getGoalScore();
    });
    // Re-render bag details table if it's currently open
    const bagDetails = document.getElementById('bag-details');
    if (bagDetails && bagDetails.style.display !== 'none') renderBagDetails();
  }

  // ── Log a Past Round ──────────────────────────────────────────
  async function logPastRound() {
    const player  = document.getElementById('log-round-player')?.value || 'dad';
    const date    = document.getElementById('log-round-date')?.value   || new Date().toISOString().slice(0,10);
    const course  = (document.getElementById('log-round-course')?.value || '').trim();
    const score   = parseInt(document.getElementById('log-round-score')?.value) || 0;
    const par     = parseInt(document.getElementById('log-round-par')?.value)   || 72;
    const notes   = (document.getElementById('log-round-notes')?.value || '').trim();
    const msgEl   = document.getElementById('log-round-msg');

    function logMsg(text, ok) {
      if (!msgEl) return;
      msgEl.style.display = 'block';
      msgEl.style.color = ok ? 'var(--green)' : 'var(--red, #ef4444)';
      msgEl.textContent = text;
    }

    if (!course) { logMsg('Enter the course name.', false); return; }
    if (!score || score < 40 || score > 200) { logMsg('Enter a valid score (40–200).', false); return; }

    const roundObj = {
      date_played:  date,
      course_name:  course,
      course_par:   par,
      total_score:  score,
      score_vs_par: score - par,
      holes:        [],   // no per-hole data for manual log
      stars:        1,
      reflection:   { best: '', worked: '', worst: '', fix: '', stars: 1, notes },
      is_practice:  false,
    };

    const saveBtn = document.querySelector('#settings-overlay .btn-primary');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

    try {
      if (player === 'dad') {
        roundObj.tee_color = 'White';
        await saveDadRound(roundObj);
      } else if (player === 'son') {
        await saveSonRound(roundObj);
      } else if (player === 'daughter') {
        await saveGirlRound(roundObj);
      } else if (player === 'mom') {
        await saveMomRound(roundObj);
      } else if (player === 'grandma') {
        await saveGrandmaRound(roundObj);
      }

      // Also save notes to sv_round_notes if notes provided
      // (Round ID not available for manual logs, so we skip that here)

      logMsg('Round saved! View it in My Game.', true);
      ['log-round-course','log-round-score','log-round-notes'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const logPar = document.getElementById('log-round-par');
      if (logPar) logPar.value = '';
    } catch(e) {
      console.error(e);
      logMsg('Save failed — check your signal.', false);
    } finally {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save Round'; }
    }
  }

  // ══════════════════════════════════════════════════════════════
  // END SPRINT 3 — SETTINGS
  // ══════════════════════════════════════════════════════════════

  async function retryFailedFamSaves(btn) {
    btn.disabled = true; btn.textContent = 'Retrying...';
    const statusEl = document.getElementById('fam-save-status');
    const nowSaved = [], stillFailed = [];

    for (const pk of Object.keys(_famFailedRounds)) {
      const p = FAM_PLAYERS[pk];
      if (!p) continue;
      try {
        await p.saveFn(_famFailedRounds[pk]);
        nowSaved.push(p.name);
        delete _famFailedRounds[pk];
      } catch(e) {
        stillFailed.push(p.name);
      }
    }

    statusEl.innerHTML = '';
    if (nowSaved.length) statusEl.innerHTML += `<div style="color:var(--green);font-size:0.85rem;margin-bottom:6px;">\u2713 Saved for ${nowSaved.join(', ')}</div>`;
    if (stillFailed.length) {
      statusEl.innerHTML += `<div style="color:var(--red);font-size:0.85rem;margin-bottom:8px;">\u2717 Still failing for ${stillFailed.join(', ')} \u2014 try again when you have signal</div>`;
      statusEl.innerHTML += `<button onclick="retryFailedFamSaves(this)" style="background:var(--red);border:none;border-radius:8px;padding:9px 18px;color:#fff;font-weight:700;font-size:0.82rem;cursor:pointer;width:100%;">\u21ba Retry Again</button>`;
    } else {
      btn.textContent = 'All Saved! \u2713';
    }
  }

</script>
